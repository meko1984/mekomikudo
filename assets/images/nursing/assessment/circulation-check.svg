    <path d="M164 321 67 286" stroke="#c1915e"/>
  </g>
  <g font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" fill="#365d64">
    <text x="22" y="158">橈骨動脈</text><text x="18" y="276">下腿の浮腫</text><text x="18" y="376">足背動脈</text>
  </g>
  <g font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="700" fill="#668ca5"><text x="188" y="390" text-anchor="middle">手首・下腿・足背を左右で比べる</text></g>
</svg>
