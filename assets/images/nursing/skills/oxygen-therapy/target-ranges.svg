  <path d="M190 56h62M98 137h62" stroke="#6f9b83" stroke-linecap="round" stroke-width="18"/>
  <g fill="#365b6d" font-family="system-ui, sans-serif" font-weight="700">
    <text x="36" y="31" font-size="15">多くの成人</text><text x="194" y="91" font-size="25">94–98%</text>
    <text x="36" y="112" font-size="14">CO₂貯留リスク</text><text x="100" y="174" font-size="25">88–92%</text>
