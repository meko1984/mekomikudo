<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc">
  <title id="title">IADが悪化する循環</title><desc id="desc">尿便と湿気、皮膚のふやけ、摩擦、バリア低下の循環を、やさしい洗浄と皮膚保護で断つ図。</desc><rect width="320" height="200" rx="20" fill="#fbf7f4"/>
  <g font-family="Arial,'Noto Sans JP',sans-serif" font-size="13" font-weight="700" text-anchor="middle"><circle cx="160" cy="100" r="40" fill="#fff" stroke="#d77f70" stroke-width="4"/><text x="160" y="96" fill="#7e4b42">皮膚バリア</text><text x="160" y="114" fill="#7e4b42">低下</text><rect x="20" y="27" width="92" height="40" rx="14" fill="#fff0d9"/><text x="66" y="52" fill="#77562c">尿・便・湿気</text><rect x="208" y="27" width="92" height="40" rx="14" fill="#e7f2f7"/><text x="254" y="52" fill="#3e6377">皮膚がふやける</text><rect x="208" y="140" width="92" height="40" rx="14" fill="#f5e8e5"/><text x="254" y="165" fill="#7e4b42">摩擦で傷つく</text></g>
  <g fill="none" stroke="#d59a66" stroke-width="5" stroke-linecap="round"><path d="M111 47h87"/><path d="m188 37 12 10-12 10"/><path d="M270 72v57"/><path d="m260 119 10 12 10-12"/><path d="M207 160h-35"/><path d="m182 150-12 10 12 10"/></g>
  <path d="M105 151 44 174" stroke="#5b9299" stroke-width="7" stroke-linecap="round"/><path d="m48 159-7 16 17 6" fill="none" stroke="#5b9299" stroke-width="6"/><text x="78" y="135" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="13" font-weight="700" fill="#35666c">やさしく洗う</text><text x="78" y="151" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="13" font-weight="700" fill="#35666c">押さえて乾かす</text>
</svg>
