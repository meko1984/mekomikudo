<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">血流信号確認の流れ</title><style>.t{font:700 20px sans-serif;fill:#243f46}.h{font:700 14px sans-serif;fill:#243f46}.s{font:12px sans-serif;fill:#48636a}.b{fill:#fff;stroke:#78a9b2;stroke-width:2}.n{fill:#477e88}.a{stroke:#b35368;stroke-width:4;fill:none}</style><rect width="880" height="320" rx="24" fill="#edf7f7"/><text class="t" x="440" y="38" text-anchor="middle">弱い力で当て、角度と位置を小さく調整する</text><g transform="translate(24 78)"><rect class="b" width="122" height="150" rx="18"/><circle class="n" cx="61" cy="31" r="17"/><text x="61" y="37" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">1</text><text class="h" x="61" y="78" text-anchor="middle">観察・触診</text><text class="s" x="61" y="104" text-anchor="middle">走行を予測</text></g><g transform="translate(166 78)"><rect class="b" width="122" height="150" rx="18"/><circle class="n" cx="61" cy="31" r="17"/><text x="61" y="37" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">2</text><text class="h" x="61" y="78" text-anchor="middle">ゼリー</text><text class="s" x="61" y="104" text-anchor="middle">空気を除く</text></g><g transform="translate(308 78)"><rect class="b" width="122" height="150" rx="18"/><circle class="n" cx="61" cy="31" r="17"/><text x="61" y="37" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">3</text><text class="h" x="61" y="78" text-anchor="middle">軽く傾ける</text><text class="s" x="61" y="104" text-anchor="middle">45～60度目安</text></g><g transform="translate(450 78)"><rect class="b" width="122" height="150" rx="18"/><circle class="n" cx="61" cy="31" r="17"/><text x="61" y="37" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">4</text><text class="h" x="61" y="78" text-anchor="middle">信号を探す</text><text class="s" x="61" y="104" text-anchor="middle">位置・角度・向き</text></g><g transform="translate(592 78)"><rect class="b" width="122" height="150" rx="18"/><circle class="n" cx="61" cy="31" r="17"/><text x="61" y="37" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">5</text><text class="h" x="61" y="78" text-anchor="middle">左右比較</text><text class="s" x="61" y="104" text-anchor="middle">同名動脈</text></g><g transform="translate(734 78)"><rect class="b" width="122" height="150" rx="18"/><circle class="n" cx="61" cy="31" r="17"/><text x="61" y="37" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">6</text><text class="h" x="61" y="78" text-anchor="middle">記録・清拭</text><text class="s" x="61" y="104" text-anchor="middle">部位を明記</text></g><text class="s" x="440" y="272" text-anchor="middle">強い圧迫は細い血管の信号を消してしまう</text></svg>
