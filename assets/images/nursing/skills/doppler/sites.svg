<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">末梢動脈の確認位置</title><style>.t{font:700 20px sans-serif;fill:#243f46}.h{font:700 15px sans-serif;fill:#243f46}.s{font:13px sans-serif;fill:#48636a}.b{fill:#fff;stroke:#78a9b2;stroke-width:2}.v{stroke:#b35368;stroke-width:7;fill:none;stroke-linecap:round}</style><rect width="880" height="320" rx="24" fill="#edf7f7"/><text class="t" x="440" y="38" text-anchor="middle">血管の走行を意識して、同名動脈を左右で比べる</text><g transform="translate(35 74)"><rect class="b" width="250" height="170" rx="20"/><path d="M105 28v58l-33 46M105 86l42 46" class="v"/><circle cx="105" cy="88" r="8" fill="#b35368"/><circle cx="73" cy="130" r="8" fill="#b35368"/><circle cx="145" cy="130" r="8" fill="#b35368"/><text class="h" x="180" y="55">上腕動脈</text><text class="h" x="20" y="155">橈骨動脈</text><text class="h" x="150" y="155">尺骨動脈</text></g><g transform="translate(315 74)"><rect class="b" width="250" height="170" rx="20"/><path d="M90 24c0 45-2 76-18 122M90 72c32 20 54 41 67 72" class="v"/><circle cx="72" cy="142" r="9" fill="#b35368"/><circle cx="157" cy="142" r="9" fill="#b35368"/><text class="h" x="20" y="163">足背動脈</text><text class="h" x="143" y="163">後脛骨動脈</text></g><g transform="translate(595 74)"><rect class="b" width="250" height="170" rx="20"/><circle cx="125" cy="75" r="42" fill="#f4c4b5"/><path d="M100 91c17-9 35-10 52-2" class="v"/><circle cx="110" cy="88" r="8" fill="#b35368"/><circle cx="145" cy="88" r="8" fill="#b35368"/><text class="h" x="125" y="139" text-anchor="middle">2か所を確認</text><text class="s" x="125" y="160" text-anchor="middle">足背 ＋ 内果後方</text></g><text class="s" x="440" y="282" text-anchor="middle">部位名を明確に記録し、「足の脈」だけにしない</text></svg>
