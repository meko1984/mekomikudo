<style>.h{font:700 18px sans-serif;fill:#243f46}.s{font:14px sans-serif;fill:#48636a}.b{font:700 15px sans-serif;fill:#243f46}.l{fill:none;stroke:#48636a;stroke-width:1.5}</style>
<rect width="390" height="450" rx="18" fill="#edf7f7"/><text class="h" x="195" y="32" text-anchor="middle">後脛骨動脈の目印</text><text class="s" x="195" y="59" text-anchor="middle">足関節を内側から見る</text><text class="s" x="30" y="94">前方（つま先）</text><text class="s" x="259" y="94">後方（踵）</text>
