<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">末梢循環の観察</title><style>.t{font:700 20px sans-serif;fill:#243f46}.h{font:700 15px sans-serif;fill:#243f46}.s{font:12px sans-serif;fill:#48636a}.b{fill:#fff;stroke:#78a9b2;stroke-width:2}</style><rect width="880" height="320" rx="24" fill="#edf7f7"/><text class="t" x="440" y="38" text-anchor="middle">音を探す前に、左右の四肢を見て触れる</text><g transform="translate(28 75)"><rect class="b" width="124" height="160" rx="18"/><circle cx="62" cy="58" r="23" fill="#f4c4b5"/><path d="M50 58h24" stroke="#b35368" stroke-width="4"/><text class="h" x="62" y="116" text-anchor="middle">疼痛</text><text class="s" x="62" y="139" text-anchor="middle">突然・安静時</text></g><g transform="translate(168 75)"><rect class="b" width="124" height="160" rx="18"/><path d="M38 35h48v50H38z" fill="#f5d8d0"/><path d="M38 60h48" stroke="#b35368" stroke-width="3"/><text class="h" x="62" y="116" text-anchor="middle">皮膚色</text><text class="s" x="62" y="139" text-anchor="middle">蒼白・チアノーゼ</text></g><g transform="translate(308 75)"><rect class="b" width="124" height="160" rx="18"/><path d="M56 30v48a16 16 0 1 0 12 0V30a6 6 0 0 0-12 0z" fill="#dcebed" stroke="#477e88" stroke-width="3"/><text class="h" x="62" y="116" text-anchor="middle">温度</text><text class="s" x="62" y="139" text-anchor="middle">冷感・左右差</text></g><g transform="translate(448 75)"><rect class="b" width="124" height="160" rx="18"/><circle cx="62" cy="57" r="28" fill="#f4c4b5"/><path d="M62 37v40M42 57h40" stroke="#fff" stroke-width="5"/><text class="h" x="62" y="116" text-anchor="middle">再充満</text><text class="s" x="62" y="139" text-anchor="middle">毛細血管</text></g><g transform="translate(588 75)"><rect class="b" width="124" height="160" rx="18"/><path d="M33 66c18-35 40-35 58 0M42 66c11-19 29-19 40 0" fill="none" stroke="#477e88" stroke-width="4"/><text class="h" x="62" y="116" text-anchor="middle">感覚・運動</text><text class="s" x="62" y="139" text-anchor="middle">しびれ・筋力</text></g><g transform="translate(728 75)"><rect class="b" width="124" height="160" rx="18"/><path d="M22 62h20l10-30 15 58 13-42 12 14h10" fill="none" stroke="#b35368" stroke-width="4"/><text class="h" x="62" y="116" text-anchor="middle">脈拍</text><text class="s" x="62" y="139" text-anchor="middle">触診・信号</text></g><text class="s" x="440" y="278" text-anchor="middle">一つの所見だけでなく、症状・皮膚・神経・血流を合わせる</text></svg>
