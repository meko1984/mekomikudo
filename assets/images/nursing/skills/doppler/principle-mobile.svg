<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 790" role="img" aria-labelledby="t"><title id="t">ドップラーのしくみ</title><style>.t{font:700 20px sans-serif;fill:#243f46}.h{font:700 18px sans-serif;fill:#243f46}.s{font:17px sans-serif;fill:#48636a}.b{fill:#fff;stroke:#78a9b2;stroke-width:2}.a{stroke:#b35368;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="390" height="790" rx="24" fill="#edf7f7"/><text class="t" x="20" y="35">動く血球から返る</text><text class="t" x="20" y="69">超音波の変化を捉える</text><g transform="translate(85 90)"><rect class="b" width="220" height="184" rx="22"/><path d="M61 47l34 24-28 40-34-24z" fill="#dcebed" stroke="#477e88" stroke-width="3"/><path d="M94 78l74 34M92 88l70 42" stroke="#78a9b2" stroke-width="3"/><text class="h" x="110" y="160" text-anchor="middle">超音波を送る</text></g><path class="a" d="M195 282v12m-8-9 8 9 8-9"/><g transform="translate(85 300)"><rect class="b" width="220" height="184" rx="22"/><path d="M26 78h168" stroke="#b35368" stroke-width="18" stroke-linecap="round"/><circle cx="71" cy="78" r="7" fill="#fff"/><circle cx="110" cy="78" r="7" fill="#fff"/><circle cx="149" cy="78" r="7" fill="#fff"/><path d="M62 50l20-12M100 50l20-12M140 50l20-12" stroke="#477e88" stroke-width="3"/><text class="h" x="110" y="160" text-anchor="middle">血球が動いている</text></g><path class="a" d="M195 492v12m-8-9 8 9 8-9"/><g transform="translate(125 510)"><rect class="b" width="140" height="184" rx="22"/><path d="M25 76h18l10-28 15 57 14-41 12 12h21" fill="none" stroke="#477e88" stroke-width="5"/><text class="h" x="70" y="160" text-anchor="middle">音・波形</text></g><text class="s" x="20" y="738">信号の有無だけで血流量や</text><text class="s" x="20" y="764">閉塞部位を確定しない</text></svg>
