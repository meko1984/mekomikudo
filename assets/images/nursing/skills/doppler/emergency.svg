<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">急性下肢虚血を疑う変化</title><style>.t{font:700 20px sans-serif;fill:#5d2b37}.h{font:700 14px sans-serif;fill:#5d2b37}.s{font:12px sans-serif;fill:#6d5158}.b{fill:#fff;stroke:#cf8d9b;stroke-width:2}</style><rect width="880" height="320" rx="24" fill="#fbf0f2"/><text class="t" x="440" y="38" text-anchor="middle">突然の変化は、信号探しより緊急評価を優先</text><g transform="translate(25 77)"><rect class="b" width="125" height="151" rx="18"/><path d="M36 70c15-35 38-35 53 0" fill="none" stroke="#b35368" stroke-width="5"/><text class="h" x="62" y="109" text-anchor="middle">疼痛</text><text class="s" x="62" y="132" text-anchor="middle">急な強い痛み</text></g><g transform="translate(166 77)"><rect class="b" width="125" height="151" rx="18"/><circle cx="62" cy="55" r="27" fill="#f6e2e5" stroke="#b35368" stroke-width="3"/><text class="h" x="62" y="109" text-anchor="middle">蒼白</text><text class="s" x="62" y="132" text-anchor="middle">色の左右差</text></g><g transform="translate(307 77)"><rect class="b" width="125" height="151" rx="18"/><path d="M24 60h18l9-28 14 56 13-40 11 12h12" fill="none" stroke="#b35368" stroke-width="4"/><path d="M28 27l68 66" stroke="#5d2b37" stroke-width="4"/><text class="h" x="62" y="109" text-anchor="middle">信号消失</text><text class="s" x="62" y="132" text-anchor="middle">急な減弱も</text></g><g transform="translate(448 77)"><rect class="b" width="125" height="151" rx="18"/><path d="M31 68c16-38 46-38 62 0M42 68c10-20 30-20 40 0" fill="none" stroke="#b35368" stroke-width="4"/><text class="h" x="62" y="109" text-anchor="middle">感覚低下</text><text class="s" x="62" y="132" text-anchor="middle">しびれ</text></g><g transform="translate(589 77)"><rect class="b" width="125" height="151" rx="18"/><path d="M32 72l30-42 31 42M62 30v60" fill="none" stroke="#b35368" stroke-width="5"/><text class="h" x="62" y="109" text-anchor="middle">運動障害</text><text class="s" x="62" y="132" text-anchor="middle">動かせない</text></g><g transform="translate(730 77)"><rect class="b" width="125" height="151" rx="18"/><path d="M62 24v58M38 41l48 28M38 69l48-28" stroke="#477e88" stroke-width="4"/><text class="h" x="62" y="109" text-anchor="middle">冷感</text><text class="s" x="62" y="132" text-anchor="middle">著しい左右差</text></g><text class="s" x="440" y="277" text-anchor="middle">発症時刻と変化を確認し、直ちに報告する</text></svg>
