<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">ドップラー信号の模式図</title><style>.t{font:700 20px sans-serif;fill:#243f46}.h{font:700 16px sans-serif;fill:#243f46}.s{font:13px sans-serif;fill:#48636a}.b{fill:#fff;stroke:#78a9b2;stroke-width:2}.w{fill:none;stroke:#b35368;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style><rect width="880" height="320" rx="24" fill="#edf7f7"/><text class="t" x="440" y="38" text-anchor="middle">音・波形は、血管と臨床状況を合わせて捉える</text><g transform="translate(38 74)"><rect class="b" width="250" height="170" rx="20"/><path class="w" d="M22 92h24l18-54 17 82 18-45 18 17h28l18-54 17 82 18-45 18 17h18"/><text class="h" x="125" y="139" text-anchor="middle">多相性・鋭い</text><text class="s" x="125" y="160" text-anchor="middle">末梢動脈でよくみる</text></g><g transform="translate(315 74)"><rect class="b" width="250" height="170" rx="20"/><path class="w" d="M22 105c25-3 29-53 55-53s31 53 57 53 31-53 57-53 31 53 38 53"/><text class="h" x="125" y="139" text-anchor="middle">単相性・鈍い</text><text class="s" x="125" y="160" text-anchor="middle">原因を含めて評価</text></g><g transform="translate(592 74)"><rect class="b" width="250" height="170" rx="20"/><path d="M22 92c18-16 32 16 50 0s32 16 50 0 32 16 50 0 32 16 56 0" fill="none" stroke="#477e88" stroke-width="5"/><text class="h" x="125" y="139" text-anchor="middle">連続的な信号</text><text class="s" x="125" y="160" text-anchor="middle">静脈の可能性も確認</text></g><text class="s" x="440" y="283" text-anchor="middle">相の呼び方だけで正常・異常を決めない</text></svg>
