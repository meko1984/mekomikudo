<svg xmlns="http://www.w3.org/2000/svg" width="390" height="450" viewBox="0 0 390 450" role="img" aria-labelledby="title desc"><title id="title">尿路ストマ：尿管皮膚瘻の排泄経路</title><desc id="desc">尿管を直接、腹壁へ出す。図は左右２か所に開口する一例。開口部の数・位置は術式で異なる。正面から見た模式図で、造設位置を一律に示すものではない。</desc><defs><marker id="flow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#607d8b"/></marker></defs><rect width="390" height="450" rx="12" fill="#f4f8fa"/><g font-family="'Yu Gothic','Meiryo',sans-serif" fill="#2e4857"><text x="20" y="38" font-size="22" font-weight="700">尿路ストマ：尿管皮膚瘻</text><text x="20" y="65" font-size="15" fill="#607581">正面から見た経路の模式図</text><path d="M112 85Q195 60 278 85L291 301Q195 332 99 301Z" fill="#faf8f6" stroke="#d9cfc7" stroke-width="2"/><path d="M141 110C109 99 111 157 140 151Q151 145 141 133Q132 127 141 110Z" fill="#cc9294" stroke="#9c6269" stroke-width="2"/><path d="M249 110C281 99 279 157 250 151Q239 145 249 133Q258 127 249 110Z" fill="#cc9294" stroke="#9c6269" stroke-width="2"/><path d="M141 144Q149 205 137 280M249 144Q241 205 253 280" fill="none" stroke="#719bad" stroke-width="7"/><circle cx="137" cy="280" r="13" fill="#cf6975" stroke="#fff" stroke-width="3"/><circle cx="253" cy="280" r="13" fill="#cf6975" stroke="#fff" stroke-width="3"/><path d="M143 185V245M247 185V245" fill="none" stroke="#607d8b" stroke-width="2.5" marker-end="url(#flow)"/><text x="22" y="118" font-size="18">腎臓</text><path d="M68 114H115" stroke="#607d8b"/><text x="22" y="210" font-size="18">尿管</text><path d="M68 205H135" stroke="#607d8b"/><text x="145" y="317" font-size="18">ストマ</text><rect x="16" y="340" width="358" height="96" fill="#fff"/><text x="27" y="365" font-size="17">尿管を直接、腹壁へ出す</text><text x="27" y="393" font-size="17">図は左右２か所に開口する一例</text><text x="27" y="421" font-size="17">開口部の数・位置は術式で異なる</text></g></svg>
