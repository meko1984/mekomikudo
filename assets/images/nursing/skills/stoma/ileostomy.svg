<svg xmlns="http://www.w3.org/2000/svg" width="390" height="450" viewBox="0 0 390 450" role="img" aria-labelledby="title desc"><title id="title">回腸ストマの排泄経路</title><desc id="desc">小腸末端の回腸を腹壁へ出す。便は回腸から袋へ。結腸の残存・切除は術式で異なる。正面から見た模式図で、造設位置を一律に示すものではない。</desc><defs><marker id="flow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#607d8b"/></marker></defs><rect width="390" height="450" rx="12" fill="#f4f8fa"/><g font-family="'Yu Gothic','Meiryo',sans-serif" fill="#2e4857"><text x="20" y="38" font-size="22" font-weight="700">回腸ストマ</text><text x="20" y="65" font-size="15" fill="#607581">正面から見た経路の模式図</text><path d="M112 85Q195 60 278 85L291 301Q195 332 99 301Z" fill="#faf8f6" stroke="#d9cfc7" stroke-width="2"/><g opacity=".32"><path d="M140 260V140Q140 124 156 124H237Q252 124 252 142V260" fill="none" stroke="#bf8887" stroke-width="19" stroke-linecap="round"/></g><path d="M168 162Q227 141 228 175Q228 186 169 188Q151 193 169 205Q239 201 230 226Q225 240 170 229Q150 231 166 248L128 279" fill="none" stroke="#d3a573" stroke-width="13" stroke-linecap="round"/><circle cx="128" cy="279" r="13" fill="#cf6975" stroke="#fff" stroke-width="3"/><path d="M214 227H181L150 266" fill="none" stroke="#607d8b" stroke-width="2.5" marker-end="url(#flow)"/><text x="270" y="144" font-size="18">結腸</text><path d="M260 140H245" stroke="#607d8b"/><text x="24" y="200" font-size="18">回腸</text><path d="M70 196H155" stroke="#607d8b"/><text x="24" y="308" font-size="18">ストマ</text><rect x="16" y="340" width="358" height="96" fill="#fff"/><text x="27" y="365" font-size="17">小腸末端の回腸を腹壁へ出す</text><text x="27" y="393" font-size="17">便は回腸から袋へ</text><text x="27" y="421" font-size="17">結腸の残存・切除は術式で異なる</text></g></svg>
