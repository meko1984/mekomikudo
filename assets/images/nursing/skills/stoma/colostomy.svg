<svg xmlns="http://www.w3.org/2000/svg" width="390" height="450" viewBox="0 0 390 450" role="img" aria-labelledby="title desc"><title id="title">結腸ストマの排泄経路</title><desc id="desc">大腸の一部を腹壁へ出す。便は結腸から袋へ。図は単孔式の一例。正面から見た模式図で、造設位置を一律に示すものではない。</desc><defs><marker id="flow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#607d8b"/></marker></defs><rect width="390" height="450" rx="12" fill="#f4f8fa"/><g font-family="'Yu Gothic','Meiryo',sans-serif" fill="#2e4857"><text x="20" y="38" font-size="22" font-weight="700">結腸ストマ</text><text x="20" y="65" font-size="15" fill="#607581">正面から見た経路の模式図</text><path d="M112 85Q195 60 278 85L291 301Q195 332 99 301Z" fill="#faf8f6" stroke="#d9cfc7" stroke-width="2"/><path d="M162 171Q219 146 228 177Q228 191 165 191Q153 191 165 209Q236 202 228 226Q222 242 166 229Q155 228 165 248L140 260" fill="none" stroke="#e2bb90" stroke-width="10" stroke-linecap="round"/><path d="M140 260V140Q140 124 156 124H237Q252 124 252 142V260" fill="none" stroke="#bf8887" stroke-width="19" stroke-linecap="round"/><path d="M252 260Q252 279 273 279" fill="none" stroke="#bf8887" stroke-width="19" stroke-linecap="round"/><circle cx="273" cy="279" r="13" fill="#cf6975" stroke="#fff" stroke-width="3"/><path d="M146 146V125H227M252 184V236" fill="none" stroke="#607d8b" stroke-width="2.5" marker-end="url(#flow)"/><text x="24" y="136" font-size="18">結腸</text><path d="M70 132H122" stroke="#607d8b"/><text x="24" y="204" font-size="18">小腸</text><path d="M70 199H151" stroke="#607d8b"/><text x="260" y="253" font-size="18">ストマ</text><rect x="16" y="340" width="358" height="96" fill="#fff"/><text x="27" y="365" font-size="17">大腸の一部を腹壁へ出す</text><text x="27" y="393" font-size="17">便は結腸から袋へ</text><text x="27" y="421" font-size="17">図は単孔式の一例</text></g></svg>
