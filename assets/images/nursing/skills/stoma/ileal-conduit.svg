<svg xmlns="http://www.w3.org/2000/svg" width="390" height="450" viewBox="0 0 390 450" role="img" aria-labelledby="title desc"><title id="title">尿路ストマ：回腸導管の排泄経路</title><desc id="desc">尿管を、分離した回腸の一部へつなぐ。尿は回腸導管から袋へ。膀胱を経由しない尿の通路。正面から見た模式図で、造設位置を一律に示すものではない。</desc><defs><marker id="flow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#607d8b"/></marker></defs><rect width="390" height="450" rx="12" fill="#f4f8fa"/><g font-family="'Yu Gothic','Meiryo',sans-serif" fill="#2e4857"><text x="20" y="38" font-size="22" font-weight="700">尿路ストマ：回腸導管</text><text x="20" y="65" font-size="15" fill="#607581">正面から見た経路の模式図</text><path d="M112 85Q195 60 278 85L291 301Q195 332 99 301Z" fill="#faf8f6" stroke="#d9cfc7" stroke-width="2"/><path d="M141 110C109 99 111 157 140 151Q151 145 141 133Q132 127 141 110Z" fill="#cc9294" stroke="#9c6269" stroke-width="2"/><path d="M249 110C281 99 279 157 250 151Q239 145 249 133Q258 127 249 110Z" fill="#cc9294" stroke="#9c6269" stroke-width="2"/><path d="M141 144Q170 180 164 262M249 144Q218 185 219 262" fill="none" stroke="#719bad" stroke-width="7"/><path d="M152 274Q195 264 229 274L269 294" fill="none" stroke="#d3a573" stroke-width="19" stroke-linecap="round"/><circle cx="269" cy="294" r="13" fill="#cf6975" stroke="#fff" stroke-width="3"/><path d="M166 185V231M220 185V231M178 274L250 287" fill="none" stroke="#607d8b" stroke-width="2.5" marker-end="url(#flow)"/><text x="22" y="118" font-size="18">腎臓</text><path d="M68 114H115" stroke="#607d8b"/><text x="22" y="210" font-size="18">尿管</text><path d="M68 205H160" stroke="#607d8b"/><text x="136" y="318" font-size="18">回腸導管</text><text x="267" y="268" font-size="18">ストマ</text><rect x="16" y="340" width="358" height="96" fill="#fff"/><text x="27" y="365" font-size="17">尿管を、分離した回腸の一部へつなぐ</text><text x="27" y="393" font-size="17">尿は回腸導管から袋へ</text><text x="27" y="421" font-size="17">膀胱を経由しない尿の通路</text></g></svg>
