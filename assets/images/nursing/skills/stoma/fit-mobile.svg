<svg xmlns="http://www.w3.org/2000/svg" width="390" height="775" viewBox="0 0 390 775" role="img" aria-labelledby="title desc"><title id="title">面板の開口部と皮膚保護</title><desc id="desc">ストマを圧迫せず面板の穴を合わせる。広すぎる穴では露出した皮膚に便や尿が触れる。</desc><rect width="390" height="775" rx="18" fill="#fff"/><g font-family="'Yu Gothic','Meiryo',sans-serif" fill="#243f4c"><text x="24" y="38" font-size="22" font-weight="700">面板の穴と皮膚への漏れ</text><g><rect x="16" y="60" width="358" height="300" rx="16" fill="#edf7f4"/><text x="36" y="96" font-size="22" font-weight="700">① 皮膚を保護する適合</text><rect x="36" y="226" width="318" height="25" rx="3" fill="#e4bdaa"/><path d="M 158 226 V 170 Q 195 138 232 170 V 226" fill="#df8186" stroke="#984f5b" stroke-width="3"/><path d="M 36 215 H 155 M 235 215 H 354" stroke="#527f8a" stroke-width="14"/><text x="36" y="285" font-size="19">ストマに沿う → 皮膚を保護</text><text x="36" y="321" font-size="18">粘膜を締め付けない</text></g><g><rect x="16" y="375" width="358" height="300" rx="16" fill="#fff4ed"/><text x="36" y="411" font-size="22" font-weight="700">② 開口部が広すぎる</text><rect x="36" y="541" width="318" height="25" rx="3" fill="#e4bdaa"/><path d="M 158 541 V 485 Q 195 453 232 485 V 541" fill="#df8186" stroke="#984f5b" stroke-width="3"/><path d="M 36 530 H 119 M 271 530 H 354" stroke="#527f8a" stroke-width="14"/><text x="36" y="600" font-size="19">穴が広い → 皮膚が露出</text><text x="36" y="636" font-size="18">便・尿が触れて皮膚障害に</text><path d="M 245 502 Q 259 518 259 537" stroke="#b66b22" stroke-width="5" fill="none"/><circle cx="259" cy="543" r="6" fill="#b66b22"/></g><rect x="24" y="739" width="18" height="10" fill="#527f8a"/><text x="50" y="749" font-size="16">面板</text><rect x="120" y="739" width="18" height="10" fill="#df8186"/><text x="146" y="749" font-size="16">ストマ</text><rect x="230" y="739" width="18" height="10" fill="#e4bdaa"/><text x="256" y="749" font-size="16">皮膚</text></g></svg>
