<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc"><title id="title">面板の開口部と皮膚保護</title><desc id="desc">ストマを圧迫せず面板の穴を合わせる。広すぎる穴では露出した皮膚に便や尿が触れる。</desc><rect width="880" height="420" rx="18" fill="#fff"/><g font-family="'Yu Gothic','Meiryo',sans-serif" fill="#243f4c"><text x="24" y="38" font-size="25" font-weight="700">面板の穴と皮膚への漏れ</text><g><rect x="24" y="65" width="404" height="300" rx="16" fill="#edf7f4"/><text x="44" y="101" font-size="22" font-weight="700">① 皮膚を保護する適合</text><rect x="44" y="231" width="364" height="25" rx="3" fill="#e4bdaa"/><path d="M 189 231 V 175 Q 226 143 263 175 V 231" fill="#df8186" stroke="#984f5b" stroke-width="3"/><path d="M 44 220 H 186 M 266 220 H 408" stroke="#527f8a" stroke-width="14"/><text x="44" y="290" font-size="19">ストマに沿う → 皮膚を保護</text><text x="44" y="326" font-size="18">粘膜を締め付けない</text></g><g><rect x="452" y="65" width="404" height="300" rx="16" fill="#fff4ed"/><text x="472" y="101" font-size="22" font-weight="700">② 開口部が広すぎる</text><rect x="472" y="231" width="364" height="25" rx="3" fill="#e4bdaa"/><path d="M 617 231 V 175 Q 654 143 691 175 V 231" fill="#df8186" stroke="#984f5b" stroke-width="3"/><path d="M 472 220 H 578 M 730 220 H 836" stroke="#527f8a" stroke-width="14"/><text x="472" y="290" font-size="19">穴が広い → 皮膚が露出</text><text x="472" y="326" font-size="18">便・尿が触れて皮膚障害に</text><path d="M 704 192 Q 718 208 718 227" stroke="#b66b22" stroke-width="5" fill="none"/><circle cx="718" cy="233" r="6" fill="#b66b22"/></g><rect x="24" y="384" width="18" height="10" fill="#527f8a"/><text x="50" y="394" font-size="16">面板</text><rect x="120" y="384" width="18" height="10" fill="#df8186"/><text x="146" y="394" font-size="16">ストマ</text><rect x="230" y="384" width="18" height="10" fill="#e4bdaa"/><text x="256" y="394" font-size="16">皮膚</text></g></svg>
