<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 440" role="img" aria-labelledby="title desc">
  <title id="title">舌背と口腔底の位置</title>
  <desc id="desc">開口した口を前から見た模式図。上段は舌の上面である舌背、下段は舌を持ち上げて見える舌の下の口腔底を示す。器具の挿入位置や深さは示さない。</desc>
  <rect width="390" height="440" rx="18" fill="#f1f7f8"/>
  <g font-family="sans-serif" fill="#304b5b">
    <text x="24" y="34" font-size="18" font-weight="700">口を前から見た位置の模式図</text>
    <text x="24" y="66" font-size="14">① 舌を自然な位置に置いたとき</text>
    <text x="24" y="245" font-size="14">② 舌を持ち上げて見たとき</text>
  </g>
  <g stroke="#b47c75" stroke-width="3">
    <ellipse cx="134" cy="138" rx="94" ry="61" fill="#f6d9d5"/>
    <path d="M58 120 Q134 75 210 120 L203 150 Q134 188 65 150Z" fill="#754d53"/>
    <path d="M70 112 Q134 82 198 112 L195 126 Q134 102 73 126Z" fill="#fffdf4"/>
    <path d="M82 161 Q134 181 186 161 Q194 124 155 121 Q103 115 82 161Z" fill="#df999d"/>
    <path d="M134 128 L131 157" stroke="#bd737c" stroke-width="2"/>
    <ellipse cx="134" cy="320" rx="94" ry="61" fill="#f6d9d5"/>
    <path d="M58 302 Q134 257 210 302 L203 332 Q134 370 65 332Z" fill="#754d53"/>
    <path d="M75 334 Q134 360 193 334 L185 348 Q134 373 83 348Z" fill="#a9d2df" stroke="#59899c"/>
    <path d="M109 329 Q92 282 117 275 Q153 264 162 288 L160 328 Q134 338 109 329Z" fill="#e9b1b5"/>
    <path d="M133 326 L134 347" stroke="#b47c75" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#476c7a" stroke-width="2" stroke-linejoin="round">
    <path d="M160 144 L248 144 L248 121 L267 121"/>
    <path d="M178 344 L247 344 L247 324 L267 324"/>
  </g>
  <g fill="#476c7a"><circle cx="160" cy="144" r="3"/><circle cx="178" cy="344" r="3"/></g>
  <g font-family="sans-serif" fill="#304b5b">
    <text x="276" y="125" font-size="17" font-weight="700">舌背</text>
    <text x="270" y="151" font-size="13">舌の上面</text>
    <text x="276" y="328" font-size="17" font-weight="700">口腔底</text>
    <text x="270" y="354" font-size="13">舌の下の床</text>
    <text x="24" y="409" font-size="13">色は位置の区別。器具の挿入方法は示さない。</text>
  </g>
</svg>
