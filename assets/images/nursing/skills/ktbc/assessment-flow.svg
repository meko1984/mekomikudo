<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">嚥下評価の流れ</title><desc id="desc">観察、間接評価、直接評価、専門評価の順序</desc><rect width="320" height="200" rx="22" fill="#f4f7fb"/><g font-family="sans-serif" text-anchor="middle"><g fill="#fff" stroke-width="2"><rect x="18" y="76" width="64" height="48" rx="12" stroke="#6d9eb5"/><rect x="92" y="76" width="64" height="48" rx="12" stroke="#79a86f"/><rect x="166" y="76" width="64" height="48" rx="12" stroke="#c09555"/><rect x="240" y="76" width="64" height="48" rx="12" stroke="#9b79af"/></g><g font-size="11" font-weight="700" fill="#35464d"><text x="50" y="96">観察・問診</text><text x="50" y="113">全身・口腔</text><text x="124" y="96">間接評価</text><text x="124" y="113">RSST</text><text x="198" y="96">直接評価</text><text x="198" y="113">MWST・FT</text><text x="272" y="96">専門評価</text><text x="272" y="113">VE・VF</text></g><g stroke="#869ca6" stroke-width="3" fill="none"><path d="M82 100h10M156 100h10M230 100h10"/></g><g fill="#869ca6"><path d="M88 95l7 5-7 5zM162 95l7 5-7 5zM236 95l7 5-7 5z"/></g><text x="160" y="48" font-size="13" font-weight="700" fill="#465b64">安全を確認しながら段階を進める</text><text x="160" y="155" font-size="11" fill="#5d6d74">単独の結果で食事可否を確定しない</text></g></svg>
