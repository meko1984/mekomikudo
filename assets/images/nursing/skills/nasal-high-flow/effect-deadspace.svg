  <g fill="none" stroke-linecap="round" stroke-width="5"><path d="M35 63h56" stroke="#5ba2b4"/><path d="m82 54 12 9-12 9" stroke="#5ba2b4"/><path d="M146 113c34 0 51-14 74-34" stroke="#cb806f" stroke-dasharray="7 8"/><path d="m212 76 12 0-3 12" stroke="#cb806f"/></g>
