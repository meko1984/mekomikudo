<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="title desc"><title id="title">腎代替療法の種類</title><desc id="desc">血液透析、腹膜透析、腎移植と、急性期の持続的腎代替療法を示す。</desc><rect width="880" height="300" rx="24" fill="#f6fbfc"/><g font-family="Arial,'Noto Sans JP',sans-serif" text-anchor="middle"><text x="440" y="42" font-size="24" font-weight="700" fill="#274f60">腎臓の働きが大きく低下したときの選択肢</text><path d="M440 55v30M440 85H129v28M440 85v28M440 85h311v28" fill="none" stroke="#86b9be" stroke-width="5"/><g transform="translate(30 112)"><rect width="198" height="148" rx="24" fill="#e8f0ff" stroke="#6689bd" stroke-width="3"/><path d="M38 64h46v55H38z" fill="#fff" stroke="#6689bd" stroke-width="4"/><path d="M84 78h32v28H84M116 92h39" fill="none" stroke="#6689bd" stroke-width="5"/><circle cx="158" cy="92" r="18" fill="#fff" stroke="#e08372" stroke-width="4"/><text x="99" y="32" font-size="20" font-weight="700" fill="#385579">血液透析</text><text x="99" y="139" font-size="14" fill="#385579">血液を体外の膜へ</text></g><g transform="translate(241 112)"><rect width="198" height="148" rx="24" fill="#dff3f5" stroke="#4f9299" stroke-width="3"/><path d="M66 47c-15 19-22 38-18 56 7 31 57 31 64 0 4-18-3-37-18-56" fill="#fff" stroke="#4f9299" stroke-width="4"/><path d="M118 53v61h40" fill="none" stroke="#e08372" stroke-width="6"/><text x="99" y="32" font-size="20" font-weight="700" fill="#275b61">腹膜透析</text><text x="99" y="139" font-size="14" fill="#275b61">腹膜を体内の膜として</text></g><g transform="translate(452 112)"><rect width="198" height="148" rx="24" fill="#fff2df" stroke="#d99b4e" stroke-width="3"/><path d="M81 45c-35 4-46 57-15 75 21 12 42-6 42-29 0-21-10-42-27-46Z" fill="#fff" stroke="#d99b4e" stroke-width="4"/><path d="M108 91h42v31" fill="none" stroke="#d99b4e" stroke-width="5"/><text x="99" y="32" font-size="20" font-weight="700" fill="#6e4d25">腎移植</text><text x="99" y="139" font-size="14" fill="#6e4d25">提供腎の機能を利用</text></g><g transform="translate(663 112)"><rect width="187" heigh