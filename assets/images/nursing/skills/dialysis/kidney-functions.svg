<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="title desc"><title id="title">透析が代替する腎機能</title><desc id="desc">透析が主に代替する老廃物、水分、電解質、酸塩基と、薬剤などで補う内分泌機能を分ける。</desc><rect width="880" height="300" rx="24" fill="#f6fbfc"/><g font-family="Arial,'Noto Sans JP',sans-serif"><g transform="translate(28 35)"><rect width="510" height="230" rx="24" fill="#dff3f5" stroke="#4f9299" stroke-width="3"/><text x="255" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#275b61">血液透析が主に代替する</text><g transform="translate(30 64)" text-anchor="middle"><circle cx="50" cy="48" r="38" fill="#fff" stroke="#4f9299" stroke-width="4"/><path d="M34 48h32M38 37h24M41 59h18" stroke="#aa805e" stroke-width="5"/><text x="50" y="108" font-size="16" font-weight="700" fill="#275b61">老廃物</text><circle cx="165" cy="48" r="38" fill="#fff" stroke="#4f9299" stroke-width="4"/><path d="M165 18c-20 25-29 38-29 53a29 29 0 0 0 58 0c0-15-9-28-29-53Z" fill="#e8f0ff" stroke="#6689bd" stroke-width="3"/><text x="165" y="108" font-size="16" font-weight="700" fill="#275b61">余分な水分</text><circle cx="280" cy="48" r="38" fill="#fff" stroke="#4f9299" stroke-width="4"/><text x="280" y="42" font-size="17" font-weight="700" fill="#6689bd">K</text><text x="280" y="65" font-size="15" fill="#e08372">Na Ca</text><text x="280" y="108" font-size="16" font-weight="700" fill="#275b61">電解質</text><circle cx="395" cy="48" r="38" fill="#fff" stroke="#4f9299" stroke-width="4"/><text x="395" y="43" font-size="19" font-weight="700" fill="#6689bd">H⁺</text><path d="M375 61h40" stroke="#e08372" stroke-width="5"/><text x="395" y="108" font-size="16" font-weight="700" fill="#275b61">酸塩基</text></g></g><path d="M552 150h48m-10-11 14 11-14 11" fill="none" stroke="#86b9be" stroke-width="6"/><g transform="translate(610 35)"><rect width="242" height="230" rx="24" fill="#fff2df" stroke="#d99b4e" stroke-width="3"/><text x="121" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#6e4d25">別に支える機能</text><path d="M54 76c-35 4-45 55-14 72 20 11 40-7 40-29 0-20-10-40-26-43Z" fill="#fff" stroke="#d99b4e" stroke-width="4"/><path d="M114 84h90M114 111h75M114 138h62" stroke="#d99b4e" stroke-width="6" stroke-linecap="round"/><text x="121" y="183" text-anchor="middle" font-size="16" fill="#6e4d25">貧血・骨ミネラル代謝</text><text x="121" y="208" text-anchor="middle" font-size="15" fill="#6e4d25">薬剤・栄養・残存腎機能</text></g></g></svg>
