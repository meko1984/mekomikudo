<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" role="img" aria-labelledby="title desc"><title id="title">腎代替療法の種類</title><desc id="desc">血液透析、腹膜透析、腎移植、持続的腎代替療法を縦に示す。</desc><rect width="360" height="620" rx="22" fill="#f6fbfc"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="180" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#274f60">腎臓の働きを補う選択肢</text><g transform="translate(28 52)"><rect width="304" height="120" rx="22" fill="#e8f0ff" stroke="#6689bd" stroke-width="3"/><path d="M24 42h58v50H24zM82 55h42v24H82z" fill="#fff" stroke="#6689bd" stroke-width="4"/><text x="138" y="54" font-size="21" font-weight="700" fill="#385579">血液透析</text><text x="138" y="82" font-size="15" fill="#385579">血液を体外の膜へ</text></g><g transform="translate(28 185)"><rect width="304" height="120" rx="22" fill="#dff3f5" stroke="#4f9299" stroke-width="3"/><path d="M53 25c-22 4-29 50-8 65 20 14 43-5 41-30-2-20-15-37-33-35Z" fill="#fff" stroke="#4f9299" stroke-width="4"/><text x="138" y="54" font-size="21" font-weight="700" fill="#275b61">腹膜透析</text><text x="138" y="82" font-size="15" fill="#275b61">腹膜を体内の膜として</text></g><g transform="translate(28 318)"><rect width="304" height="120" rx="22" fill="#fff2df" stroke="#d99b4e" stroke-width="3"/><path d="M55 25c-30 4-36 47-13 64 19 13 39-5 39-27 0-19-10-35-26-37Z" fill="#fff" stroke="#d99b4e" stroke-width="4"/><text x="138" y="54" font-size="21" font-weight="700" fill="#6e4d25">腎移植</text><text x="138" y="82" font-size="15" fill="#6e4d25">提供腎の機能を利用</text></g><g transform="translate(28 451)"><rect width="304" height="140" rx="22" fill="#f4eaf8" stroke="#9a73ad" stroke-width="3"/><path d="M24 45h58v60H24zM82 59h42v31H82z" fill="#fff" stroke="#9a73ad" stroke-width="4"/><text x="138" y="58" font-size="19" font-weight="700" fill="#634470">持続的腎代替療法</text><text x="138" y="86" font-size="15" fill="#634470">急性期にゆっくり連続</text><text x="138" y="109" font-size="13" fill="#634470">血液透析とは</text><text x="138" y="129" font-size="13" fill="#634470">処方も観察も異なる</text></g></g></svg>
