<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc"><title id="title">透析中の継続観察</title><desc id="desc">血圧、除水、症状、アクセス、回路圧を経時的に観察する。</desc><rect width="320" height="200" rx="22" fill="#eef8f8"/><path d="M24 145h272" stroke="#4f9299" stroke-width="5"/><path d="M35 119l42-28 39 21 47-54 42 39 39-25 39 40" fill="none" stroke="#e08372" stroke-width="7"/><g fill="#fff" stroke="#4f9299" stroke-width="4"><circle cx="35" cy="119" r="7"/><circle cx="77" cy="91" r="7"/><circle cx="116" cy="112" r="7"/><circle cx="163" cy="58" r="7"/><circle cx="205" cy="97" r="7"/><circle cx="244" cy="72" r="7"/><circle cx="283" cy="112" r="7"/></g><circle cx="65" cy="45" r="25" fill="#fff" stroke="#6689bd" stroke-width="4"/><path d="M52 45h26" stroke="#6689bd" stroke-width="5"/><rect x="220" y="25" width="66" height="43" rx="10" fill="#fff" stroke="#d99b4e" stroke-width="4"/><text x="253" y="53" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="16" font-weight="700" fill="#6e4d25">除水</text><text x="160" y="177" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="15" font-weight="700" fill="#275b61">症状と機械の変化をつなぐ</text></svg>
