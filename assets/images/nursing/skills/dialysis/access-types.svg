<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="title desc"><title id="title">透析アクセスの種類</title><desc id="desc">自己血管内シャント、人工血管内シャント、中心静脈カテーテルを比較する。</desc><rect width="880" height="330" rx="24" fill="#f6fbfc"/><g font-family="Arial,'Noto Sans JP',sans-serif" text-anchor="middle"><g transform="translate(28 38)"><rect width="260" height="255" rx="24" fill="#e8f0ff" stroke="#6689bd" stroke-width="3"/><text x="130" y="32" font-size="20" font-weight="700" fill="#385579">自己血管内シャント</text><path d="M45 185c36-15 43-111 93-96 42 13 45 77 76 97" fill="none" stroke="#e08372" stroke-width="14"/><path d="M45 185c41 10 74-19 76-77" fill="none" stroke="#6689bd" stroke-width="14"/><circle cx="121" cy="109" r="12" fill="#fff" stroke="#4f9299" stroke-width="4"/><text x="130" y="220" font-size="15" fill="#385579">自分の動脈＋静脈</text><text x="130" y="242" font-size="14" fill="#385579">感染リスクは比較的低い</text></g><g transform="translate(310 38)"><rect width="260" height="255" rx="24" fill="#dff3f5" stroke="#4f9299" stroke-width="3"/><text x="130" y="32" font-size="20" font-weight="700" fill="#275b61">人工血管内シャント</text><path d="M43 189c30-11 45-100 90-100 48 0 54 83 84 100" fill="none" stroke="#e08372" stroke-width="13"/><path d="M43 189c36 11 69-12 76-72" fill="none" stroke="#6689bd" stroke-width="13"/><path d="M119 117c5-28 58-23 66 28" fill="none" stroke="#d99b4e" stroke-width="17" stroke-dasharray="6 4"/><text x="130" y="220" font-size="15" fill="#275b61">人工血管でつなぐ</text><text x="130" y="242" font-size="14" fill="#275b61">感染・血栓に注意</text></g><g transform="translate(592 38)"><rect width="260" height="255" rx="24" fill="#fff2df" stroke="#d99b4e" stroke-width="3"/><text x="130" y="32" font-size="19" font-weight="700" fill="#6e4d25">中心静脈カテーテル</text><path d="M93 55v82c0 35 74 35 74 0V55" fill="none" stroke="#6689bd" stroke-width="12"/><path d="M95 135l-30 50M165 135l30 50" stroke="#6689bd" stroke-width="10"/><rect x="54" y="181" width="22" height="25" rx="5" fill="#fff" stroke="#d99b4e" stroke-width="3"/><rect x="184" y="181" width="22" height="25" rx="5" fill="#fff" stroke="#d99b4e" stroke-width="3"/><text x="130" y="228" font-size="15" fill="#6e4d25">早く使用できる</text><text x="130" y="249" font-size="14" fill="#6e4d25">血流感染リスクが高い</text></g></g></svg>
