<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">便検体の汚染回避</title><desc id="d">便を清潔で乾いた受け器に取り、尿、水、洗浄剤を混ぜない</desc><rect width="320" height="200" rx="22" fill="#fbf7f1"/><text x="18" y="29" fill="#6b5138" font-family="sans-serif" font-size="15" font-weight="700">清潔で乾いた場所に受ける</text><path d="M76 64c11-18 34-12 34 7 19-4 28 22 11 32 13 17-3 36-20 29-9 17-36 11-37-9-19-5-20-33-1-40-3-10 2-16 13-19Z" fill="#9a704a"/><path d="M41 137h103l-11 31H52Z" fill="#fff" stroke="#66847e" stroke-width="3"/><path d="M194 64c0-13 13-22 13-34 0 12 13 21 13 34a13 13 0 1 1-26 0Z" fill="#e5c756"/><path d="M249 49h42v39h-42z" fill="#dcebf0" stroke="#66847e" stroke-width="3"/><path d="M249 49l42 39M291 49l-42 39" stroke="#b8534c" stroke-width="5"/><path d="M188 108l35 35M223 108l-35 35" stroke="#b8534c" stroke-width="5"/><g font-family="sans-serif" text-anchor="middle"><text x="94" y="188" fill="#5e4b39" font-size="13" font-weight="700">乾いた受け器</text><text x="206" y="164" fill="#94524b" font-size="12" font-weight="700">尿を混ぜない</text><text x="266" y="109" fill="#94524b" font-size="12" font-weight="700">便器の水・</text><text x="266" y="129" fill="#94524b" font-size="12" font-weight="700">洗浄剤を避ける</text></g></svg>
