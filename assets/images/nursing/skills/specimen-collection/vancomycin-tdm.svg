<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">バンコマイシンTDMの採血時間</title><desc id="d">投与終了1から2時間後のピーク側採血と次回投与直前のトラフ採血を時間軸で示す</desc><rect width="320" height="200" rx="22" fill="#f3f7fb"/><text x="18" y="28" fill="#36566c" font-family="sans-serif" font-size="15" font-weight="700">投与と採血の時刻を記録</text><path d="M25 113H294" stroke="#6f929f" stroke-width="4" stroke-linecap="round"/><path d="M48 58v55h52V58" fill="#b8d9eb" stroke="#41788d" stroke-width="3"/><path d="M48 58h52" stroke="#41788d" stroke-width="3"/><circle cx="156" cy="113" r="10" fill="#d7a14b"/><circle cx="278" cy="113" r="10" fill="#b85d59"/><path d="M100 81h49" stroke="#809da7" stroke-width="3" stroke-dasharray="5 5"/><g font-family="sans-serif" text-anchor="middle"><text x="74" y="49" fill="#315f73" font-size="12" font-weight="700">点滴投与</text><text x="74" y="142" fill="#315f73" font-size="12">投与終了</text><text x="156" y="80" fill="#8a642d" font-size="12" font-weight="700">1〜2時間後</text><text x="156" y="142" fill="#8a642d" font-size="12">ピーク側</text><text x="278" y="80" fill="#8c4a46" font-size="12" font-weight="700">次回投与直前</text><text x="278" y="142" fill="#8c4a46" font-size="12">トラフ</text><text x="160" y="181" fill="#425d68" font-size="12" font-weight="700">予定ではなく、実際の時刻を記録</text></g></svg>
