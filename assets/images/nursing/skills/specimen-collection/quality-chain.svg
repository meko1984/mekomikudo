<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">検体品質の5つの鎖</title><desc id="d">患者、検査、検体、容器、搬送が一本につながる</desc><rect width="320" height="200" rx="22" fill="#f2f8f8"/><text x="20" y="30" fill="#244b52" font-family="sans-serif" font-size="15" font-weight="700">正しい結果へつなぐ鎖</text><path d="M36 102H284" stroke="#9bc5c4" stroke-width="8" stroke-linecap="round"/><g font-family="sans-serif" text-anchor="middle"><g fill="#fff" stroke="#2f7776" stroke-width="3"><circle cx="40" cy="102" r="25"/><circle cx="100" cy="102" r="25"/><circle cx="160" cy="102" r="25"/><circle cx="220" cy="102" r="25"/><circle cx="280" cy="102" r="25"/></g><g fill="#245c5b" font-size="13" font-weight="700"><text x="40" y="107">患者</text><text x="100" y="107">検査</text><text x="160" y="107">検体</text><text x="220" y="107">容器</text><text x="280" y="107">搬送</text></g><text x="160" y="164" fill="#b7504a" font-size="13" font-weight="700">一つ違えば、結果までずれる</text></g></svg>
