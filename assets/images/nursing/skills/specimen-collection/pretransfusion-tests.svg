<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">輸血前血液検査</title><desc id="d">患者確認から血液型、不規則抗体、交差適合試験へ進む</desc><rect width="320" height="200" rx="22" fill="#fbf4f4"/><text x="18" y="28" fill="#704946" font-family="sans-serif" font-size="15" font-weight="700">患者と製剤の適合性を確かめる</text><g fill="#fff" stroke="#a65d58" stroke-width="3"><circle cx="45" cy="95" r="28"/><circle cx="122" cy="95" r="28"/><circle cx="199" cy="95" r="28"/><circle cx="276" cy="95" r="28"/></g><g fill="none" stroke="#c78a84" stroke-width="3"><path d="M74 95h18"/><path d="m85 88 7 7-7 7"/><path d="M151 95h18"/><path d="m162 88 7 7-7 7"/><path d="M228 95h18"/><path d="m239 88 7 7-7 7"/></g><g font-family="sans-serif" text-anchor="middle" fill="#774b47" font-size="11" font-weight="700"><text x="45" y="91">患者</text><text x="45" y="106">確認</text><text x="122" y="91">ABO・</text><text x="122" y="106">RhD</text><text x="199" y="91">不規則</text><text x="199" y="106">抗体</text><text x="276" y="91">交差適合</text><text x="276" y="106">試験</text><text x="160" y="158" font-size="12">採血時点から取り違えを防ぐ</text></g></svg>
