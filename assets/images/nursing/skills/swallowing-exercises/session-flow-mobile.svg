<svg xmlns="http://www.w3.org/2000/svg" width="390" height="620" viewBox="0 0 390 620" role="img" aria-labelledby="t d"><title id="t">一回の訓練の流れ</title><desc id="d">開始前評価から記録までを縦に示す。</desc><rect width="390" height="620" rx="22" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><text x="195" y="38" text-anchor="middle" font-size="18" font-weight="700">反応を見ながら負荷を調整</text><path d="M195 119V138M195 215V234M195 311V330M195 407V426" stroke="#70a3ad" stroke-width="3"/><g text-anchor="middle"><rect x="55" y="58" width="280" height="62" rx="16" fill="#fff" stroke="#5a9eb0" stroke-width="2"/><text x="195" y="84" font-size="17" font-weight="700">開始前</text><text x="195" y="106" font-size="13">呼吸・声・疲労</text><rect x="55" y="154" width="280" height="62" rx="16" fill="#fff" stroke="#8773b5" stroke-width="2"/><text x="195" y="180" font-size="17" font-weight="700">標的を選ぶ</text><text x="195" y="202" font-size="13">目的を共有</text><rect x="55" y="250" width="280" height="62" rx="16" fill="#fff" stroke="#57a581" stroke-width="2"/><text x="195" y="276" font-size="17" font-weight="700">訓練＋休息</text><text x="195" y="298" font-size="13">少量から</text><rect x="55" y="346" width="280" height="62" rx="16" fill="#fff" stroke="#d18a52" stroke-width="2"/><text x="195" y="372" font-size="17" font-weight="700">再評価</text><text x="195" y="394" font-size="13">変化を比較</text><rect x="55" y="442" width="280" height="62" rx="16" fill="#fff" stroke="#b46b77" stroke-width="2"/><text x="195" y="468" font-size="17" font-weight="700">記録</text><text x="195" y="490" font-size="13">次回へつなぐ</text></g><rect x="32" y="532" width="326" height="62" rx="14" fill="#fff0f0"/><text x="195" y="557" text-anchor="middle" font-size="13" font-weight="700" fill="#a34848">悪化・苦痛・著しい疲労があれば</text><text x="195" y="578" text-anchor="middle" font-size="13" font-weight="700" fill="#a34848">その場で中止して報告</text></g></svg>
