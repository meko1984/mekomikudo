<g font-family="sans-serif" fill="#304b5b"><text x="25" y="326" font-size="19" font-weight="700">1　前口蓋弓（青）</text><text x="25" y="354" font-size="16">軟口蓋から舌の付け根へ向かうひだ</text><text x="25" y="387" font-size="18">2　軟口蓋</text><text x="25" y="420" font-size="18">3　舌</text><text x="195" y="454" text-anchor="middle" font-size="14">刺激の圧・器具の挿入方法は示していない</text></g>
