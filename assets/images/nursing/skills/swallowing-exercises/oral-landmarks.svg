<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 470" role="img" aria-labelledby="t d">
<title id="t">前口蓋弓と周囲の部位</title><desc id="d">口を開けて前から見た模式図。前口蓋弓は軟口蓋から舌の付け根へ向かう左右のひだ。青で示す。軟口蓋と舌を区別し、口蓋垂を中央に示す。刺激の圧や器具の挿入経路は示さない。</desc>
