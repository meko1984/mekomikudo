<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" role="img" aria-labelledby="t d"><title id="t">機能低下と訓練の対応</title><desc id="d">四つの機能領域ごとに代表的な訓練を縦に示す。</desc><rect width="390" height="700" rx="22" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><text x="195" y="38" text-anchor="middle" font-size="18" font-weight="700">弱い機能から訓練を選ぶ</text><g><rect x="25" y="60" width="340" height="130" rx="17" fill="#fff" stroke="#5a9eb0" stroke-width="2"/><text x="48" y="95" font-size="18" font-weight="700">口唇・舌・頬</text><text x="48" y="124" font-size="14">動かしにくい／閉じにくい</text><text x="48" y="160" font-size="14" font-weight="700" fill="#377989">口腔運動・構音・軽い抵抗運動</text></g><g><rect x="25" y="207" width="340" height="130" rx="17" fill="#fff" stroke="#8773b5" stroke-width="2"/><text x="48" y="242" font-size="18" font-weight="700">舌根・咽頭</text><text x="48" y="271" font-size="14">咽頭圧が弱い／残留</text><text x="48" y="307" font-size="14" font-weight="700" fill="#6d599e">努力嚥下・アンカー・Masako</text></g><g><rect x="25" y="354" width="340" height="130" rx="17" fill="#fff" stroke="#57a581" stroke-width="2"/><text x="48" y="389" font-size="18" font-weight="700">喉頭挙上・食道入口部</text><text x="48" y="418" font-size="14">挙上・開大が弱い</text><text x="48" y="454" font-size="14" font-weight="700" fill="#31775a">シャキア・おでこ体操</text></g><g><rect x="25" y="501" width="340" height="130" rx="17" fill="#fff" stroke="#d18a52" stroke-width="2"/><text x="48" y="536" font-size="18" font-weight="700">気道防御・呼気</text><text x="48" y="565" font-size="14">声門閉鎖・咳が弱い</text><text x="48" y="601" font-size="14" font-weight="700" fill="#9a5d2f">声門上嚥下・発声・ブローイング</text></g><text x="195" y="668" text-anchor="middle" font-size="13" fill="#5b6c72">回数・保持時間・組み合わせは</text><text x="195" y="687" text-anchor="middle" font-size="13" fill="#5b6c72">個別に設定する</text></g></svg>
