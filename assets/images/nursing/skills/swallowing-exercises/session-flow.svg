<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d"><title id="t">一回の訓練の流れ</title><desc id="d">開始前評価、標的選択、訓練と休息、再評価、記録を順に示す。</desc><rect width="880" height="300" rx="24" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><text x="440" y="43" text-anchor="middle" font-size="22" font-weight="700">反応を見ながら負荷を調整</text><path d="M181 145H219M351 145H389M521 145H559M691 145H729" stroke="#70a3ad" stroke-width="4"/><g text-anchor="middle"><circle cx="110" cy="145" r="63" fill="#fff" stroke="#5a9eb0" stroke-width="3"/><text x="110" y="137" font-size="18" font-weight="700">開始前</text><text x="110" y="163" font-size="15">呼吸・声・疲労</text><circle cx="280" cy="145" r="63" fill="#fff" stroke="#8773b5" stroke-width="3"/><text x="280" y="137" font-size="18" font-weight="700">標的を選ぶ</text><text x="280" y="163" font-size="15">目的を共有</text><circle cx="450" cy="145" r="63" fill="#fff" stroke="#57a581" stroke-width="3"/><text x="450" y="137" font-size="18" font-weight="700">訓練＋休息</text><text x="450" y="163" font-size="15">少量から</text><circle cx="620" cy="145" r="63" fill="#fff" stroke="#d18a52" stroke-width="3"/><text x="620" y="137" font-size="18" font-weight="700">再評価</text><text x="620" y="163" font-size="15">変化を比較</text><circle cx="790" cy="145" r="63" fill="#fff" stroke="#b46b77" stroke-width="3"/><text x="790" y="137" font-size="18" font-weight="700">記録</text><text x="790" y="163" font-size="15">次回へつなぐ</text></g><rect x="200" y="232" width="480" height="42" rx="13" fill="#fff0f0"/><text x="440" y="259" text-anchor="middle" font-size="15" font-weight="700" fill="#a34848">悪化・苦痛・著しい疲労があれば、その場で中止して報告</text></g></svg>
