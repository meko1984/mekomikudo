<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="t d"><title id="t">機能低下と訓練の対応</title><desc id="d">四つの機能領域ごとに代表的な訓練を示す。</desc><rect width="880" height="410" rx="24" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><text x="440" y="42" text-anchor="middle" font-size="22" font-weight="700">評価した機能へ、必要な訓練を選ぶ</text><g><rect x="38" y="70" width="385" height="132" rx="18" fill="#fff" stroke="#5a9eb0" stroke-width="2"/><circle cx="85" cy="112" r="25" fill="#dceff4"/><text x="85" y="120" text-anchor="middle" font-size="24">口</text><text x="125" y="106" font-size="19" font-weight="700">口唇・舌・頬</text><text x="125" y="134" font-size="14">動かしにくい／閉じにくい</text><text x="62" y="172" font-size="15" font-weight="700" fill="#377989">口腔運動・構音・軽い抵抗運動</text></g><g><rect x="457" y="70" width="385" height="132" rx="18" fill="#fff" stroke="#8773b5" stroke-width="2"/><circle cx="504" cy="112" r="25" fill="#ece7f7"/><text x="504" y="120" text-anchor="middle" font-size="22">咽</text><text x="544" y="106" font-size="19" font-weight="700">舌根・咽頭</text><text x="544" y="134" font-size="14">咽頭圧が弱い／残留</text><text x="481" y="172" font-size="15" font-weight="700" fill="#6d599e">努力嚥下・アンカー・Masako</text></g><g><rect x="38" y="225" width="385" height="132" rx="18" fill="#fff" stroke="#57a581" stroke-width="2"/><circle cx="85" cy="267" r="25" fill="#dff3e8"/><text x="85" y="275" text-anchor="middle" font-size="22">↑</text><text x="125" y="261" font-size="19" font-weight="700">喉頭挙上・食道入口部</text><text x="125" y="289" font-size="14">挙上・開大が弱い</text><text x="62" y="327" font-size="15" font-weight="700" fill="#31775a">シャキア・おでこ体操</text></g><g><rect x="457" y="225" width="385" height="132" rx="18" fill="#fff" stroke="#d18a52" stroke-width="2"/><circle cx="504" cy="267" r="25" fill="#faeadc"/><text x="504" y="275" text-anchor="middle" font-size="22">息</text><text x="544" y="261" font-size="19" font-weight="700">気道防御・呼気</text><text x="544" y="289" font-size="14">声門閉鎖・咳が弱い</text><text x="481" y="327" font-size="15" font-weight="700" fill="#9a5d2f">声門上嚥下・発声・ブローイング</text></g><text x="440" y="391" text-anchor="middle" font-size="14" fill="#5b6c72">回数・保持時間・組み合わせは個別に設定</text></g></svg>
