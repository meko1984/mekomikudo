<svg xmlns="http://www.w3.org/2000/svg" width="390" height="530" viewBox="0 0 390 530" role="img" aria-labelledby="t d"><title id="t">間接訓練と直接訓練</title><desc id="d">評価の後、食物を使わない間接訓練と食物を使う直接訓練に分ける。</desc><rect width="390" height="530" rx="22" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><rect x="45" y="24" width="300" height="70" rx="17" fill="#d9eef2" stroke="#5c98a8" stroke-width="2"/><text x="195" y="53" text-anchor="middle" font-size="19" font-weight="700">嚥下機能を評価</text><text x="195" y="78" text-anchor="middle" font-size="13">病態・呼吸・口腔・認知・動作</text><path d="M195 96V108H15V350H30M15 190H30" fill="none" stroke="#5c98a8" stroke-width="3"/><rect x="30" y="125" width="330" height="132" rx="18" fill="#fff" stroke="#57a581" stroke-width="3"/><text x="55" y="164" font-size="21" font-weight="700">間接訓練</text><text x="55" y="194" font-size="17" font-weight="700" fill="#31775a">食物を使わない</text><text x="55" y="225" font-size="14">弱い機能を整える・強化する</text><rect x="30" y="285" width="330" height="132" rx="18" fill="#fff" stroke="#d18a52" stroke-width="3"/><text x="55" y="324" font-size="21" font-weight="700">直接訓練</text><text x="55" y="354" font-size="17" font-weight="700" fill="#9a5d2f">食物を使う</text><text x="55" y="385" font-size="14">食形態・姿勢・一口量も調整する</text><rect x="30" y="442" width="330" height="60" rx="14" fill="#fff0f0"/><text x="195" y="467" text-anchor="middle" font-size="14" font-weight="700" fill="#a34848">間接訓練ができても</text><text x="195" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#a34848">経口摂取の安全とは別の判断</text></g></svg>
