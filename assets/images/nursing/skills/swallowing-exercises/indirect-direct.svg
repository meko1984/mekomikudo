<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="t d"><title id="t">間接訓練と直接訓練</title><desc id="d">評価を起点に、食物を使わない間接訓練と食物を使う直接訓練を分けて示す。</desc><rect width="880" height="330" rx="24" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><rect x="310" y="28" width="260" height="64" rx="18" fill="#d9eef2" stroke="#5c98a8" stroke-width="2"/><text x="440" y="55" text-anchor="middle" font-size="20" font-weight="700">嚥下機能を評価</text><text x="440" y="79" text-anchor="middle" font-size="14">病態・呼吸・口腔・認知・動作</text><path d="M440 94V125M440 125H230V145M440 125H650V145" fill="none" stroke="#5c98a8" stroke-width="3"/><rect x="55" y="146" width="350" height="132" rx="20" fill="#fff" stroke="#57a581" stroke-width="3"/><circle cx="103" cy="187" r="23" fill="#dff3e8"/><text x="103" y="194" text-anchor="middle" font-size="24">○</text><text x="139" y="184" font-size="22" font-weight="700">間接訓練</text><text x="139" y="211" font-size="17" font-weight="700" fill="#31775a">食物を使わない</text><text x="82" y="246" font-size="15">弱い機能を整える・強化する</text><rect x="475" y="146" width="350" height="132" rx="20" fill="#fff" stroke="#d18a52" stroke-width="3"/><circle cx="523" cy="187" r="23" fill="#faeadc"/><text x="523" y="195" text-anchor="middle" font-size="23">●</text><text x="559" y="184" font-size="22" font-weight="700">直接訓練</text><text x="559" y="211" font-size="17" font-weight="700" fill="#9a5d2f">食物を使う</text><text x="502" y="246" font-size="15">食形態・姿勢・一口量も調整する</text><text x="440" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#b14f4f">間接訓練ができても、経口摂取の安全とは別の判断</text></g></svg>
