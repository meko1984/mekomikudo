<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">心タンポナーデのしくみ</title><style>.t{font:700 20px sans-serif;fill:#402b32}.h{font:700 16px sans-serif;fill:#402b32}.s{font:13px sans-serif;fill:#624b53}.b{fill:#fff;stroke:#bd8795;stroke-width:2}.a{stroke:#a64f64;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#a64f64"/></marker></defs><rect width="880" height="320" rx="24" fill="#faf1f3"/><text class="t" x="440" y="38" text-anchor="middle">心嚢内圧が上がると、心臓が広がれなくなる</text><rect class="b" x="36" y="76" width="170" height="158" rx="20"/><path d="M121 111c-38-39-65 22-21 71l21 20 21-20c44-49 17-110-21-71z" fill="#e9939c"/><path d="M69 104c-21 32-14 83 18 111M173 104c21 32 14 83-18 111" fill="none" stroke="#75b5c2" stroke-width="12"/><text class="h" x="121" y="264" text-anchor="middle">心嚢液が貯留</text><text class="s" x="121" y="288" text-anchor="middle">急速なら少量でも危険</text><path class="a" d="M206 155h78"/><rect class="b" x="284" y="76" width="170" height="158" rx="20"/><path d="M369 111c-38-39-65 22-21 71l21 20 21-20c44-49 17-110-21-71z" fill="#e9939c"/><path d="M320 108c20 21 24 73 10 103M418 108c-20 21-24 73-10 103" fill="none" stroke="#477f90" stroke-width="9"/><text class="h" x="369" y="264" text-anchor="middle">拡張・静脈還流を妨げる</text><text class="s" x="369" y="288" text-anchor="middle">心室へ血液が入りにくい</text><path class="a" d="M454 155h78"/><rect class="b" x="532" y="76" width="144" height="158" rx="20"/><path d="M565 177h18l14-38 17 63 14-42h19" fill="none" stroke="#a64f64" stroke-width="5"/><text class="h" x="604" y="264" text-anchor="middle">心拍出量低下</text><text class="s" x="604" y="288" text-anchor="middle">頻脈・血圧低下</text><path class="a" d="M676 155h58"/><rect x="734" y="94" width="112" height="124" rx="20" fill="#ffe0dc" stroke="#cf7769" stroke-width="2"/><path d="M790 118l28 49h-56z" fill="#d56858"/><text x="790" y="156" text-anchor="middle" font-family="sans-serif" font-weight="700" fill="#fff">!</text><text class="h" x="790" y="194" text-anchor="middle">ショック</text><text class="s" x="790" y="264" text-anchor="middle">緊急排液を</text><text class="s" x="790" y="286" text-anchor="middle">検討</text></svg>
