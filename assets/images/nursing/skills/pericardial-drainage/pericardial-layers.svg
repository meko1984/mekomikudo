<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 430" role="img" aria-labelledby="title desc">
<title id="title">心臓表面と心膜腔の位置関係</title>
<desc id="desc">外側から線維性心膜、壁側の漿膜性心膜、心膜腔、臓側の漿膜性心膜、心筋の順に並ぶ拡大断面。心膜腔を青く示す。</desc>
<style>text{font-family:sans-serif;fill:#304b5b}.h{font-size:18px;font-weight:700}.s{font-size:14px}.line{fill:none;stroke:#526c78;stroke-width:1.5}</style>
<rect width="390" height="430" rx="16" fill="#f4f8fa"/>
<text class="h" x="24" y="34">心臓表面を包む膜と空間</text>
<text class="s" x="24" y="62">一部を拡大した断面</text>
<text class="s" x="24" y="91">外側</text>
<rect x="24" y="108" width="166" height="36" fill="#c5cbd9"/>
<rect x="24" y="144" width="166" height="14" fill="#a57e9a"/>
<rect x="24" y="158" width="166" height="78" fill="#c1e7ef"/>
<rect x="24" y="236" width="166" height="14" fill="#a57e9a"/>
<rect x="24" y="250" width="166" height="76" fill="#eab1af"/>
<path class="line" d="M172 126H214 M172 151H202V172H214 M172 198H214 M172 243H202V266H214 M172 294H214"/>
<text class="h" x="220" y="131">線維性心膜</text>
<text class="h" x="220" y="177">壁側の膜</text>
<text class="h" x="220" y="207">心膜腔</text>
<text class="h" x="220" y="271">臓側の膜</text>
<text class="h" x="220" y="302">心筋</text>
<text class="s" x="24" y="350">心臓側</text>
<text class="s" x="24" y="380">青い空間に心嚢液がたまる</text>
<text class="s" x="24" y="407">膜の厚さ・空間の幅は実寸ではない</text>
</svg>
