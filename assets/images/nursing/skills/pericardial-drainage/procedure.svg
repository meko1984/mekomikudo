<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">心嚢穿刺の介助の流れ</title><style>.t{font:700 20px sans-serif;fill:#402b32}.h{font:700 15px sans-serif;fill:#402b32}.s{font:13px sans-serif;fill:#624b53}.n{fill:#a64f64}.a{stroke:#bd8795;stroke-width:4}</style><rect width="880" height="320" rx="24" fill="#faf1f3"/><text class="t" x="440" y="38" text-anchor="middle">穿刺前から留置後まで、監視を切らさない</text><path class="a" d="M100 120H780"/><g font-family="sans-serif" text-anchor="middle"><g transform="translate(100 120)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">1</text><text class="h" x="0" y="60">確認</text><text class="s" x="0" y="83">患者・画像・凝固</text><text class="s" x="0" y="104">検体・役割</text></g><g transform="translate(270 120)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">2</text><text class="h" x="0" y="60">監視</text><text class="s" x="0" y="83">心電図・血圧</text><text class="s" x="0" y="104">SpO₂・意識</text></g><g transform="translate(440 120)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">3</text><text class="h" x="0" y="60">無菌介助</text><text class="s" x="0" y="83">画像ガイド</text><text class="s" x="0" y="104">穿刺・カテーテル</text></g><g transform="translate(610 120)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">4</text><text class="h" x="0" y="60">排液</text><text class="s" x="0" y="83">量・色・循環</text><text class="s" x="0" y="104">変化を読み上げる</text></g><g transform="translate(780 120)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">5</text><text class="h" x="0" y="60">留置後</text><text class="s" x="0" y="83">固定・閉鎖系</text><text class="s" x="0" y="104">心エコー再評価</text></g></g><rect x="174" y="266" width="532" height="30" rx="15" fill="#ffe0dc"/><text class="h" x="440" y="286" text-anchor="middle">不整脈・血圧低下・強い痛みは直ちに実施者へ伝える</text></svg>
