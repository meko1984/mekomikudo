<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">心タンポナーデの評価</title><style>.t{font:700 20px sans-serif;fill:#402b32}.h{font:700 15px sans-serif;fill:#402b32}.s{font:13px sans-serif;fill:#624b53}.b{fill:#fff;stroke:#bd8795;stroke-width:2}</style><rect width="880" height="320" rx="24" fill="#faf1f3"/><text class="t" x="440" y="38" text-anchor="middle">ひとつの所見ではなく、循環への影響を統合する</text><g transform="translate(30 78)"><rect class="b" width="150" height="150" rx="20"/><path d="M29 72h20l13-36 16 67 15-44h28" fill="none" stroke="#a64f64" stroke-width="5"/><text class="h" x="75" y="122" text-anchor="middle">循環</text><text class="s" x="75" y="143" text-anchor="middle">頻脈・血圧低下</text></g><g transform="translate(198 78)"><rect class="b" width="150" height="150" rx="20"/><path d="M75 31v57M75 55c-32-35-43 5-38 39 17 7 30 0 38-15M75 55c32-35 43 5 38 39-17 7-30 0-38-15" fill="none" stroke="#477f90" stroke-width="5"/><text class="h" x="75" y="122" text-anchor="middle">呼吸</text><text class="s" x="75" y="143" text-anchor="middle">息苦しさ・頻呼吸</text></g><g transform="translate(366 78)"><rect class="b" width="150" height="150" rx="20"/><circle cx="75" cy="58" r="29" fill="#f4c4b5"/><path d="M58 82v19M92 82v19" stroke="#477f90" stroke-width="7"/><text class="h" x="75" y="122" text-anchor="middle">静脈うっ血</text><text class="s" x="75" y="143" text-anchor="middle">頸静脈・尿量</text></g><g transform="translate(534 78)"><rect class="b" width="150" height="150" rx="20"/><path d="M28 70h22l12-30 16 56 14-40h30" fill="none" stroke="#477f90" stroke-width="4"/><text class="h" x="75" y="122" text-anchor="middle">心電図</text><text class="s" x="75" y="143" text-anchor="middle">低電位・不整脈</text></g><g transform="translate(702 78)"><rect class="b" width="150" height="150" rx="20"/><rect x="28" y="31" width="94" height="58" rx="8" fill="#dceff1" stroke="#477f90" stroke-width="3"/><path d="M43 76c17-24 28-22 38 0 11-26 20-25 28 0" fill="none" stroke="#a64f64" stroke-width="4"/><text class="h" x="75" y="122" text-anchor="middle">心エコー</text><text class="s" x="75" y="143" text-anchor="middle">液体・心腔虚脱</text></g><text class="s" x="440" y="276" text-anchor="middle">典型的な三徴がそろうのを待たず、時間経過と画像を合わせる</text></svg>
