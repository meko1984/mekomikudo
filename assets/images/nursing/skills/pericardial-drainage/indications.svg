<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t"><title id="t">心嚢穿刺の目的</title><style>.h{font:700 15px sans-serif;fill:#402b32}.s{font:13px sans-serif;fill:#624b53}</style><rect width="320" height="200" rx="20" fill="#faf1f3"/><text class="h" x="160" y="27" text-anchor="middle">心嚢液を排出する3つの目的</text><g transform="translate(18 51)"><circle cx="40" cy="38" r="34" fill="#f2bec4"/><path d="M40 20l17 29H23z" fill="#a64f64"/><text class="h" x="40" y="91" text-anchor="middle">救命</text><text class="s" x="40" y="114" text-anchor="middle">圧迫を解除</text></g><g transform="translate(120 51)"><circle cx="40" cy="38" r="34" fill="#dceff1"/><path d="M24 41h32M40 25v32" stroke="#477f90" stroke-width="5"/><text class="h" x="40" y="91" text-anchor="middle">症状改善</text><text class="s" x="40" y="114" text-anchor="middle">呼吸・循環</text></g><g transform="translate(222 51)"><circle cx="40" cy="38" r="34" fill="#f3e4c9"/><path d="M26 24h28v36H26zM31 30h18M31 38h18M31 46h12" fill="none" stroke="#946b3c" stroke-width="3"/><text class="h" x="40" y="91" text-anchor="middle">原因診断</text><text class="s" x="40" y="114" text-anchor="middle">培養・細胞診</text></g></svg>
