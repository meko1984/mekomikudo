<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">水分出納の学習用計算例</title><desc id="d">体重50kgで指定されたINとOUTを合計しプラス600ミリリットルを求める</desc><rect width="880" height="390" rx="24" fill="#f8fbfa"/><text x="440" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#355f55">条件をそろえてから引き算する</text><g font-family="sans-serif"><rect x="35" y="72" width="360" height="230" rx="20" fill="#eaf4ff" stroke="#79a8ca" stroke-width="3"/><text x="215" y="108" text-anchor="middle" font-size="24" font-weight="700" fill="#376b92">IN</text><text x="70" y="147" font-size="17" fill="#46677e">飲水</text><text x="350" y="147" text-anchor="end" font-size="17" fill="#46677e">1,200mL</text><text x="70" y="181" font-size="17" fill="#46677e">食事水</text><text x="350" y="181" text-anchor="end" font-size="17" fill="#46677e">1,000mL</text><text x="70" y="215" font-size="17" fill="#46677e">代謝水 5mL/kg × 50kg</text><text x="350" y="215" text-anchor="end" font-size="17" fill="#46677e">250mL</text><path d="M65 237h300" stroke="#8ca9bb" stroke-width="2"/><text x="70" y="272" font-size="19" font-weight="700" fill="#376b92">合計</text><text x="350" y="272" text-anchor="end" font-size="20" font-weight="700" fill="#376b92">2,450mL</text><rect x="485" y="72" width="360" height="230" rx="20" fill="#fff1eb" stroke="#d99a79" stroke-width="3"/><text x="665" y="108" text-anchor="middle" font-size="24" font-weight="700" fill="#99583a">OUT</text><text x="520" y="147" font-size="17" fill="#785947">尿</text><text x="800" y="147" text-anchor="end" font-size="17" fill="#785947">1,000mL</text><text x="520" y="181" font-size="17" fill="#785947">不感蒸泄 15mL/kg × 50kg</text><text x="800" y="181" text-anchor="end" font-size="17" fill="#785947">750mL</text><text x="520" y="215" font-size="17" fill="#785947">便</text><text x="800" y="215" text-anchor="end" font-size="17" fill="#785947">100mL</text><path d="M515 237h300" stroke="#bf9c87" stroke-width="2"/><text x="520" y="272" font-size="19" font-weight="700" fill="#99583a">合計</text><text x="800" y="272" text-anchor="end" font-size="20" font-weight="700" fill="#99583a">1,850mL</text></g><rect x="190" y="320" width="500" height="52" rx="17" fill="#e8f5ef" stroke="#66a38a" stroke-width="3"/><text x="440" y="354" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#34705d">2,450 − 1,850 ＝ ＋600mL/日</text></svg>
