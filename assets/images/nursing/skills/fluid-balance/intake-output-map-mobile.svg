<svg xmlns="http://www.w3.org/2000/svg" width="390" height="820" viewBox="0 0 390 820" role="img" aria-labelledby="t d"><title id="t">INとOUTに含める水分</title><desc id="d">INとOUTを経路ごとに整理し、測れない不感蒸泄を別枠で示す</desc><rect width="390" height="820" rx="22" fill="#f7fafb"/><text x="195" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#385e67">入口と出口を経路で拾う</text><g font-family="sans-serif"><rect x="25" y="60" width="340" height="315" rx="20" fill="#eaf4ff" stroke="#79a8ca" stroke-width="3"/><text x="195" y="98" text-anchor="middle" font-size="25" font-weight="700" fill="#376b92">IN</text><g fill="#fff" stroke="#93b8d2" stroke-width="2"><rect x="50" y="118" width="135" height="92" rx="14"/><rect x="205" y="118" width="135" height="92" rx="14"/><rect x="50" y="230" width="135" height="110" rx="14"/><rect x="205" y="230" width="135" height="110" rx="14"/></g><g text-anchor="middle" font-size="15" fill="#45677d"><text x="117" y="151" font-weight="700">口から</text><text x="117" y="178">飲水・食事水</text><text x="272" y="151" font-weight="700">消化管へ</text><text x="272" y="178">経管栄養・水</text><text x="117" y="267" font-weight="700">静脈から</text><text x="117" y="294">輸液・薬剤</text><text x="117" y="318">血液製剤</text><text x="272" y="267" font-weight="700">その他</text><text x="272" y="294">フラッシュ</text><text x="272" y="318">装置から</text></g><rect x="25" y="400" width="340" height="315" rx="20" fill="#fff1eb" stroke="#d99a79" stroke-width="3"/><text x="195" y="438" text-anchor="middle" font-size="25" font-weight="700" fill="#99583a">OUT</text><g fill="#fff" stroke="#dfb198" stroke-width="2"><rect x="50" y="458" width="135" height="92" rx="14"/><rect x="205" y="458" width="135" height="92" rx="14"/><rect x="50" y="570" width="135" height="110" rx="14"/><rect x="205" y="570" width="135" height="110" rx="14"/></g><g text-anchor="middle" font-size="15" fill="#785947"><text x="117" y="491" font-weight="700">腎・尿路</text><text x="117" y="518">尿・腎瘻</text><text x="272" y="491" font-weight="700">消化管</text><text x="272" y="518">便・嘔吐・吸引</text><text x="117" y="607" font-weight="700">体腔・創部</text><text x="117" y="634">ドレーン</text><text x="117" y="658">排液</text><text x="272" y="607" font-weight="700">その他</text><text x="272" y="634">出血</text><text x="272" y="658">透析除水</text></g></g><rect x="24" y="745" width="342" height="52" rx="16" fill="#fff" stroke="#a8bcb5"/><text x="195" y="768" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6960">不感蒸泄は直接測れない</text><text x="195" y="788" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6960">目的に応じて推定する</text></svg>
