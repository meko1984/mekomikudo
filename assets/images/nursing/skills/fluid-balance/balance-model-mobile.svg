<svg xmlns="http://www.w3.org/2000/svg" width="390" height="690" viewBox="0 0 390 690" role="img" aria-labelledby="t d"><title id="t">IN-OUTバランスの考え方</title><desc id="d">体へ入る量から体外へ出る量を引き、体重や症状と合わせて評価する</desc><rect width="390" height="690" rx="22" fill="#f5faf8"/><text x="195" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#315e53">測れた差を患者の変化へ</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="65" width="300" height="120" rx="20" fill="#e3f1ff" stroke="#6c9ec4" stroke-width="3"/><text x="195" y="107" font-size="25" font-weight="700" fill="#376b92">IN</text><text x="195" y="140" font-size="16" fill="#46667d">飲水・栄養・輸液・薬剤</text><text x="195" y="217" font-size="35" font-weight="700" fill="#74867f">−</text><rect x="45" y="245" width="300" height="120" rx="20" fill="#fff0e9" stroke="#d28b69" stroke-width="3"/><text x="195" y="287" font-size="25" font-weight="700" fill="#9a5635">OUT</text><text x="195" y="320" font-size="16" fill="#775746">尿・便・排液・出血・除水</text><text x="195" y="397" font-size="35" font-weight="700" fill="#74867f">＝</text><rect x="45" y="425" width="300" height="105" rx="20" fill="#e8f5ef" stroke="#62a086" stroke-width="3"/><text x="195" y="468" font-size="24" font-weight="700" fill="#34705d">収支 ＋ / −</text><text x="195" y="500" font-size="15" fill="#5f756d">測定した期間の差</text><path d="M195 535v35" stroke="#64a087" stroke-width="4"/><path d="m185 559 10 12 10-12" fill="none" stroke="#64a087" stroke-width="4"/><rect x="28" y="575" width="334" height="85" rx="18" fill="#fff" stroke="#8eb8aa" stroke-width="2"/><text x="195" y="610" font-size="16" font-weight="700" fill="#3f6559">体重・呼吸・循環・尿量</text><text x="195" y="638" font-size="16" font-weight="700" fill="#3f6559">検査値で意味を確かめる</text></g></svg>
