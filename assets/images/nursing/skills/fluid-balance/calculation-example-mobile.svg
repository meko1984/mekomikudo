<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780" role="img" aria-labelledby="t d"><title id="t">水分出納の学習用計算例</title><desc id="d">体重50kgで指定されたINとOUTを合計しプラス600ミリリットルを求める</desc><rect width="390" height="780" rx="22" fill="#f8fbfa"/><text x="195" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#355f55">条件をそろえて引き算</text><g font-family="sans-serif"><rect x="25" y="62" width="340" height="270" rx="20" fill="#eaf4ff" stroke="#79a8ca" stroke-width="3"/><text x="195" y="99" text-anchor="middle" font-size="24" font-weight="700" fill="#376b92">IN</text><text x="50" y="140" font-size="15" fill="#46677e">飲水</text><text x="340" y="140" text-anchor="end" font-size="15" fill="#46677e">1,200mL</text><text x="50" y="177" font-size="15" fill="#46677e">食事水</text><text x="340" y="177" text-anchor="end" font-size="15" fill="#46677e">1,000mL</text><text x="50" y="214" font-size="15" fill="#46677e">代謝水 5 × 50kg</text><text x="340" y="214" text-anchor="end" font-size="15" fill="#46677e">250mL</text><path d="M45 240h300" stroke="#8ca9bb" stroke-width="2"/><text x="50" y="280" font-size="18" font-weight="700" fill="#376b92">合計</text><text x="340" y="280" text-anchor="end" font-size="19" font-weight="700" fill="#376b92">2,450mL</text><rect x="25" y="355" width="340" height="270" rx="20" fill="#fff1eb" stroke="#d99a79" stroke-width="3"/><text x="195" y="392" text-anchor="middle" font-size="24" font-weight="700" fill="#99583a">OUT</text><text x="50" y="433" font-size="15" fill="#785947">尿</text><text x="340" y="433" text-anchor="end" font-size="15" fill="#785947">1,000mL</text><text x="50" y="470" font-size="15" fill="#785947">不感蒸泄 15 × 50kg</text><text x="340" y="470" text-anchor="end" font-size="15" fill="#785947">750mL</text><text x="50" y="507" font-size="15" fill="#785947">便</text><text x="340" y="507" text-anchor="end" font-size="15" fill="#785947">100mL</text><path d="M45 533h300" stroke="#bf9c87" stroke-width="2"/><text x="50" y="573" font-size="18" font-weight="700" fill="#99583a">合計</text><text x="340" y="573" text-anchor="end" font-size="19" font-weight="700" fill="#99583a">1,850mL</text></g><rect x="25" y="652" width="340" height="95" rx="18" fill="#e8f5ef" stroke="#66a38a" stroke-width="3"/><text x="195" y="690" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#34705d">2,450 − 1,850</text><text x="195" y="720" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#34705d">＝ ＋600mL/日</text></svg>
