<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">INとOUTに含める水分</title><desc id="d">INとOUTを経路ごとに整理し、測れない不感蒸泄を別枠で示す</desc><rect width="880" height="390" rx="24" fill="#f7fafb"/><text x="440" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#385e67">入口と出口を、経路ごとに拾う</text><g font-family="sans-serif"><rect x="35" y="68" width="370" height="265" rx="22" fill="#eaf4ff" stroke="#79a8ca" stroke-width="3"/><text x="220" y="105" text-anchor="middle" font-size="26" font-weight="700" fill="#376b92">IN</text><g fill="#fff" stroke="#93b8d2" stroke-width="2"><rect x="60" y="125" width="145" height="75" rx="14"/><rect x="235" y="125" width="145" height="75" rx="14"/><rect x="60" y="220" width="145" height="75" rx="14"/><rect x="235" y="220" width="145" height="75" rx="14"/></g><g text-anchor="middle" font-size="16" fill="#45677d"><text x="132" y="157" font-weight="700">口から</text><text x="132" y="181">飲水・食事水</text><text x="307" y="157" font-weight="700">消化管へ</text><text x="307" y="181">経管栄養・水</text><text x="132" y="252" font-weight="700">静脈から</text><text x="132" y="276">輸液・薬剤・血液</text><text x="307" y="252" font-weight="700">その他</text><text x="307" y="276">フラッシュ・装置</text></g><rect x="475" y="68" width="370" height="265" rx="22" fill="#fff1eb" stroke="#d99a79" stroke-width="3"/><text x="660" y="105" text-anchor="middle" font-size="26" font-weight="700" fill="#99583a">OUT</text><g fill="#fff" stroke="#dfb198" stroke-width="2"><rect x="500" y="125" width="145" height="75" rx="14"/><rect x="675" y="125" width="145" height="75" rx="14"/><rect x="500" y="220" width="145" height="75" rx="14"/><rect x="675" y="220" width="145" height="75" rx="14"/></g><g text-anchor="middle" font-size="16" fill="#785947"><text x="572" y="157" font-weight="700">腎・尿路</text><text x="572" y="181">尿・腎瘻</text><text x="747" y="157" font-weight="700">消化管</text><text x="747" y="181">便・嘔吐・吸引</text><text x="572" y="252" font-weight="700">体腔・創部</text><text x="572" y="276">ドレーン・排液</text><text x="747" y="252" font-weight="700">その他</text><text x="747" y="276">出血・透析除水</text></g></g><rect x="180" y="345" width="520" height="31" rx="14" fill="#fff" stroke="#a8bcb5"/><text x="440" y="367" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6960">測れないもの：皮膚・呼吸からの不感蒸泄　→　目的に応じて推定</text></svg>
