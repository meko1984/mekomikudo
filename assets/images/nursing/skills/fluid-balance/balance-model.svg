<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="t d"><title id="t">IN-OUTバランスの考え方</title><desc id="d">体へ入る量から体外へ出る量を引き、体重や症状と合わせて評価する</desc><rect width="880" height="330" rx="24" fill="#f5faf8"/><text x="440" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#315e53">測れた差を、患者の変化につなげる</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="90" width="210" height="135" rx="22" fill="#e3f1ff" stroke="#6c9ec4" stroke-width="3"/><text x="150" y="135" font-size="27" font-weight="700" fill="#376b92">IN</text><text x="150" y="169" font-size="17" fill="#46667d">飲水・栄養・輸液</text><text x="150" y="198" font-size="17" fill="#46667d">薬剤・血液製剤</text><text x="318" y="170" font-size="42" font-weight="700" fill="#74867f">−</text><rect x="365" y="90" width="210" height="135" rx="22" fill="#fff0e9" stroke="#d28b69" stroke-width="3"/><text x="470" y="135" font-size="27" font-weight="700" fill="#9a5635">OUT</text><text x="470" y="169" font-size="17" fill="#775746">尿・便・排液</text><text x="470" y="198" font-size="17" fill="#775746">嘔吐・出血・除水</text><text x="638" y="170" font-size="42" font-weight="700" fill="#74867f">＝</text><rect x="685" y="90" width="150" height="135" rx="22" fill="#e8f5ef" stroke="#62a086" stroke-width="3"/><text x="760" y="139" font-size="24" font-weight="700" fill="#34705d">収支</text><text x="760" y="177" font-size="19" fill="#496c60">＋ / −</text><text x="760" y="205" font-size="14" fill="#5f756d">測定期間の差</text></g><path d="M760 232v34H440" fill="none" stroke="#64a087" stroke-width="4"/><path d="m448 257-12 9 12 9" fill="none" stroke="#64a087" stroke-width="4"/><rect x="224" y="253" width="430" height="52" rx="16" fill="#fff" stroke="#8eb8aa" stroke-width="2"/><text x="439" y="286" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#3f6559">体重・呼吸・循環・尿量・検査値で意味を確かめる</text></svg>
