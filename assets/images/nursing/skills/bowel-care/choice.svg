<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">便処置の使い分け</title><desc id="d">坐薬、浣腸、摘便を便の状態から選ぶ</desc><rect width="320" height="200" rx="24" fill="#f2f8fa"/><g text-anchor="middle" font-size="13" font-weight="700"><rect x="14" y="58" width="88" height="88" rx="20" fill="#fff" stroke="#4f9cac" stroke-width="3"/><text x="58" y="88" fill="#285b66">坐薬</text><text x="58" y="112" font-size="11" fill="#285b66">薬剤作用で</text><text x="58" y="130" font-size="11" fill="#285b66">排便を促す</text><rect x="116" y="58" width="88" height="88" rx="20" fill="#fff" stroke="#d3984f" stroke-width="3"/><text x="160" y="88" fill="#80591f">浣腸</text><text x="160" y="112" font-size="11" fill="#80591f">液で刺激・</text><text x="160" y="130" font-size="11" fill="#80591f">軟化する</text><rect x="218" y="58" width="88" height="88" rx="20" fill="#fff" stroke="#8066a1" stroke-width="3"/><text x="262" y="88" fill="#59476f">摘便</text><text x="262" y="112" font-size="11" fill="#59476f">触れる硬便を</text><text x="262" y="130" font-size="11" fill="#59476f">少量ずつ除く</text></g><text x="160" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#285b66">便の位置・硬さ・患者状態で選ぶ</text></svg>
