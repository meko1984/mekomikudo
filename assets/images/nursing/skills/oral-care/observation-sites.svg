<g font-family="sans-serif" fill="#304b5b" font-size="15"><text x="272" y="96">歯・歯肉</text><text x="272" y="142">口蓋</text><text x="272" y="189">頬粘膜</text><text x="272" y="234">舌の上面</text><text x="272" y="279">口唇</text><text x="22" y="313" font-size="14">② 舌を持ち上げて見た模式図</text><text x="272" y="415">口腔底</text><text x="272" y="440" font-size="13">舌の下の床</text><text x="22" y="481" font-size="13">色は部位の区別。清掃器具の深さは示さない。</text><text x="22" y="505" font-size="13">痛みや抵抗があるときは無理に開口しない。</text></g>
