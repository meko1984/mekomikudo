<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img"><title>CPAPと二段階圧</title><desc>CPAPは一定の圧、二段階圧はIPAPとEPAPの二つの圧を使う</desc><rect width="320" height="200" rx="18" fill="#f3f7f8"/><text x="72" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#315363">CPAP</text><path d="M20 128 H132" stroke="#9aadb5" stroke-width="3"/><path d="M24 78 H128" stroke="#4d9b83" stroke-width="8"/><text x="76" y="65" text-anchor="middle" font-size="13" fill="#31745f">一定</text><path d="M158 128 H300" stroke="#9aadb5" stroke-width="3"/><path d="M162 116 V58 H220 V116 H294" fill="none" stroke="#4f86b7" stroke-width="8" stroke-linejoin="round"/><text x="191" y="45" text-anchor="middle" font-size="13" fill="#315e86">IPAP</text><text x="260" y="105" text-anchor="middle" font-size="13" fill="#315e86">EPAP</text><path d="M218 58 V116" stroke="#dd9b52" stroke-width="3" stroke-dasharray="5 4"/><text x="225" y="88" font-size="12" fill="#9b642c">PS</text><text x="231" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#315363">二段階圧</text><text x="160" y="178" text-anchor="middle" font-size="13" fill="#536b75">PS ＝ IPAP − EPAP</text></svg>
