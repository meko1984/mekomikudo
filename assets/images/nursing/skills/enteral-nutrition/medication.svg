<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">チューブからの薬剤投与</title><style>.t{font:700 20px sans-serif;fill:#4d4630}.h{font:700 14px sans-serif;fill:#4d4630}.s{font:12px sans-serif;fill:#6b634d}.b{fill:#fff;stroke:#b7a96e;stroke-width:2}.a{stroke:#b46659;stroke-width:4;fill:none}</style><rect width="880" height="320" rx="24" fill="#f8f5e9"/><text class="t" x="440" y="38" text-anchor="middle">一剤ずつ、薬剤間にも水を通す</text><g transform="translate(43 83)"><rect class="b" width="160" height="145" rx="20"/><path d="M48 38h64v35H48z" fill="#e8cf83"/><path d="M52 33l56 45" stroke="#b46659" stroke-width="5"/><text class="h" x="80" y="111" text-anchor="middle">栄養を止める</text></g><path class="a" d="M218 155h70"/><path d="M278 146l15 9-15 9" fill="none" stroke="#b46659" stroke-width="4"/><g transform="translate(303 83)"><rect class="b" width="160" height="145" rx="20"/><path d="M56 28h48v54H56z" fill="#dce9e4" stroke="#7a9a85" stroke-width="3"/><text class="h" x="80" y="111" text-anchor="middle">前フラッシュ</text></g><path class="a" d="M478 155h70"/><path d="M538 146l15 9-15 9" fill="none" stroke="#b46659" stroke-width="4"/><g transform="translate(563 83)"><rect class="b" width="160" height="145" rx="20"/><circle cx="58" cy="53" r="17" fill="#b46659"/><circle cx="102" cy="53" r="17" fill="#907f3d"/><text class="h" x="80" y="111" text-anchor="middle">一剤ずつ投与</text></g><path class="a" d="M738 155h55"/><path d="M783 146l15 9-15 9" fill="none" stroke="#b46659" stroke-width="4"/><g transform="translate(803 103)"><circle cx="27" cy="52" r="26" fill="#dce9e4" stroke="#7a9a85" stroke-width="3"/><text class="h" x="27" y="57" text-anchor="middle">水</text></g><text class="s" x="440" y="278" text-anchor="middle">薬剤を栄養剤へ混ぜない・粉砕可否を確認する</text></svg>
