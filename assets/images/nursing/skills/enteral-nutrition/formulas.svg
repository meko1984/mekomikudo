<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">経腸栄養剤の種類</title><style>.t{font:700 20px sans-serif;fill:#4d4630}.h{font:700 15px sans-serif;fill:#4d4630}.s{font:12px sans-serif;fill:#6b634d}.b{fill:#fff;stroke:#b7a96e;stroke-width:2}</style><rect width="880" height="320" rx="24" fill="#f8f5e9"/><text class="t" x="440" y="38" text-anchor="middle">消化吸収能・病態・必要量に合わせる</text><g transform="translate(28 76)"><rect class="b" width="190" height="160" rx="20"/><circle cx="95" cy="51" r="28" fill="#e8cf83"/><text class="h" x="95" y="102" text-anchor="middle">半消化態</text><text class="s" x="95" y="128" text-anchor="middle">蛋白質を主な窒素源</text></g><g transform="translate(239 76)"><rect class="b" width="190" height="160" rx="20"/><circle cx="95" cy="51" r="22" fill="#e8cf83"/><circle cx="67" cy="51" r="12" fill="#f0d6c2"/><circle cx="123" cy="51" r="12" fill="#f0d6c2"/><text class="h" x="95" y="102" text-anchor="middle">消化態</text><text class="s" x="95" y="128" text-anchor="middle">ペプチドなど</text></g><g transform="translate(450 76)"><rect class="b" width="190" height="160" rx="20"/><circle cx="65" cy="51" r="10" fill="#b46659"/><circle cx="95" cy="51" r="10" fill="#907f3d"/><circle cx="125" cy="51" r="10" fill="#7a9a85"/><text class="h" x="95" y="102" text-anchor="middle">成分栄養</text><text class="s" x="95" y="128" text-anchor="middle">アミノ酸を窒素源</text></g><g transform="translate(661 76)"><rect class="b" width="190" height="160" rx="20"/><path d="M66 61h58M95 32v58" stroke="#b46659" stroke-width="8"/><text class="h" x="95" y="102" text-anchor="middle">病態別など</text><text class="s" x="95" y="128" text-anchor="middle">疾患・水分・蛋白</text></g><text class="s" x="440" y="280" text-anchor="middle">濃さだけでなく、自由水・電解質・脂質・食物繊維も確認</text></svg>
