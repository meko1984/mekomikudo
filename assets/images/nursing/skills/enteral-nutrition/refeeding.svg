<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">再栄養症候群の流れ</title><style>.t{font:700 20px sans-serif;fill:#5d3b35}.h{font:700 15px sans-serif;fill:#5d3b35}.s{font:12px sans-serif;fill:#72584f}.b{fill:#fff;stroke:#c9957d;stroke-width:2}.a{stroke:#b46659;stroke-width:4;fill:none}</style><rect width="880" height="320" rx="24" fill="#fbf1eb"/><text class="t" x="440" y="38" text-anchor="middle">低栄養の患者へ急に多く入れると、体液と電解質が大きく動く</text><g transform="translate(35 82)"><rect class="b" width="190" height="150" rx="20"/><path d="M55 92c4-32 10-56 38-56s37 24 42 56" fill="none" stroke="#c9957d" stroke-width="8"/><text class="h" x="95" y="119" text-anchor="middle">低栄養・絶食</text><text class="s" x="95" y="140" text-anchor="middle">体内の貯えが少ない</text></g><path class="a" d="M242 157h70"/><path d="M302 148l15 9-15 9" fill="none" stroke="#b46659" stroke-width="4"/><g transform="translate(330 82)"><rect class="b" width="220" height="150" rx="20"/><circle cx="65" cy="61" r="22" fill="#e8cf83"/><path d="M99 61h57" stroke="#b46659" stroke-width="8"/><text class="h" x="110" y="112" text-anchor="middle">栄養を急に開始</text><text class="s" x="110" y="135" text-anchor="middle">インスリン・体液が変化</text></g><path class="a" d="M568 157h70"/><path d="M628 148l15 9-15 9" fill="none" stroke="#b46659" stroke-width="4"/><g transform="translate(655 82)"><rect class="b" width="190" height="150" rx="20"/><text x="95" y="65" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#b46659">P・K・Mg ↓</text><text class="h" x="95" y="112" text-anchor="middle">心・肺・神経症状</text><text class="s" x="95" y="135" text-anchor="middle">浮腫・不整脈・意識変化</text></g><text class="s" x="440" y="278" text-anchor="middle">リスク評価 → 少量から開始 → 検査値と全身を追う</text></svg>
