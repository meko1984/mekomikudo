<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">経管栄養の投与経路</title><style>.t{font:700 20px sans-serif;fill:#4d4630}.h{font:700 15px sans-serif;fill:#4d4630}.s{font:12px sans-serif;fill:#6b634d}.b{fill:#fff;stroke:#b7a96e;stroke-width:2}.v{fill:none;stroke:#b46659;stroke-width:5;stroke-linecap:round}</style><rect width="880" height="320" rx="24" fill="#f8f5e9"/><text class="t" x="440" y="38" text-anchor="middle">消化管のどこへ届けるかで、投与方法が変わる</text><g transform="translate(30 76)"><rect class="b" width="190" height="160" rx="20"/><circle cx="58" cy="43" r="22" fill="#f0d6c2"/><path class="v" d="M59 63v55c0 17 22 18 22 0V84"/><text class="h" x="124" y="52">経鼻・経口</text><text class="s" x="124" y="76">胃・小腸へ</text><text class="s" x="95" y="142" text-anchor="middle">短期的な経路</text></g><g transform="translate(240 76)"><rect class="b" width="190" height="160" rx="20"/><path d="M62 31c44 0 54 37 42 69-10 29-56 23-66-6-9-27-5-63 24-63z" fill="#f0d6c2" stroke="#b46659" stroke-width="3"/><path class="v" d="M16 75h45"/><circle cx="61" cy="75" r="6" fill="#b46659"/><text class="h" x="132" y="58">胃瘻</text><text class="s" x="132" y="82">腹壁から胃</text><text class="s" x="95" y="142" text-anchor="middle">胃の貯留能を使う</text></g><g transform="translate(450 76)"><rect class="b" width="190" height="160" rx="20"/><path d="M54 30c39 0 46 33 36 60-8 24-47 20-57-5-9-24-4-55 21-55z" fill="#f0d6c2" stroke="#b46659" stroke-width="3"/><path class="v" d="M16 64h34c22 0 52 38 78 38"/><text class="h" x="126" y="57">胃空腸瘻</text><text class="s" x="126" y="81">小腸ポート</text><text class="s" x="95" y="142" text-anchor="middle">ポートを区別</text></g><g transform="translate(660 76)"><rect class="b" width="190" height="160" rx="20"/><path d="M52 42c18-24 54-12 48 14-5 23-42 15-45 37-2 20 39 13 43 34" fill="none" stroke="#b46659" stroke-width="8"/><path class="v" d="M16 88h47"/><text class="h" x="135" y="57">腸瘻</text><text class="s" x="135" y="81">腹壁から小腸</text><text class="s" x="95" y="142" text-anchor="middle">慎重な速度管理</text></g><text class="s" x="440" y="279" text-anchor="middle">チューブ名だけでなく、先端位置と注入口を確認する</text></svg>
