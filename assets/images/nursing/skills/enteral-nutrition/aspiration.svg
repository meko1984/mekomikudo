<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">誤嚥リスクを下げる管理</title><style>.t{font:700 20px sans-serif;fill:#4d4630}.h{font:700 15px sans-serif;fill:#4d4630}.s{font:12px sans-serif;fill:#6b634d}.b{fill:#fff;stroke:#b7a96e;stroke-width:2}</style><rect width="880" height="320" rx="24" fill="#f8f5e9"/><text class="t" x="440" y="38" text-anchor="middle">体位だけでなく、位置・速度・呼吸・口腔をみる</text><g transform="translate(35 76)"><rect class="b" width="190" height="160" rx="20"/><path d="M40 111h110V92H83V52H40z" fill="#e8cf83"/><circle cx="69" cy="42" r="20" fill="#f0d6c2"/><path d="M83 88l49-28" stroke="#b46659" stroke-width="5"/><text class="h" x="95" y="140" text-anchor="middle">上半身30～45度</text></g><g transform="translate(242 76)"><rect class="b" width="190" height="160" rx="20"/><path d="M54 35v65c0 22 33 22 33 0V70" fill="none" stroke="#b46659" stroke-width="6"/><circle cx="54" cy="34" r="8" fill="#907f3d"/><text class="h" x="120" y="63">位置確認</text><text class="s" x="120" y="87">外部長・固定</text><text class="h" x="95" y="140" text-anchor="middle">疑わしければ止める</text></g><g transform="translate(449 76)"><rect class="b" width="190" height="160" rx="20"/><path d="M26 73h21l11-33 16 64 15-47 15 16h34" fill="none" stroke="#b46659" stroke-width="5"/><text class="h" x="95" y="119" text-anchor="middle">呼吸・意識</text><text class="s" x="95" y="142" text-anchor="middle">咳・SpO₂・嘔吐</text></g><g transform="translate(656 76)"><rect class="b" width="190" height="160" rx="20"/><path d="M55 40c25-18 55-4 59 21 4 30-28 44-54 29-19-11-21-38-5-50z" fill="#f0d6c2"/><path d="M68 66h34" stroke="#fff" stroke-width="6"/><text class="h" x="95" y="119" text-anchor="middle">口腔ケア</text><text class="s" x="95" y="142" text-anchor="middle">乾燥・痰・歯垢</text></g><text class="s" x="440" y="280" text-anchor="middle">投与後も患者に応じて挙上を続ける</text></svg>
