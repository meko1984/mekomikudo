ext x="62" y="45" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">5</text><text class="h" x="62" y="90" text-anchor="middle">量・速度</text><text class="s" x="62" y="116" text-anchor="middle">開始・休止</text></g><g transform="translate(731 76)"><rect class="b" width="124" height="152" rx="18"/><circle class="n" cx="62" cy="38" r="22"/><text x="62" y="45" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">6</text><text class="h" x="62" y="90" text-anchor="middle">水分</text><text class="s" x="62" y="116" text-anchor="middle">種類・量・頻度</text></g><text class="s" x="440" y="276" text-anchor="middle">一つでも不明なら開始前に確認する</text></svg>
