<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">経管栄養投与の流れ</title><style>.t{font:700 20px sans-serif;fill:#4d4630}.h{font:700 13px sans-serif;fill:#4d4630}.s{font:11px sans-serif;fill:#6b634d}.b{fill:#fff;stroke:#b7a96e;stroke-width:2}.n{fill:#907f3d}</style><rect width="880" height="320" rx="24" fill="#f8f5e9"/><text class="t" x="440" y="38" text-anchor="middle">患者側からラインをたどって接続する</text><g transform="translate(19 76)"><rect class="b" width="108" height="154" rx="17"/><circle class="n" cx="54" cy="32" r="17"/><text x="54" y="38" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">1</text><text class="h" x="54" y="78" text-anchor="middle">照合</text><text class="s" x="54" y="104" text-anchor="middle">患者・指示</text></g><g transform="translate(141 76)"><rect class="b" width="108" height="154" rx="17"/><circle class="n" cx="54" cy="32" r="17"/><text x="54" y="38" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">2</text><text class="h" x="54" y="78" text-anchor="middle">体位</text><text class="s" x="54" y="104" text-anchor="middle">上半身挙上</text></g><g transform="translate(263 76)"><rect class="b" width="108" height="154" rx="17"/><circle class="n" cx="54" cy="32" r="17"/><text x="54" y="38" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">3</text><text class="h" x="54" y="78" text-anchor="middle">位置・注入口</text><text class="s" x="54" y="104" text-anchor="middle">外部長も確認</text></g><g transform="translate(385 76)"><rect class="b" width="108" height="154" rx="17"/><circle class="n" cx="54" cy="32" r="17"/><text x="54" y="38" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">4</text><text class="h" x="54" y="78" text-anchor="middle">フラッシュ</text><text class="s" x="54" y="104" text-anchor="middle">通過性を確認</text></g><g transform="translate(507 76)"><rect class="b" width="108" height="154" rx="17"/><circle class="n" cx="54" cy="32" r="17"/><text x="54" y="38" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">5</text><text class="h" x="54" y="78" text-anchor="middle">接続・開始</text><text class="s" x="54" y="104" text-anchor="middle">指示速度</text></g><g transform="translate(629 76)"><rect class="b" width="108" height="154" rx="17"/><circle class="n" cx="54" cy="32" r="17"/><text x="54" y="38" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">6</text><text class="h" x="54" y="78" text-anchor="middle">観察</text><text class="s" x="54" y="104" text-anchor="middle">呼吸・腹部</text></g><g transform="translate(751 76)"><rect class="b" width="108" height="154" rx="17"/><circle class="n" cx="54" cy="32" r="17"/><text x="54" y="38" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">7</text><text class="h" x="54" y="78" text-anchor="middle">終了・記録</text><text class="s" x="54" y="104" text-anchor="middle">実投与量</text></g><text class="s" x="440" y="278" text-anchor="middle">抵抗・漏れ・疼痛・呼吸変化があれば開始しない</text></svg>
