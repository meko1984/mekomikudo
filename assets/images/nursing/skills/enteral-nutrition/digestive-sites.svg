<svg xmlns="http://www.w3.org/2000/svg" width="390" height="470" viewBox="0 0 390 470" role="img" aria-labelledby="title desc">
  <title id="title">胃・幽門・十二指腸・空腸の位置関係</title>
  <desc id="desc">患者を正面から見た上腹部の模式図。胃は患者の左側にあり、幽門から十二指腸、空腸へ続く。チューブ挿入経路や留置位置を示す図ではない。</desc>
  <rect width="390" height="470" rx="18" fill="#f8f5e9"/>
  <g font-family="system-ui, 'Noto Sans JP', sans-serif" fill="#4d4630">
    <text x="195" y="32" text-anchor="middle" font-size="18" font-weight="700">胃の先にある投与先</text>
    <text x="36" y="64" font-size="13">患者の右</text><text x="354" y="64" text-anchor="end" font-size="13">患者の左</text>
    <path d="M84 82 Q55 114 61 168 L74 359 Q195 382 316 359 L329 168 Q335 114 306 82" fill="#fff" stroke="#d5cdb4" stroke-width="2"/>
    <path d="M216 88 L216 140" fill="none" stroke="#ac8e79" stroke-width="15" stroke-linecap="round"/>
    <path d="M213 139 C219 103 267 105 286 137 C308 175 291 219 257 227 C225 236 202 216 180 200 L158 197 L158 177 L185 177 C208 181 224 180 224 160 Z" fill="#efc8af" stroke="#b46659" stroke-width="3"/>
    <path d="M158 187 C126 185 103 203 106 232 C111 266 143 268 169 252 L197 247" fill="none" stroke="#cb9756" stroke-width="19" stroke-linecap="round"/>
    <path d="M197 247 C218 236 255 248 257 269 C258 291 221 286 206 305 C190 326 230 342 255 329" fill="none" stroke="#7f9b82" stroke-width="19" stroke-linecap="round"/>
    <circle cx="158" cy="187" r="10" fill="#9f5362" stroke="#fff" stroke-width="2"/>
    <g fill="none" stroke="#746a51" stroke-width="1.5"><path d="M253 156 L282 100 H303"/><path d="M158 187 L115 147 H89"/><path d="M111 229 L83 273 H49"/><path d="M246 293 L282 314 H299"/></g>
    <text x="309" y="105" font-size="16" font-weight="700">胃</text>
    <text x="83" y="152" text-anchor="end" font-size="16" font-weight="700">幽門</text>
    <text x="30" y="295" font-size="16" font-weight="700">十二指腸</text>
    <text x="304" y="319" font-size="16" font-weight="700">空腸</text>
    <text x="195" y="403" text-anchor="middle" font-size="15" font-weight="700">胃 → 幽門 → 十二指腸 → 空腸</text>
    <text x="195" y="433" text-anchor="middle" font-size="13">部位の位置関係を示す模式図</text>
    <text x="195" y="454" text-anchor="middle" font-size="13">挿入経路・深さ・先端位置の確認には使わない</text>
  </g>
</svg>
