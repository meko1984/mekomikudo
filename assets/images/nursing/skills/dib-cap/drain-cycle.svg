<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="title desc">
  <title id="title">DIBキャップから排尿する流れ</title><desc id="desc">時刻と症状の確認、排尿、尿の観察、閉鎖と清拭、記録の5段階</desc>
  <defs><style>.n{font:700 19px system-ui,sans-serif;fill:#fff}.h{font:700 18px system-ui,sans-serif;fill:#173b47}.t{font:600 15px system-ui,sans-serif;fill:#49636c}.line{stroke:#d67b55;stroke-width:5;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#d67b55"/></marker></defs>
  <rect width="880" height="330" rx="24" fill="#f3f8fa"/>
  <path class="line" marker-end="url(#a)" d="M174 166h65M346 166h65M518 166h65M690 166h55"/>
  <g transform="translate(31 88)"><circle cx="72" cy="20" r="20" fill="#47879a"/><text x="72" y="27" class="n" text-anchor="middle">1</text><rect y="51" width="144" height="116" rx="17" fill="#fff" stroke="#74a2b0" stroke-width="2"/><text x="72" y="84" class="h" text-anchor="middle">確認</text><text x="72" y="112" class="t" text-anchor="middle">時刻・尿意</text><text x="72" y="135" class="t" text-anchor="middle">膨満・痛み</text></g>
  <g transform="translate(203 88)"><circle cx="72" cy="20" r="20" fill="#47879a"/><text x="72" y="27" class="n" text-anchor="middle">2</text><rect y="51" width="144" height="116" rx="17" fill="#fff" stroke="#74a2b0" stroke-width="2"/><text x="72" y="84" class="h" text-anchor="middle">開く</text><text x="72" y="112" class="t" text-anchor="middle">排出口を下へ</text><text x="72" y="135" class="t" text-anchor="middle">自然に流す</text></g>
  <g transform="translate(375 88)"><circle cx="72" cy="20" r="20" fill="#47879a"/><text x="72" y="27" class="n" text-anchor="middle">3</text><rect y="51" width="144" height="116" rx="17" fill="#fff" stroke="#74a2b0" stroke-width="2"/><text x="72" y="84" class="h" text-anchor="middle">観察</text><text x="72" y="112" class="t" text-anchor="middle">流れ・量</text><text x="72" y="135" class="t" text-anchor="middle">色・混濁・血</text></g>
  <g transform="translate(547 88)"><circle cx="72" cy="20" r="20" fill="#47879a"/><text x="72" y="27" class="n" text-anchor="middle">4</text><rect y="51" width="144" height="116" rx="17" fill="#fff" stroke="#74a2b0" stroke-width="2"/><text x="72" y="84" class="h" text-anchor="middle">閉じる</text><text x="72" y="112" class="t" text-anchor="middle">閉鎖を確認</text><text x="72" y="135" class="t" text-anchor="middle">外側を清拭</text></g>
  <g transform="translate(715 88)"><circle cx="67" cy="20" r="20" fill="#47879a"/><text x="67" y="27" class="n" text-anchor="middle">5</text><rect y="51" width="134" height="116" rx="17" fill="#fff" stroke="#74a2b0" stroke-width="2"/><text x="67" y="84" class="h" text-anchor="middle">記録</text><text x="67" y="112" class="t" text-anchor="middle">時刻・量</text><text x="67" y="135" class="t" text-anchor="middle">症状・次回</text></g>
