<svg xmlns="http://www.w3.org/2000/svg" width="390" height="790" viewBox="0 0 390 790" role="img" aria-labelledby="t d"><title id="t">胃内留置と幽門後留置</title><desc id="d">胃内に先端を置くNGと胃を越えて十二指腸または空腸に置く幽門後チューブを示す</desc><rect width="390" height="790" rx="22" fill="#f7faf9"/><text x="195" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#355e55">先端がどこにあるか</text><g font-family="sans-serif"><rect x="25" y="60" width="340" height="300" rx="20" fill="#edf5fb" stroke="#86a9bd" stroke-width="3"/><text x="195" y="99" text-anchor="middle" font-size="22" font-weight="700" fill="#376b92">胃内留置</text><circle cx="95" cy="161" r="25" fill="#fff" stroke="#668da5" stroke-width="4"/><path d="M65 233c4-47 57-47 61 0" fill="#fff" stroke="#668da5" stroke-width="4"/><path d="M95 136c53 7 77 42 95 94" fill="none" stroke="#5b8eae" stroke-width="7" stroke-linecap="round"/><path d="M190 230c47-34 99-8 99 34-34 24-72 26-99 0z" fill="#fff" stroke="#5b8eae" stroke-width="4"/><circle cx="190" cy="230" r="8" fill="#d06d66"/><text x="195" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#376b92">鼻 → 食道 → 胃</text><text x="195" y="335" text-anchor="middle" font-size="14" fill="#526f81">栄養・投薬／対応製品で減圧</text><rect x="25" y="385" width="340" height="320" rx="20" fill="#eef8f4" stroke="#82ad9d" stroke-width="3"/><text x="195" y="424" text-anchor="middle" font-size="22" font-weight="700" fill="#34705d">幽門後留置</text><circle cx="82" cy="486" r="25" fill="#fff" stroke="#668d80" stroke-width="4"/><path d="M52 558c4-47 57-47 61 0" fill="#fff" stroke="#668d80" stroke-width="4"/><path d="M82 461c53 7 77 42 95 94" fill="none" stroke="#57947e" stroke-width="7" stroke-linecap="round"/><path d="M177 555c47-34 99-8 99 34-34 24-72 26-99 0z" fill="#fff" stroke="#57947e" stroke-width="4"/><path d="M245 594c26 0 34 23 57 23" fill="none" stroke="#57947e" stroke-width="7" stroke-linecap="round"/><circle cx="302" cy="617" r="8" fill="#d06d66"/><text x="195" y="655" text-anc