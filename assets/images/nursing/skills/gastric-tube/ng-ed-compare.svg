<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="t d"><title id="t">NGチューブとEDチューブの比較</title><desc id="d">NGは鼻から胃という経路と位置、EDは経腸栄養を主目的とする製品群であることを比較する</desc><rect width="880" height="420" rx="24" fill="#f8fbfa"/><text x="440" y="39" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#355e55">名前が表している軸が違う</text><g font-family="sans-serif"><rect x="35" y="70" width="380" height="285" rx="22" fill="#eaf4ff" stroke="#78a5c5" stroke-width="3"/><text x="225" y="110" text-anchor="middle" font-size="27" font-weight="700" fill="#376b92">NGチューブ</text><text x="225" y="138" text-anchor="middle" font-size="15" fill="#4d6c80">nasogastric tube</text><path d="M90 178c35-30 67-27 95 0v89c0 30 54 33 63 5" fill="none" stroke="#5c8dab" stroke-width="8" stroke-linecap="round"/><path d="M248 272c42-32 91-8 91 29-32 22-68 25-91 0z" fill="#fff" stroke="#5c8dab" stroke-width="4"/><circle cx="249" cy="272" r="8" fill="#d06d66"/><text x="70" y="319" font-size="17" font-weight="700" fill="#376b92">分類軸：経路・先端位置</text><text x="70" y="343" font-size="15" fill="#506d7f">鼻 → 食道 → 胃</text><rect x="465" y="70" width="380" height="285" rx="22" fill="#eef8f4" stroke="#7eb09e" stroke-width="3"/><text x="655" y="110" text-anchor="middle" font-size="27" font-weight="700" fill="#34705d">EDチューブ</text><text x="655" y="138" text-anchor="middle" font-size="15" fill="#536f65">elemental diet / 経腸栄養用</text><path d="M520 178c35-30 67-27 95 0v89c0 30 54 33 63 5" fill="none" stroke="#57947e" stroke-width="8" stroke-linecap="round"/><path d="M678 272c42-32 91-8 91 29-32 22-68 25-91 0z" fill="#fff" stroke="#57947e" stroke-width="4"/><path d="M742 307c31 0 42 25 60 25" fill="none" stroke="#57947e" stroke-width="8" stroke-linecap="round"/><circle cx="802" cy="332" r="8" fill="#d06d66"/><text x="500" y="319" font-size="17" font-weight="700" fill="#34705d">分類軸：主な用途・製品</text><text x="500" y="343" font-size="15" fill="#536f65">胃内または十二指腸・空腸</text></g><rect x="190" y="372" width="500" height="31" rx="14" fill="#fff" stroke="#98b5aa"/><text x="440" y="394" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#45665b">胃内の細径栄養チューブは、NGでもEDでもあり得る</text></svg>
