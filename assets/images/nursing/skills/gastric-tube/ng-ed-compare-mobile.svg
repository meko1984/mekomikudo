<svg xmlns="http://www.w3.org/2000/svg" width="390" height="810" viewBox="0 0 390 810" role="img" aria-labelledby="t d"><title id="t">NGチューブとEDチューブの比較</title><desc id="d">NGは鼻から胃という経路と位置、EDは経腸栄養を主目的とする製品群であることを比較する</desc><rect width="390" height="810" rx="22" fill="#f8fbfa"/><text x="195" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#355e55">名前が表す軸が違う</text><g font-family="sans-serif"><rect x="25" y="60" width="340" height="315" rx="20" fill="#eaf4ff" stroke="#78a5c5" stroke-width="3"/><text x="195" y="100" text-anchor="middle" font-size="25" font-weight="700" fill="#376b92">NGチューブ</text><text x="195" y="127" text-anchor="middle" font-size="14" fill="#4d6c80">nasogastric tube</text><path d="M90 165c30-26 58-24 83 0v76c0 28 45 31 54 6" fill="none" stroke="#5c8dab" stroke-width="8" stroke-linecap="round"/><path d="M227 247c38-29 81-7 81 26-28 20-60 22-81 0z" fill="#fff" stroke="#5c8dab" stroke-width="4"/><circle cx="228" cy="247" r="8" fill="#d06d66"/><text x="55" y="326" font-size="17" font-weight="700" fill="#376b92">経路・先端位置の名前</text><text x="55" y="351" font-size="15" fill="#506d7f">鼻 → 食道 → 胃</text><rect x="25" y="400" width="340" height="315" rx="20" fill="#eef8f4" stroke="#7eb09e" stroke-width="3"/><text x="195" y="440" text-anchor="middle" font-size="25" font-weight="700" fill="#34705d">EDチューブ</text><text x="195" y="467" text-anchor="middle" font-size="14" fill="#536f65">elemental diet / 経腸栄養用</text><path d="M80 505c30-26 58-24 83 0v76c0 28 45 31 54 6" fill="none" stroke="#57947e" stroke-width="8" stroke-linecap="round"/><path d="M217 587c38-29 81-7 81 26-28 20-60 22-81 0z" fill="#fff" stroke="#57947e" stroke-width="4"/><path d="M272 618c24 0 33 20 47 20" fill="none" stroke="#57947e" stroke-width="8" stroke-linecap="round"/><circle cx="319" cy="638" r="8" fill="#d06d66"/><text x="55" y="666" font-size="17" font-weight="700" fill="#34705d">用途・製品の名前</text><text x="55" y="691" font-size="15" fill="#536f65">先端：胃／十二指腸／空腸</text></g><rect x="22" y="740" width="346" height="48" rx="15" fill="#fff" stroke="#98b5aa"/><text x="195" y="770" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#45665b">胃内の栄養管は両方に当てはまることも</text></svg>
