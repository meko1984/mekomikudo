<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="t"><title id="t">胃管の合併症</title><rect width="320" height="200" rx="20" fill="#fff0ee"/><g font-family="sans-serif" text-anchor="middle"><rect x="22" y="29" width="128" height="58" rx="13" fill="#fff" stroke="#bd635d" stroke-width="3"/><text x="86" y="54" font-size="16" font-weight="700" fill="#8d4540">呼吸器</text><text x="86" y="75" font-size="12" fill="#75514e">誤挿入・誤嚥</text><rect x="170" y="29" width="128" height="58" rx="13" fill="#fff" stroke="#bd635d" stroke-width="3"/><text x="234" y="54" font-size="16" font-weight="700" fill="#8d4540">消化管</text><text x="234" y="75" font-size="12" fill="#75514e">出血・穿孔・逆流</text><rect x="22" y="103" width="128" height="58" rx="13" fill="#fff" stroke="#bd635d" stroke-width="3"/><text x="86" y="128" font-size="16" font-weight="700" fill="#8d4540">鼻・口腔</text><text x="86" y="149" font-size="12" fill="#75514e">潰瘍・乾燥・痛み</text><rect x="170" y="103" width="128" height="58" rx="13" fill="#fff" stroke="#bd635d" stroke-width="3"/><text x="234" y="128" font-size="16" font-weight="700" fill="#8d4540">チューブ</text><text x="234" y="149" font-size="12" fill="#75514e">抜去・閉塞・破損</text></g><text x="160" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#8d4540">症状があれば使用を止めて再評価</text></svg>
