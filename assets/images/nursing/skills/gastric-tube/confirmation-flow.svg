<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">胃管先端位置確認の流れ</title><desc id="d">初回挿入後の画像確認と毎回使用前の外部長、固定、口腔、症状の確認を示す</desc><rect width="880" height="390" rx="24" fill="#f7faf9"/><text x="440" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#355e55">「挿入できた」と「使用してよい」は別</text><g font-family="sans-serif" text-anchor="middle"><rect x="40" y="85" width="210" height="175" rx="20" fill="#eaf4ff" stroke="#79a6c5" stroke-width="3"/><text x="145" y="122" font-size="20" font-weight="700" fill="#376b92">初回・再挿入後</text><rect x="83" y="143" width="124" height="72" rx="10" fill="#fff" stroke="#5d8eae" stroke-width="4"/><path d="M103 193l28-30 25 19 18-26 15 37" fill="none" stroke="#7ea8bf" stroke-width="4"/><text x="145" y="241" font-size="15" fill="#4f6c80">X線などで確認</text><path d="M255 173h54" stroke="#6d9284" stroke-width="5"/><path d="m297 161 13 12-13 12" fill="none" stroke="#6d9284" stroke-width="5"/><rect x="315" y="85" width="250" height="175" rx="20" fill="#eef8f4" stroke="#7eaf9e" stroke-width="3"/><text x="440" y="122" font-size="20" font-weight="700" fill="#34705d">使用開始可</text><path d="m385 177 34 34 78-92" fill="none" stroke="#57947e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="241" font-size="15" fill="#536f65">結果・確認者・鼻元を記録</text><path d="M570 173h54" stroke="#6d9284" stroke-width="5"/><path d="m612 161 13 12-13 12" fill="none" stroke="#6d9284" stroke-width="5"/><rect x="630" y="85" width="210" height="175" rx="20" fill="#fff2ec" stroke="#d49a79" stroke-width="3"/><text x="735" y="122" font-size="20" font-weight="700" fill="#96563a">毎回の使用前</text><text x="735" y="157" font-size="15" fill="#765b4d">鼻元・固定・口腔</text><text x="735" y="184" font-size="15" fill="#765b4d">咳・呼吸・嘔吐</text><text x="735" y="221" font-size="15" font-weight="700" fill="#96563a">疑わしければ止める</text></g><rect x="165" y="298" width="550" height="62" rx="18" fill="#fff" stroke="#d2766e" stroke-width="3"/><text x="440" y="325" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#954a44">気泡音だけで「胃内」と判定しない</text><text x="440" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#745451">肺への誤挿入でも心窩部で音を聴くことがある</text></svg>
