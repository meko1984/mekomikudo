<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="t d">
  <title id="t">胃内留置と幽門後留置</title>
  <desc id="d">胃内に先端を置くNGと胃を越えて十二指腸または空腸に置く幽門後チューブを示す</desc>
  <rect width="880" height="440" rx="24" fill="#f7faf9"/>
  <text x="440" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#355e55">先端がどこにあるかを確認する</text>
  <g font-family="sans-serif">
    <path d="M440 70v250" stroke="#b8c6c1" stroke-width="3" stroke-dasharray="8 8"/>
    <g transform="translate(55 70)">
      <text x="165" y="28" text-anchor="middle" font-size="22" font-weight="700" fill="#376b92">胃内留置</text>
      <circle cx="85" cy="77" r="28" fill="#fff" stroke="#668da5" stroke-width="4"/>
      <path d="M50 158c4-51 66-51 70 0" fill="#e6f1f7" stroke="#668da5" stroke-width="4"/>
      <path d="M85 49c60 7 85 49 108 116" fill="none" stroke="#5b8eae" stroke-width="7" stroke-linecap="round"/>
      <path d="M194 164c51-37 111-9 111 38-38 26-81 29-111 0z" fill="#fff" stroke="#5b8eae" stroke-width="4"/>
      <circle cx="194" cy="164" r="8" fill="#d06d66"/>
      <text x="180" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#376b92">鼻 → 食道 → 胃</text>
      <text x="180" y="300" text-anchor="middle" font-size="15" fill="#526f81">栄養・投薬／対応製品で減圧</text>
    </g>
    <g transform="translate(490 70)">
      <text x="165" y="28" text-anchor="middle" font-size="22" font-weight="700" fill="#34705d">幽門後留置</text>
      <circle cx="85" cy="77" r="28" fill="#fff" stroke="#668d80" stroke-width="4"/>
      <path d="M50 158c4-51 66-51 70 0" fill="#e7f3ee" stroke="#668d80" stroke-width="4"/>
      <path d="M85 49c60 7 85 49 108 116" fill="none" stroke="#57947e" stroke-width="7" stroke-linecap="round"/>
      <path d="M194 164c51-37 111-9 111 38-38 26-81 29-111 0z" fill="#fff" stroke="#57947e" stroke-width="4"/>
      <path d="M272 207c35 0 41 29 73 29" fill="none" stroke="#57947e" stroke-width="7" stroke-linecap="round"/>
      <circle cx="345" cy="236" r="8" fill="#d06d66"/>
      <text x="180" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#34705d">胃を越えて十二指腸・空腸</text>
      <text x="180" y="300" text-anchor="middle" font-size="15" fill="#536f65">経腸栄養／透視・画像で確認</text>
    </g>
  </g>
  <rect x="197" y="390" width="486" height="35" rx="15" fill="#fff" stroke="#9db7ad"/>
  <text x="440" y="414" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#45665b">鼻元の目盛りだけでは、体内の走行と先端位置は分からない</text>
</svg>
