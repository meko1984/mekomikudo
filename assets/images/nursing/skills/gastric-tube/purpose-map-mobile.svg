<svg xmlns="http://www.w3.org/2000/svg" width="390" height="650" viewBox="0 0 390 650" role="img" aria-labelledby="t d"><title id="t">胃管の4つの目的</title><desc id="d">栄養投与、減圧排液、観察検査、洗浄処置を目的別に示す</desc><rect width="390" height="650" rx="22" fill="#f6faf9"/><text x="195" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#365f55">目的でチューブを選ぶ</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(25 65)"><rect width="160" height="235" rx="19" fill="#eaf4ff" stroke="#78a5c5" stroke-width="3"/><path d="M55 40h50v67H55z" fill="#fff" stroke="#5c8dab" stroke-width="4"/><path d="M65 57h30M65 76h30" stroke="#76a5c1" stroke-width="5"/><path d="M80 107v24" stroke="#5c8dab" stroke-width="4"/><text x="80" y="164" font-size="19" font-weight="700" fill="#386b91">栄養・水</text><text x="80" y="191" font-size="16" fill="#4f6c80">薬剤</text></g><g transform="translate(205 65)"><rect width="160" height="235" rx="19" fill="#fff1eb" stroke="#d69a78" stroke-width="3"/><path d="M48 45h64v78H48z" fill="#fff" stroke="#b97455" stroke-width="4"/><path d="M57 98h46" stroke="#e5ad7f" stroke-width="25"/><text x="80" y="164" font-size="19" font-weight="700" fill="#96563a">減圧</text><text x="80" y="191" font-size="16" fill="#765b4d">排液</text></g><g transform="translate(25 320)"><rect width="160" height="235" rx="19" fill="#eef8f4" stroke="#7eb09e" stroke-width="3"/><circle cx="67" cy="81" r="34" fill="#fff" stroke="#57947e" stroke-width="4"/><path d="m91 105 27 27" stroke="#57947e" stroke-width="7" stroke-linecap="round"/><text x="80" y="164" font-size="19" font-weight="700" fill="#34705d">観察</text><text x="80" y="191" font-size="16" fill="#536f65">検査</text></g><g transform="translate(205 320)"><rect width="160" height="235" rx="19" fill="#f4f1ff" stroke="#a296c8" stroke-width="3"/><path d="M42 53h76v70H42z" fill="#fff" stroke="#7468a2" stroke-width="4"/><path d="M56 72h48M56 92h48M56 112h31" stroke="#9489bd" stroke-width="5"/><text x="80" y="164" font-size="19" font-weight="700" fill="#62568d">洗浄</text><text x="80" y="191" font-size="16" fill="#6c6380">処置</text></g></g><rect x="26" y="580" width="338" height="45" rx="15" fill="#fff" stroke="#a8bcb5"/><text x="195" y="608" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526b62">同じ管で全部できるとは限らない</text></svg>
