<svg xmlns="http://www.w3.org/2000/svg" width="390" height="720" viewBox="0 0 390 720" role="img" aria-labelledby="t d"><title id="t">胃管先端位置確認の流れ</title><desc id="d">初回挿入後の画像確認と毎回使用前の外部長、固定、口腔、症状の確認を示す</desc><rect width="390" height="720" rx="22" fill="#f7faf9"/><text x="195" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#355e55">挿入できた ≠ 使用してよい</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="65" width="300" height="145" rx="19" fill="#eaf4ff" stroke="#79a6c5" stroke-width="3"/><text x="195" y="101" font-size="20" font-weight="700" fill="#376b92">初回・再挿入後</text><rect x="145" y="117" width="100" height="55" rx="9" fill="#fff" stroke="#5d8eae" stroke-width="4"/><path d="M162 157l21-24 20 16 15-21 13 29" fill="none" stroke="#7ea8bf" stroke-width="4"/><text x="195" y="194" font-size="14" fill="#4f6c80">X線などで確認</text><path d="M195 215v38" stroke="#6d9284" stroke-width="5"/><path d="m183 241 12 13 12-13" fill="none" stroke="#6d9284" stroke-width="5"/><rect x="45" y="260" width="300" height="135" rx="19" fill="#eef8f4" stroke="#7eaf9e" stroke-width="3"/><text x="195" y="297" font-size="20" font-weight="700" fill="#34705d">使用開始可</text><path d="m154 339 24 24 56-67" fill="none" stroke="#57947e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="379" font-size="14" fill="#536f65">結果・確認者・鼻元を記録</text><path d="M195 400v38" stroke="#6d9284" stroke-width="5"/><path d="m183 426 12 13 12-13" fill="none" stroke="#6d9284" stroke-width="5"/><rect x="45" y="445" width="300" height="145" rx="19" fill="#fff2ec" stroke="#d49a79" stroke-width="3"/><text x="195" y="482" font-size="20" font-weight="700" fill="#96563a">毎回の使用前</text><text x="195" y="518" font-size="15" fill="#765b4d">鼻元・固定・口腔・症状</text><text x="195" y="550" font-size="15" font-weight="700" fill="#96563a">疑わしければ使用を止める</text></g><rect x="25" y="620" width="340" height="72" rx="18" fill="#fff" stroke="#d2766e" stroke-width="3"/><text x="195" y="650" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#954a44">気泡音だけで判定しない</text><text x="195" y="676" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#745451">肺への誤挿入でも音は聴こえる</text></svg>
