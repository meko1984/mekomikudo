<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t"><title id="t">胸水検体の取り扱い</title><style>.h{font:700 15px sans-serif;fill:#173b44}.s{font:13px sans-serif;fill:#31545c}</style><rect width="320" height="200" rx="20" fill="#eef8f9"/><text class="h" x="160" y="26" text-anchor="middle">採る前に検査項目と容器を確認</text><g transform="translate(20 48)"><circle cx="32" cy="32" r="26" fill="#d7efea"/><path d="M22 31l7 7 15-17" fill="none" stroke="#2b7f8c" stroke-width="4"/><text class="h" x="32" y="74" text-anchor="middle">患者</text><text class="s" x="32" y="98" text-anchor="middle">照合</text></g><path d="M82 80h30" stroke="#75acb4" stroke-width="3"/><g transform="translate(112 48)"><rect x="16" y="7" width="32" height="49" rx="6" fill="#fff" stroke="#2b7f8c" stroke-width="3"/><path d="M19 39h26v14H19z" fill="#e6c76e"/><text class="h" x="32" y="74" text-anchor="middle">無菌</text><text class="s" x="32" y="98" text-anchor="middle">採取</text></g><path d="M176 80h30" stroke="#75acb4" stroke-width="3"/><g transform="translate(206 48)"><rect x="13" y="6" width="38" height="52" rx="7" fill="#fff" stroke="#2b7f8c" stroke-width="3"/><rect x="18" y="17" width="28" height="17" fill="#d7efea"/><text class="h" x="32" y="74" text-anchor="middle">容器</text><text class="s" x="32" y="98" text-anchor="middle">ラベル</text></g><rect x="42" y="160" width="236" height="26" rx="13" fill="#fff"/><text class="s" x="160" y="178" text-anchor="middle">時刻を記録し、検査手順どおり提出</text></svg>
