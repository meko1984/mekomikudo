<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t"><title id="t">挿入から抜去までの安全確認</title><style>.t{font:700 20px sans-serif;fill:#173b44}.h{font:700 15px sans-serif;fill:#173b44}.s{font:13px sans-serif;fill:#31545c}.n{fill:#2b7f8c}.a{stroke:#75acb4;stroke-width:4;fill:none}</style><rect width="880" height="320" rx="24" fill="#eef8f9"/><text class="t" x="440" y="38" text-anchor="middle">処置の節目ごとに患者と装置を再確認</text><path class="a" d="M100 118H780"/><g font-family="sans-serif" text-anchor="middle"><g transform="translate(100 118)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">1</text><text class="h" x="0" y="58">処置前</text><text class="s" x="0" y="80">患者・左右・画像</text><text class="s" x="0" y="106">同意・出血リスク</text></g><g transform="translate(270 118)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">2</text><text class="h" x="0" y="58">挿入介助</text><text class="s" x="0" y="80">無菌・呼吸・疼痛</text><text class="s" x="0" y="106">接続・固定</text></g><g transform="translate(440 118)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">3</text><text class="h" x="0" y="58">挿入直後</text><text class="s" x="0" y="80">呼吸・出血・作動</text><text class="s" x="0" y="106">画像で位置確認</text></g><g transform="translate(610 118)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">4</text><text class="h" x="0" y="58">継続管理</text><text class="s" x="0" y="80">患者から装置まで</text><text class="s" x="0" y="106">排液の傾向</text></g><g transform="translate(780 118)"><circle class="n" r="28"/><text x="0" y="6" fill="#fff" font-size="17" font-weight="700">5</text><text class="h" x="0" y="58">抜去</text><text class="s" x="0" y="80">呼吸の合図・密閉</text><text class="s" x="0" y="106">再評価・画像</text></g></g><rect x="180" y="264" width="520" height="32" rx="16" fill="#d7efea"/><text class="h" x="440" y="285" text-anchor="middle">異常時は手順を止め、患者評価と応援要請を優先</text></svg>
