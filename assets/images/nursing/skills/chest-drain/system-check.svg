<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t"><title id="t">管理開始前の確認</title><style>.h{font:700 15px sans-serif;fill:#173b44}.s{font:13px sans-serif;fill:#31545c}</style><rect width="320" height="200" rx="20" fill="#eef8f9"/><text class="h" x="160" y="27" text-anchor="middle">患者と装置を一致させる</text><path d="M48 61h224M48 105h224M48 149h224" stroke="#bad9dd" stroke-width="2"/><g fill="#2b7f8c"><circle cx="56" cy="61" r="16"/><circle cx="56" cy="105" r="16"/><circle cx="56" cy="149" r="16"/></g><g fill="#fff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle"><text x="56" y="66">1</text><text x="56" y="110">2</text><text x="56" y="154">3</text></g><text class="h" x="84" y="52">患者・左右・目的</text><text class="s" x="84" y="75">画像と指示を照合</text><text class="h" x="84" y="105">水封・吸引・排液制限</text><text class="s" x="84" y="128">設定と中止条件を確認</text><text class="h" x="84" y="158">固定・接続・位置</text><text class="s" x="84" y="181">立てて胸より低く保つ</text></svg>
