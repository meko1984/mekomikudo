<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t"><title id="t">呼吸性移動とエアリーク</title><style>.h{font:700 15px sans-serif;fill:#173b44}.s{font:13px sans-serif;fill:#31545c}</style><rect width="320" height="200" rx="20" fill="#eef8f9"/><text class="h" x="160" y="26" text-anchor="middle">水面の動きと気泡は別にみる</text><rect x="18" y="44" width="136" height="136" rx="16" fill="#fff" stroke="#75acb4"/><text class="h" x="86" y="66" text-anchor="middle">呼吸性移動</text><path d="M48 88v50h76V88" fill="none" stroke="#7099a0" stroke-width="3"/><path d="M50 118q18-14 36 0t36 0v18H50z" fill="#8bd1df"/><path d="M58 92v17M114 92v17" stroke="#2b7f8c" stroke-width="3"/><path d="M54 98l4-7 4 7M110 103l4 7 4-7" fill="none" stroke="#2b7f8c" stroke-width="2"/><text class="s" x="86" y="157" text-anchor="middle">呼吸に合わせて</text><text class="s" x="86" y="180" text-anchor="middle">水位が動く</text><rect x="166" y="44" width="136" height="136" rx="16" fill="#fff" stroke="#75acb4"/><text class="h" x="234" y="66" text-anchor="middle">気泡</text><path d="M196 88v50h76V88" fill="none" stroke="#7099a0" stroke-width="3"/><path d="M198 118h72v18h-72z" fill="#8bd1df"/><circle cx="226" cy="112" r="5" fill="#fff" stroke="#2b7f8c"/><circle cx="238" cy="98" r="7" fill="#fff" stroke="#2b7f8c"/><circle cx="252" cy="84" r="5" fill="#fff" stroke="#2b7f8c"/><text class="s" x="234" y="157" text-anchor="middle">新規・持続・増加は</text><text class="s" x="234" y="180" text-anchor="middle">患者と全接続を確認</text></svg>
