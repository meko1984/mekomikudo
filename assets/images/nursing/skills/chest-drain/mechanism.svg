<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t d"><title id="t">胸腔ドレナージのしくみ</title><desc id="d">胸腔から空気や液体が排液槽、水封室、必要時の吸引へ流れる</desc><style>.t{font:700 20px sans-serif;fill:#173b44}.h{font:700 16px sans-serif;fill:#173b44}.s{font:14px sans-serif;fill:#31545c}.box{fill:#fff;stroke:#76aeb6;stroke-width:2}.a{stroke:#2b7f8c;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#2b7f8c"/></marker></defs><rect width="880" height="320" rx="24" fill="#eef8f9"/><text class="t" x="440" y="38" text-anchor="middle">胸腔から外へ出し、逆流を防ぐ</text><rect class="box" x="38" y="76" width="170" height="172" rx="22"/><path d="M78 108c44-20 86 17 86 62 0 35-23 57-58 61-25-16-39-41-35-72 2-20 7-36 7-51z" fill="#f4b8ae" stroke="#a65d56" stroke-width="2"/><path d="M113 105v126" stroke="#fff" stroke-width="5"/><text class="h" x="123" y="276" text-anchor="middle">胸腔</text><text class="s" x="123" y="298" text-anchor="middle">空気・血液・胸水</text><path class="a" d="M208 162H276"/><rect class="box" x="276" y="76" width="170" height="172" rx="22"/><path d="M316 112v104h92V112" fill="none" stroke="#7099a0" stroke-width="4"/><path d="M318 178h88v36h-88z" fill="#e99189" opacity=".8"/><path d="M347 112v68" stroke="#2b7f8c" stroke-width="7"/><text class="h" x="361" y="276" text-anchor="middle">排液槽</text><text class="s" x="361" y="298" text-anchor="middle">量・色・性状を観察</text><path class="a" d="M446 162H514"/><rect class="box" x="514" y="76" width="170" height="172" rx="22"/><path d="M548 112v104h102V112" fill="none" stroke="#7099a0" stroke-width="4"/><path d="M550 175h98v39h-98z" fill="#8bd1df" opacity=".75"/><path d="M578 112v83h21" fill="none" stroke="#2b7f8c" stroke-width="7"/><circle cx="600" cy="171" r="5" fill="#fff"/><circle cx="613" cy="151" r="7" fill="#fff"/><text class="h" x="599" y="276" text-anchor="middle">水封室</text><text class="s" x="599" y="298" text-anchor="middle">空気の逆流を防ぐ</text><path class="a" d="M684 162H738"/><rect x="738" y="96" width="108" height="132" rx="20" fill="#dff1ed" stroke="#63a393" stroke-width="2"/><circle cx="792" cy="145" r="25" fill="#fff" stroke="#63a393" stroke-width="3"/><path d="M792 145l15-12" stroke="#d46d59" stroke-width="4" stroke-linecap="round"/><text class="h" x="792" y="196" text-anchor="middle">吸引</text><text class="s" x="792" y="222" text-anchor="middle">必要時のみ</text><text class="s" x="792" y="270" text-anchor="middle">設定は指示と</text><text class="s" x="792" y="296" text-anchor="middle">製品で確認</text></svg>
