<svg xmlns="http://www.w3.org/2000/svg" width="390" height="650" viewBox="0 0 390 650" role="img" aria-labelledby="t d"><title id="t">輸血観察の時間軸</title><desc id="d">輸血前、開始5分、15分、その後、終了後の観察点</desc><rect width="390" height="650" rx="22" fill="#f8fbfa"/><text x="195" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#385d55">変化をつかむ観察の時間軸</text><path d="M75 90v480" stroke="#6aa692" stroke-width="8" stroke-linecap="round"/><g font-family="sans-serif"><g transform="translate(75 105)"><circle r="18" fill="#fff" stroke="#4d9179" stroke-width="5"/><rect x="42" y="-36" width="250" height="75" rx="14" fill="#eaf6f2"/><text x="62" y="-6" font-size="18" font-weight="700" fill="#356b59">輸血前</text><text x="62" y="22" font-size="15" fill="#49665c">基準値・開始前の症状</text></g><g transform="translate(75 215)"><circle r="21" fill="#ef8c85" stroke="#bd5f59" stroke-width="5"/><rect x="42" y="-36" width="250" height="75" rx="14" fill="#fff0ee"/><text x="62" y="-6" font-size="18" font-weight="700" fill="#8b413c">開始～5分</text><text x="62" y="22" font-size="15" fill="#72514e">患者のそばで急性反応を観察</text></g><g transform="translate(75 325)"><circle r="18" fill="#fff" stroke="#4d9179" stroke-width="5"/><rect x="42" y="-36" width="250" height="75" rx="14" fill="#eaf6f2"/><text x="62" y="-6" font-size="18" font-weight="700" fill="#356b59">15分頃</text><text x="62" y="22" font-size="15" fill="#49665c">バイタルと全身を再評価</text></g><g transform="translate(75 435)"><circle r="18" fill="#fff" stroke="#4d9179" stroke-width="5"/><rect x="42" y="-36" width="250" height="75" rx="14" fill="#eaf6f2"/><text x="62" y="-6" font-size="18" font-weight="700" fill="#356b59">その後</text><text x="62" y="22" font-size="15" fill="#49665c">院内間隔で継続観察</text></g><g transform="translate(75 545)"><circle r="18" fill="#fff" stroke="#4d9179" stroke-width="5"/><rect x="42" y="-36" width="250" height="75" rx="14" fill="#edf2fb"/><text x="62" y="-6" font-size="18" font-weight="700" fill="#456182">終了後</text><text x="62" y="22" font-size="15" fill="#536579">遅れて出る変化も確認</text></g></g><text x="195" y="620" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526760">「前から何が変わったか」を見る</text></svg>
