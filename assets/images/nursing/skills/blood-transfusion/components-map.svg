<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="t d"><title id="t">輸血用血液製剤の役割</title><desc id="d">赤血球、血小板、新鮮凍結血漿が補う働きを比較する</desc><rect width="880" height="320" rx="24" fill="#f7fbfc"/><text x="440" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#34505b">不足している成分を補う</text><g font-family="sans-serif"><g transform="translate(40 62)"><rect width="250" height="220" rx="20" fill="#fff3f2" stroke="#e8aaa5" stroke-width="2"/><path d="M72 50c36-30 82 2 60 39-21 35-75 24-79-13-1-10 6-19 19-26z" fill="#d96a63"/><ellipse cx="94" cy="72" rx="22" ry="12" fill="#f5b8b3"/><text x="125" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#8a3e3a">赤血球製剤</text><text x="125" y="158" text-anchor="middle" font-size="16" fill="#614d4b">酸素を運ぶ力</text><path d="M72 184h106" stroke="#d96a63" stroke-width="5" stroke-linecap="round"/><path d="m165 174 15 10-15 10" fill="none" stroke="#d96a63" stroke-width="5"/></g><g transform="translate(315 62)"><rect width="250" height="220" rx="20" fill="#fff9e9" stroke="#e7c66d" stroke-width="2"/><path d="M68 60h114" stroke="#dda52d" stroke-width="10" stroke-linecap="round"/><g fill="#f1c24b"><circle cx="88" cy="51" r="15"/><circle cx="117" cy="68" r="13"/><circle cx="146" cy="49" r="14"/><circle cx="166" cy="70" r="12"/></g><text x="125" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#806320">血小板製剤</text><text x="125" y="158" text-anchor="middle" font-size="16" fill="#615844">一次止血を支える</text><path d="M72 184h106" stroke="#dda52d" stroke-width="5" stroke-linecap="round"/><path d="m165 174 15 10-15 10" fill="none" stroke="#dda52d" stroke-width="5"/></g><g transform="translate(590 62)"><rect width="250" height="220" rx="20" fill="#edf6ff" stroke="#8eb9dc" stroke-width="2"/><path d="M75 43h100v45c0 30-22 51-50 51S75 118 75 88z" fill="#f2c569" stroke="#5b91b8" stroke-width="3"/><path d="M91 72h68M91 88h68" stroke="#f