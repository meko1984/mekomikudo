<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="t d"><title id="t">輸血観察の時間軸</title><desc id="d">輸血前、開始5分、15分、その後、終了後の観察点</desc><rect width="880" height="310" rx="24" fill="#f8fbfa"/><text x="440" y="37" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#385d55">変化をつかむ観察の時間軸</text><path d="M88 150h704" stroke="#6aa692" stroke-width="8" stroke-linecap="round"/><g font-family="sans-serif" text-anchor="middle"><g transform="translate(90 150)"><circle r="19" fill="#fff" stroke="#4d9179" stroke-width="5"/><rect x="-66" y="35" width="132" height="75" rx="14" fill="#eaf6f2"/><text y="63" font-size="18" font-weight="700" fill="#356b59">輸血前</text><text y="88" font-size="14" fill="#49665c">基準値・症状</text></g><g transform="translate(265 150)"><circle r="22" fill="#ef8c85" stroke="#bd5f59" stroke-width="5"/><rect x="-66" y="-105" width="132" height="75" rx="14" fill="#fff0ee"/><text y="-77" font-size="18" font-weight="700" fill="#8b413c">開始～5分</text><text y="-52" font-size="14" fill="#72514e">そばで観察</text></g><g transform="translate(440 150)"><circle r="19" fill="#fff" stroke="#4d9179" stroke-width="5"/><rect x="-66" y="35" width="132" height="75" rx="14" fill="#eaf6f2"/><text y="63" font-size="18" font-weight="700" fill="#356b59">15分頃</text><text y="88" font-size="14" fill="#49665c">再評価</text></g><g transform="translate(615 150)"><circle r="19" fill="#fff" stroke="#4d9179" stroke-width="5"/><rect x="-66" y="-105" width="132" height="75" rx="14" fill="#eaf6f2"/><text y="-77" font-size="18" font-weight="700" fill="#356b59">その後</text><text y="-52" font-size="14" fill="#49665c">継続観察</text></g><g transform="translate(790 150)"><circle r="19" fill="#fff" stroke="#4d9179" stroke-width="5"/><rect x="-66" y="35" width="132" height="75" rx="14" fill="#edf2fb"/><text y="63" font-size="18" font-weight="700" fill="#456182">終了後</text><text y="88" font-size="14" fill="#536579">遅発反応も</text></g></g><text x="440" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#526760">患者の言葉・意識・皮膚・呼吸・循環・体液量・尿・刺入部をつなげる</text></svg>
