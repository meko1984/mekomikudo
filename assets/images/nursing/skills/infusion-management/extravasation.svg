<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">血管外漏出の初期対応</title><desc id="d">止める、残す、吸引する、計画するの順に示す</desc><rect width="320" height="200" rx="24" fill="#fff5ec"/><g font-size="13" font-weight="700" text-anchor="middle"><circle cx="48" cy="74" r="31" fill="#f4d1ce"/><text x="48" y="65" fill="#824944">STOP</text><text x="48" y="91" fill="#824944">止める</text><circle cx="123" cy="74" r="31" fill="#f7dfbd"/><text x="123" y="65" fill="#80591f">LEAVE</text><text x="123" y="91" fill="#80591f">残す</text><circle cx="198" cy="74" r="31" fill="#d9eef2"/><text x="198" y="65" fill="#285b66">ASPIRATE</text><text x="198" y="91" fill="#285b66">吸引</text><circle cx="273" cy="74" r="31" fill="#e8e0f1"/><text x="273" y="65" fill="#59476f">PLAN</text><text x="273" y="91" fill="#59476f">計画</text></g><rect x="40" y="128" width="240" height="39" rx="17" fill="#fff" stroke="#b56f6a" stroke-width="3"/><text x="160" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#824944">フラッシュせず、薬剤別手順へ</text></svg>
