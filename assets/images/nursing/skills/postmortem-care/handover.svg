<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">所持品と退室の確認</title><desc id="d">本人確認、所持品、書類、搬送先、記録をダブルチェックする</desc><rect width="320" height="200" rx="22" fill="#f5f4f1"/><text x="18" y="28" fill="#5d5951" font-family="sans-serif" font-size="15" font-weight="700">二人で照合し、引き継ぐ</text><path d="M48 100H273" stroke="#c9c3b8" stroke-width="7" stroke-linecap="round"/><g fill="#fff" stroke="#898176" stroke-width="3"><circle cx="48" cy="100" r="25"/><circle cx="104" cy="100" r="25"/><circle cx="160" cy="100" r="25"/><circle cx="216" cy="100" r="25"/><circle cx="272" cy="100" r="25"/></g><g font-family="sans-serif" text-anchor="middle" fill="#5d5951" font-size="10" font-weight="700"><text x="48" y="97">本人</text><text x="48" y="115">確認</text><text x="104" y="97">所持品</text><text x="104" y="115">署名</text><text x="160" y="97">書類</text><text x="160" y="115">識別</text><text x="216" y="97">搬送先</text><text x="216" y="115">時刻</text><text x="272" y="97">記録</text><text x="272" y="115">引継ぎ</text></g><text x="160" y="165" text-anchor="middle" fill="#8a665c" font-family="sans-serif" font-size="13" font-weight="700">取り違えと渡し忘れを防ぐ</text></svg>
