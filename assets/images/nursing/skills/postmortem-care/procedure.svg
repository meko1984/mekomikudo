<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t d"><title id="t">エンゼルケアの流れ</title><desc id="d">確認、希望、清潔整容、家族の時間、記録引継ぎを示す</desc><rect width="880" height="320" rx="28" fill="#f5f3f0"/><text x="40" y="50" fill="#57534d" font-family="sans-serif" font-size="24" font-weight="700">確認から引き継ぎまで、尊厳を途切れさせない</text><path d="M105 158H775" stroke="#c8c1b7" stroke-width="10" stroke-linecap="round"/><g fill="#fff" stroke="#847c71" stroke-width="4"><circle cx="105" cy="158" r="55"/><circle cx="273" cy="158" r="55"/><circle cx="440" cy="158" r="55"/><circle cx="607" cy="158" r="55"/><circle cx="775" cy="158" r="55"/></g><g font-family="sans-serif" text-anchor="middle" fill="#5d5750" font-size="16" font-weight="700"><text x="105" y="153">条件</text><text x="105" y="181">確認</text><text x="273" y="153">家族の</text><text x="273" y="181">希望</text><text x="440" y="153">清潔</text><text x="440" y="181">整容</text><text x="607" y="153">別れの</text><text x="607" y="181">時間</text><text x="775" y="153">記録</text><text x="775" y="181">引継ぎ</text></g><text x="440" y="276" text-anchor="middle" fill="#8a665c" font-family="sans-serif" font-size="18" font-weight="700">節目ごとに本人・家族・安全を確かめる</text></svg>
