<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="t d"><title id="t">坐薬の3つの目的</title><desc id="d">全身作用、直腸局所作用、排便促進を並べて比較する</desc><defs><style>.h{font:700 22px system-ui,sans-serif;fill:#173b47}.s{font:600 17px system-ui,sans-serif;fill:#46616b}.n{font:700 24px system-ui,sans-serif;fill:#fff}</style></defs><rect width="880" height="330" rx="24" fill="#f3f8fa"/><text x="440" y="46" class="h" text-anchor="middle">目的が変われば、観察も変わる</text><g transform="translate(36 76)"><rect width="248" height="210" rx="22" fill="#fff" stroke="#47879a" stroke-width="3"/><circle cx="46" cy="48" r="28" fill="#47879a"/><text x="46" y="56" class="n" text-anchor="middle">全</text><text x="144" y="53" class="h" text-anchor="middle">全身作用</text><text x="124" y="103" class="s" text-anchor="middle">解熱・鎮痛</text><text x="124" y="132" class="s" text-anchor="middle">抗けいれん・鎮痛薬</text><text x="124" y="177" class="s" text-anchor="middle">量・間隔・全身状態</text></g><g transform="translate(316 76)"><rect width="248" height="210" rx="22" fill="#fff" stroke="#6b9b7c" stroke-width="3"/><circle cx="46" cy="48" r="28" fill="#6b9b7c"/><text x="46" y="56" class="n" text-anchor="middle">局</text><text x="144" y="53" class="h" text-anchor="middle">局所作用</text><text x="124" y="103" class="s" text-anchor="middle">直腸炎・肛門部</text><text x="124" y="132" class="s" text-anchor="middle">粘膜へ作用</text><text x="124" y="177" class="s" text-anchor="middle">保持・出血・刺激感</text></g><g transform="translate(596 76)"><rect width="248" height="210" rx="22" fill="#fff" stroke="#d08b57" stroke-width="3"/><circle cx="46" cy="48" r="28" fill="#d08b57"/><text x="46" y="56" class="n" text-anchor="middle">便</text><text x="144" y="53" class="h" text-anchor="middle">排便促進</text><text x="124" y="103" class="s" text-anchor="middle">直腸刺激・便軟化</text><text x="124" y="132" class="s" text-anchor="middle">排便反射を促す</text><text x="124" y="177" class="s" text-anchor="middle">便・腹痛・血圧</text></g></svg>
