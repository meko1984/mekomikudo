<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="t d"><title id="t">坐薬を括約筋の内側へ挿入する</title><desc id="d">観察、呼気に合わせた挿入、括約筋を越えた保持を縦に示す</desc><defs><style>.h{font:700 19px system-ui,sans-serif;fill:#173b47}.s{font:600 15px system-ui,sans-serif;fill:#46616b}.w{font:700 18px system-ui,sans-serif;fill:#fff}.line{stroke:#d08b57;stroke-width:5}</style></defs><rect width="360" height="610" rx="22" fill="#f3f8fa"/><path class="line" d="M65 91v420"/><g transform="translate(0 32)"><circle cx="65" cy="48" r="26" fill="#47879a"/><text x="65" y="55" class="w" text-anchor="middle">1</text><rect x="110" y="5" width="222" height="110" rx="17" fill="#fff" stroke="#47879a" stroke-width="2"/><text x="221" y="38" class="h" text-anchor="middle">肛門周囲を観察</text><text x="221" y="68" class="s" text-anchor="middle">出血・傷・便を確認</text><text x="221" y="94" class="s" text-anchor="middle">無理に始めない</text></g><g transform="translate(0 205)"><circle cx="65" cy="48" r="26" fill="#6b9b7c"/><text x="65" y="55" class="w" text-anchor="middle">2</text><rect x="110" y="5" width="222" height="110" rx="17" fill="#fff" stroke="#6b9b7c" stroke-width="2"/><text x="221" y="38" class="h" text-anchor="middle">呼気でゆっくり</text><text x="221" y="68" class="s" text-anchor="middle">挿入方向は製品指示</text><text x="221" y="94" class="s" text-anchor="middle">抵抗・痛みを確認</text></g><g transform="translate(0 378)"><circle cx="65" cy="48" r="26" fill="#d08b57"/><text x="65" y="55" class="w" text-anchor="middle">3</text><rect x="110" y="5" width="222" height="132" rx="17" fill="#fff" stroke="#d08b57" stroke-width="2"/><text x="221" y="38" class="h" text-anchor="middle">括約筋を越える</text><text x="221" y="68" class="s" text-anchor="middle">直腸内へ置く</text><text x="221" y="94" class="s" text-anchor="middle">臀部を戻し</text><text x="221" y="118" class="s" text-anchor="middle">保持できる体位へ</text></g></svg>
