<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="t d"><title id="t">坐薬を括約筋の内側へ挿入する</title><desc id="d">肛門周囲を観察し、潤滑した坐薬を呼気に合わせて括約筋の内側まで進める</desc><defs><style>.h{font:700 21px system-ui,sans-serif;fill:#173b47}.s{font:600 16px system-ui,sans-serif;fill:#46616b}.w{font:700 18px system-ui,sans-serif;fill:#fff}.a{fill:none;stroke:#d08b57;stroke-width:5;stroke-linecap:round}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#d08b57"/></marker></defs><rect width="880" height="340" rx="24" fill="#f3f8fa"/><g transform="translate(35 46)"><circle cx="86" cy="34" r="28" fill="#47879a"/><text x="86" y="41" class="w" text-anchor="middle">1</text><text x="86" y="91" class="h" text-anchor="middle">観察</text><text x="86" y="124" class="s" text-anchor="middle">出血・傷・便</text><rect x="8" y="151" width="156" height="65" rx="16" fill="#fff" stroke="#47879a" stroke-width="2"/><text x="86" y="190" class="s" text-anchor="middle">無理に始めない</text></g><path class="a" marker-end="url(#m)" d="M214 166h70"/><g transform="translate(300 46)"><circle cx="86" cy="34" r="28" fill="#6b9b7c"/><text x="86" y="41" class="w" text-anchor="middle">2</text><text x="86" y="91" class="h" text-anchor="middle">呼気で挿入</text><text x="86" y="124" class="s" text-anchor="middle">方向は製品指示</text><rect x="-13" y="151" width="198" height="65" rx="16" fill="#fff" stroke="#6b9b7c" stroke-width="2"/><text x="86" y="190" class="s" text-anchor="middle">無理に押し込まない</text></g><path class="a" marker-end="url(#m)" d="M479 166h70"/><g transform="translate(565 46)"><circle cx="122" cy="34" r="28" fill="#d08b57"/><text x="122" y="41" class="w" text-anchor="middle">3</text><text x="122" y="91" class="h" text-anchor="middle">括約筋を越える</text><text x="122" y="124" class="s" text-anchor="middle">抵抗・痛み・出血を確認</text><rect x="13" y="151" width="218" height="65" rx="16" fill="#fff" stroke="#d08b57" stroke-width="2"/><text x="122" y="179" class="s" text-anchor="middle">直腸内へ置き</text><text x="122" y="202" class="s" text-anchor="middle">保持できる体位へ</text></g></svg>
