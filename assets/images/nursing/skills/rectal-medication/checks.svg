<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="t d"><title id="t">直腸内与薬の照合</title><desc id="d">通常の与薬確認に直腸の状態、排便、保持、重複の確認を加える</desc><defs><style>.h{font:700 21px system-ui,sans-serif;fill:#173b47}.s{font:600 16px system-ui,sans-serif;fill:#46616b}.w{font:700 20px system-ui,sans-serif;fill:#fff}</style></defs><rect width="880" height="360" rx="24" fill="#f3f8fa"/><rect x="48" y="52" width="346" height="256" rx="22" fill="#fff" stroke="#47879a" stroke-width="3"/><text x="221" y="91" class="h" text-anchor="middle">基本の与薬照合</text><g class="s"><text x="90" y="135">✓ 患者・薬剤・規格・個数</text><text x="90" y="172">✓ 時刻・経路・目的</text><text x="90" y="209">✓ 前回時刻・1日総量</text><text x="90" y="246">✓ アレルギー・併用薬</text><text x="90" y="283">✓ 期限・包装・保管</text></g><circle cx="440" cy="180" r="37" fill="#d08b57"/><text x="440" y="187" class="w" text-anchor="middle">＋</text><rect x="486" y="52" width="346" height="256" rx="22" fill="#fff" stroke="#6b9b7c" stroke-width="3"/><text x="659" y="91" class="h" text-anchor="middle">直腸投与の追加確認</text><g class="s"><text x="528" y="135">✓ 出血・痛み・手術歴</text><text x="528" y="172">✓ 最終排便・下痢・硬便</text><text x="528" y="209">✓ 保持できる状態か</text><text x="528" y="246">✓ 同一成分・坐薬の重複</text><text x="528" y="283">✓ 分割・挿入方向の指示</text></g></svg>
