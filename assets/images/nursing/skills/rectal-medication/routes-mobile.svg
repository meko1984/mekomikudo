<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 590" role="img" aria-labelledby="t d"><title id="t">坐薬の3つの目的</title><desc id="d">全身作用、直腸局所作用、排便促進を縦に示す</desc><defs><style>.h{font:700 19px system-ui,sans-serif;fill:#173b47}.s{font:600 15px system-ui,sans-serif;fill:#46616b}.n{font:700 19px system-ui,sans-serif;fill:#fff}</style></defs><rect width="360" height="590" rx="22" fill="#f3f8fa"/><text x="180" y="39" class="h" text-anchor="middle">目的で観察が変わる</text><g transform="translate(28 67)"><rect width="304" height="145" rx="20" fill="#fff" stroke="#47879a" stroke-width="3"/><circle cx="47" cy="42" r="25" fill="#47879a"/><text x="47" y="49" class="n" text-anchor="middle">全</text><text x="182" y="46" class="h" text-anchor="middle">全身作用</text><text x="152" y="87" class="s" text-anchor="middle">解熱・鎮痛・抗けいれん</text><text x="152" y="116" class="s" text-anchor="middle">量・間隔・全身状態</text></g><g transform="translate(28 230)"><rect width="304" height="145" rx="20" fill="#fff" stroke="#6b9b7c" stroke-width="3"/><circle cx="47" cy="42" r="25" fill="#6b9b7c"/><text x="47" y="49" class="n" text-anchor="middle">局</text><text x="182" y="46" class="h" text-anchor="middle">局所作用</text><text x="152" y="87" class="s" text-anchor="middle">直腸・肛門の粘膜へ</text><text x="152" y="116" class="s" text-anchor="middle">保持・出血・刺激感</text></g><g transform="translate(28 393)"><rect width="304" height="145" rx="20" fill="#fff" stroke="#d08b57" stroke-width="3"/><circle cx="47" cy="42" r="25" fill="#d08b57"/><text x="47" y="49" class="n" text-anchor="middle">便</text><text x="182" y="46" class="h" text-anchor="middle">排便促進</text><text x="152" y="87" class="s" text-anchor="middle">直腸刺激・便軟化</text><text x="152" y="116" class="s" text-anchor="middle">便・腹痛・血圧</text></g></svg>
