<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="t d"><title id="t">直腸内与薬の照合</title><desc id="d">基本の与薬照合と直腸投与特有の確認を縦に示す</desc><defs><style>.h{font:700 19px system-ui,sans-serif;fill:#173b47}.s{font:600 15px system-ui,sans-serif;fill:#46616b}.w{font:700 18px system-ui,sans-serif;fill:#fff}</style></defs><rect width="360" height="610" rx="22" fill="#f3f8fa"/><rect x="28" y="28" width="304" height="240" rx="20" fill="#fff" stroke="#47879a" stroke-width="3"/><text x="180" y="66" class="h" text-anchor="middle">基本の与薬照合</text><g class="s"><text x="55" y="106">✓ 患者・薬剤・規格・個数</text><text x="55" y="140">✓ 時刻・経路・目的</text><text x="55" y="174">✓ 前回時刻・1日総量</text><text x="55" y="208">✓ アレルギー・併用薬</text><text x="55" y="242">✓ 期限・包装・保管</text></g><circle cx="180" cy="302" r="25" fill="#d08b57"/><text x="180" y="309" class="w" text-anchor="middle">＋</text><rect x="28" y="340" width="304" height="240" rx="20" fill="#fff" stroke="#6b9b7c" stroke-width="3"/><text x="180" y="378" class="h" text-anchor="middle">直腸投与の追加確認</text><g class="s"><text x="55" y="418">✓ 出血・痛み・手術歴</text><text x="55" y="452">✓ 最終排便・下痢・硬便</text><text x="55" y="486">✓ 保持できる状態か</text><text x="55" y="520">✓ 同一成分・坐薬の重複</text><text x="55" y="554">✓ 分割・挿入方向の指示</text></g></svg>
