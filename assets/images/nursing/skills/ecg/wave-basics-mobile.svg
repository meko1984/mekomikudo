<svg xmlns="http://www.w3.org/2000/svg" width="390" height="600" viewBox="0 0 390 600" role="img" aria-labelledby="title desc">
  <title id="title">P・Q・R・S・T波と心電図の間隔</title><desc id="desc">スマートフォン向けに、一拍の波形上でP波、Q波、R波、S波、T波を引き出し線で示す。</desc>
  <defs><pattern id="small" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#f2d8dc" stroke-width="1"/></pattern><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="url(#small)"/><path d="M40 0H0V40" fill="none" stroke="#ddaab1" stroke-width="1.2"/></pattern></defs>
  <rect width="390" height="600" rx="22" fill="#fff"/>
  <g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47">
    <text x="195" y="32" text-anchor="middle" font-size="18" font-weight="700">P → Q → R → S → T</text><rect x="18" y="49" width="354" height="236" rx="14" fill="url(#grid)"/>
    <path d="M29 188 H72 C79 188 82 165 94 165 C106 165 109 188 119 188 H157 L167 198 L180 84 L194 220 L207 188 H252 C263 188 267 148 290 148 C313 148 319 188 338 188 H361" fill="none" stroke="#246f82" stroke-width="3.7" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="none" stroke="#5c7078" stroke-width="1.4"><path d="M94 165 L83 111 L61 96"/><path d="M167 198 L146 143 L130 132"/><path d="M180 84 L201 70 L218 70"/><path d="M194 220 L217 239 L232 239"/><path d="M290 148 L313 112 L330 102"/><circle cx="94" cy="165" r="2.7" fill="#397888" stroke="none"/><circle cx="167" cy="198" r="2.7" fill="#9c5361" stroke="none"/><circle cx="180" cy="84" r="2.7" fill="#9c5361" stroke="none"/><circle cx="194" cy="220" r="2.7" fill="#9c5361" stroke="none"/><circle cx="290" cy="148" r="2.7" fill="#337758" stroke="none"/></g>
    <g font-size="14" font-weight="800" text-anchor="middle"><text x="51" y="94" fill="#397888">P波</text><text x="120" y="130" fill="#9c5361">Q波</text><text x="233" y="75" fill="#9c5361">R波</text><text x="247" y="245" fill="#9c5361">S波</text><text x="341" y="102" fill="#337758">T波</text></g>
    <g fill="none" stroke="#6e7f85" stroke-width="1.5"><path d="M72 300 V313 M157 300 V313 M72 306.5 H157"/><path d="M157 334 V347 M207 334 V347 M157 340.5 H207"/><path d="M157 368 V381 M338 368 V381 M157 374.5 H338"/></g>
    <g font-size="13" text-anchor="middle"><text x="114" y="329">PR 0.12〜0.20秒</text><text x="182" y="363">QRS &lt;0.12秒</text><text x="247" y="397">QT間隔（QTcで評価）</text></g>
    <rect x="24" y="424" width="342" height="127" rx="16" fill="#f4fafb"/><g font-size="14"><text x="45" y="454" font-weight="700" fill="#397888">P</text><text x="79" y="454">心房の脱分極</text><text x="45" y="484" font-weight="700" fill="#9c5361">QRS</text><text x="79" y="484">心室の脱分極</text><text x="45" y="514" font-weight="700" fill="#8e5c28">ST</text><text x="79" y="514">QRS終末からT波開始まで</text><text x="45" y="544" font-weight="700" fill="#337758">T</text><text x="79" y="544">心室の再分極</text></g>
    <rect x="55" y="564" width="280" height="25" rx="9" fill="#fff0dc"/><text x="195" y="581" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8e5c28">25 mm/秒：小マスは0.04秒</text>
  </g>
</svg>
