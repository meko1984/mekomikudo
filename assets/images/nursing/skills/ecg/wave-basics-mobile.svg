<svg xmlns="http://www.w3.org/2000/svg" width="390" height="560" viewBox="0 0 390 560" role="img" aria-labelledby="t d"><title id="t">心電図の基本波形</title><desc id="d">基本波形と間隔をスマートフォン向けに縦に示す。</desc><defs><pattern id="small" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#f1cfd3" stroke-width="1"/></pattern><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="url(#small)"/><path d="M40 0H0V40" fill="none" stroke="#df9da6" stroke-width="1.2"/></pattern></defs><rect width="390" height="560" rx="22" fill="#fff"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><text x="195" y="34" text-anchor="middle" font-size="17" font-weight="700">一拍を順番に追う</text><rect x="20" y="56" width="350" height="210" rx="14" fill="url(#grid)"/><path d="M34 178h48c8 0 12-27 24-27s16 27 25 27h31l12-10 12 22 15-111 17 145 15-46h35l10-7h15c13 0 18-42 40-42s28 49 47 49h10" fill="none" stroke="#246f82" stroke-width="4"/><g font-size="14" font-weight="700" text-anchor="middle"><text x="106" y="126" fill="#397888">P波</text><text x="201" y="76" fill="#9c5361">QRS波</text><text x="249" y="158" fill="#8e5c28">ST</text><text x="313" y="113" fill="#337758">T波</text></g><rect x="25" y="294" width="340" height="202" rx="17" fill="#f4fafb"/><g font-size="14"><text x="47" y="330" font-weight="700" fill="#397888">P波</text><text x="130" y="330">心房の脱分極</text><text x="47" y="368" font-weight="700">PR</text><text x="130" y="368">0.12〜0.20秒</text><text x="47" y="406" font-weight="700" fill="#9c5361">QRS</text><text x="130" y="406">心室の脱分極・幅 &lt;0.12秒</text><text x="47" y="444" font-weight="700" fill="#337758">ST・T</text><text x="130" y="444">心室の再分極</text><text x="47" y="482" font-weight="700">QT</text><text x="130" y="482">心拍数で補正してQTc</text></g><rect x="55" y="516" width="280" height="28" rx="10" fill="#fff0dc"/><text x="195" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#8e5c28">25 mm/秒：