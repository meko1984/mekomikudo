<svg xmlns="http://www.w3.org/2000/svg" width="390" height="560" viewBox="0 0 390 560" role="img" aria-labelledby="t d"><title id="t">モニター心電図と12誘導心電図</title><desc id="d">連続監視と多方向記録の違いを縦に示す。</desc><rect width="390" height="560" rx="22" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><rect x="25" y="24" width="340" height="212" rx="19" fill="#fff" stroke="#4f95a8" stroke-width="3"/><text x="195" y="59" text-anchor="middle" font-size="21" font-weight="700">モニター心電図</text><text x="195" y="86" text-anchor="middle" font-size="15" fill="#397888">時間を連続して追う</text><path d="M54 132h36l12-19 14 41 16-65 18 57 12-22 15 9h158" fill="none" stroke="#2d8497" stroke-width="4"/><text x="195" y="184" text-anchor="middle" font-size="14">心拍数・リズム・アラーム</text><text x="195" y="210" text-anchor="middle" font-size="14">変化した時刻を保存</text><rect x="25" y="258" width="340" height="212" rx="19" fill="#fff" stroke="#b56b79" stroke-width="3"/><text x="195" y="293" text-anchor="middle" font-size="21" font-weight="700">12誘導心電図</text><text x="195" y="320" text-anchor="middle" font-size="15" fill="#9c5361">一時点を12方向から見る</text><g stroke="#b56b79" stroke-width="2" fill="none"><path d="M53 356h84l13-12 15 29 15-48 17 43 13-15 15 3h112"/><path d="M53 387h108l12-10 14 25 15-42 16 38 12-12h107"/></g><text x="195" y="431" text-anchor="middle" font-size="14">不整脈・伝導・虚血を評価</text><rect x="25" y="494" width="340" height="44" rx="13" fill="#fff0dc"/><text x="195" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#8e5c28">患者の意識・呼吸・脈拍・血圧と</text><text x="195" y="531" text-anchor="middle" font-size="13" font-weight="700" fill="#8e5c28">必ず結びつける</text></g></svg>
