<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="t d"><title id="t">モニター心電図と12誘導心電図</title><desc id="d">連続監視と多方向の記録という二つの役割を比較する。</desc><rect width="880" height="340" rx="24" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><rect x="40" y="42" width="370" height="238" rx="22" fill="#fff" stroke="#4f95a8" stroke-width="3"/><text x="225" y="82" text-anchor="middle" font-size="23" font-weight="700">モニター心電図</text><text x="225" y="111" text-anchor="middle" font-size="16" fill="#397888">時間を連続して追う</text><path d="M80 161h38l12-23 16 48 18-81 20 70 14-29 16 15h115" fill="none" stroke="#2d8497" stroke-width="4" stroke-linejoin="round"/><text x="225" y="223" text-anchor="middle" font-size="15">心拍数・リズム・アラーム</text><text x="225" y="251" text-anchor="middle" font-size="15">変化した時刻を保存</text><rect x="470" y="42" width="370" height="238" rx="22" fill="#fff" stroke="#b56b79" stroke-width="3"/><text x="655" y="82" text-anchor="middle" font-size="23" font-weight="700">12誘導心電図</text><text x="655" y="111" text-anchor="middle" font-size="16" fill="#9c5361">一時点を12方向から見る</text><g stroke="#b56b79" stroke-width="2" fill="none"><path d="M520 146h110l15-16 15 35 17-57 18 50 14-18 16 6h90"/><path d="M520 174h95l17-13 17 28 15-45 18 42 17-15 16 3h110"/><path d="M520 202h125l12-11 17 25 16-42 16 39 13-12h76"/></g><text x="655" y="246" text-anchor="middle" font-size="15">不整脈・伝導・虚血を評価</text><rect x="187" y="299" width="506" height="30" rx="12" fill="#fff0dc"/><text x="440" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#8e5c28">どちらも患者の意識・呼吸・脈拍・血圧と結びつける</text></g></svg>
