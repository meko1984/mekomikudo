<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d"><title id="t">心電図を読む順番</title><desc id="d">患者確認から比較と報告まで六段階で示す。</desc><rect width="880" height="360" rx="24" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><text x="440" y="42" text-anchor="middle" font-size="22" font-weight="700">毎回、同じ順番で確認する</text><g stroke="#80a5ae" stroke-width="3"><path d="M154 135H176M292 135H314M430 135H452M568 135H590M706 135H728"/></g><g text-anchor="middle"><circle cx="95" cy="135" r="58" fill="#fff" stroke="#b56b79" stroke-width="3"/><text x="95" y="128" font-size="17" font-weight="700">患者・脈</text><text x="95" y="151" font-size="13">最優先</text><circle cx="233" cy="135" r="58" fill="#fff" stroke="#4f95a8" stroke-width="3"/><text x="233" y="128" font-size="17" font-weight="700">心拍数</text><text x="233" y="151" font-size="13">速い／遅い</text><circle cx="371" cy="135" r="58" fill="#fff" stroke="#8873b5" stroke-width="3"/><text x="371" y="128" font-size="17" font-weight="700">規則性</text><text x="371" y="151" font-size="13">R–R・P–P</text><circle cx="509" cy="135" r="58" fill="#fff" stroke="#4f9b75" stroke-width="3"/><text x="509" y="128" font-size="17" font-weight="700">PとQRS</text><text x="509" y="151" font-size="13">関係・幅</text><circle cx="647" cy="135" r="58" fill="#fff" stroke="#ce8247" stroke-width="3"/><text x="647" y="128" font-size="17" font-weight="700">ST・T・QT</text><text x="647" y="151" font-size="13">新しい変化</text><circle cx="785" cy="135" r="58" fill="#fff" stroke="#758b93" stroke-width="3"/><text x="785" y="128" font-size="17" font-weight="700">比較・報告</text><text x="785" y="151" font-size="13">時刻を保存</text></g><rect x="82" y="225" width="716" height="86" rx="18" fill="#fff" stroke="#9ab4bc" stroke-width="2"/><text x="440" y="256" text-anchor="middle" font-size="16" font-weight="700">波形が変でも、まず患者へ</text><text x="440" y="284" text-anchor="middle" font-size="15">意識・呼吸・脈拍・血圧・胸痛・冷汗を確認</text><text x="440" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#a34848">脈なし → 心停止対応　　脈あり＋循環不安定 → 緊急報告</text></g></svg>
