<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">心電図の基本波形</title><desc id="d">P波、PR間隔、QRS波、ST部分、T波、QT間隔を一つの波形上に示す。</desc><defs><pattern id="small" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#f1cfd3" stroke-width="1"/></pattern><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#small)"/><path d="M50 0H0V50" fill="none" stroke="#df9da6" stroke-width="1.3"/></pattern></defs><rect width="880" height="390" rx="24" fill="#fff"/><rect x="30" y="54" width="820" height="230" rx="16" fill="url(#grid)"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><text x="440" y="35" text-anchor="middle" font-size="21" font-weight="700">興奮の始まりから再分極までを一拍で追う</text><path d="M55 194h105c10 0 15-33 30-33s20 33 31 33h55l15-13 14 27 17-127 19 174 18-61h72l11-8h32c15 0 21-50 50-50s35 58 60 58h216" fill="none" stroke="#246f82" stroke-width="4" stroke-linejoin="round"/><g font-size="16" font-weight="700" text-anchor="middle"><text x="190" y="130" fill="#397888">P波</text><text x="322" y="62" fill="#9c5361">QRS波</text><text x="428" y="164" fill="#8e5c28">ST部分</text><text x="514" y="118" fill="#337758">T波</text></g><g stroke="#6e7f85" stroke-width="2"><path d="M160 246v18M276 246v18M160 257h116"/><path d="M276 296v18M360 296v18M276 307h84"/><path d="M276 336v18M555 336v18M276 347h279"/></g><g font-size="14" text-anchor="middle"><text x="218" y="282">PR間隔 0.12〜0.20秒</text><text x="318" y="331">QRS幅 &lt;0.12秒</text><text x="416" y="373">QT間隔（心拍数で補正してQTc）</text></g><rect x="646" y="86" width="180" height="74" rx="14" fill="#f4fafb"/><text x="736" y="115" text-anchor="middle" font-size="14" font-weight="700">25 mm/秒</text><text x="736" y="140" text-anchor="middle" font-size="14">小マス 0.04秒</text></g></svg>
