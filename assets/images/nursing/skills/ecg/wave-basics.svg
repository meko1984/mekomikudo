<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">P・Q・R・S・T波と心電図の間隔</title>
  <desc id="desc">一拍の心電図波形上で、P波、Q波、R波、S波、T波をそれぞれ引き出し線で示し、PR間隔、QRS幅、ST部分、QT間隔を示す。</desc>
  <defs><pattern id="small" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#f2d8dc" stroke-width="1"/></pattern><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#small)"/><path d="M50 0H0V50" fill="none" stroke="#ddaab1" stroke-width="1.2"/></pattern></defs>
  <rect width="880" height="420" rx="24" fill="#fff"/>
  <g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47">
    <text x="440" y="34" text-anchor="middle" font-size="21" font-weight="700">P → Q → R → S → T を一拍の波形で追う</text><rect x="28" y="53" width="824" height="235" rx="16" fill="url(#grid)"/>
    <path d="M52 203 H146 C158 203 163 174 181 174 C199 174 204 203 218 203 H279 L294 215 L313 91 L333 239 L351 203 H437 C453 203 458 156 494 156 C530 156 538 203 565 203 H828" fill="none" stroke="#246f82" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="none" stroke="#5c7078" stroke-width="1.7"><path d="M181 174 L181 119 L136 96"/><path d="M294 215 L276 153 L249 133"/><path d="M313 91 L339 72 L365 72"/><path d="M333 239 L365 248 L390 248"/><path d="M494 156 L525 116 L550 105"/><circle cx="181" cy="174" r="3" fill="#397888" stroke="none"/><circle cx="294" cy="215" r="3" fill="#9c5361" stroke="none"/><circle cx="313" cy="91" r="3" fill="#9c5361" stroke="none"/><circle cx="333" cy="239" r="3" fill="#9c5361" stroke="none"/><circle cx="494" cy="156" r="3" fill="#337758" stroke="none"/></g>
    <g font-size="17" font-weight="800" text-anchor="middle"><text x="123" y="94" fill="#397888">P波</text><text x="236" y="131" fill="#9c5361">Q波</text><text x="383" y="78" fill="#9c5361">R波</text><text x="409" y="254" fill="#9c5361">S波</text><text x="570" y="105" fill="#337758">T波</text></g>
    <g fill="none" stroke="#6e7f85" stroke-width="1.8"><path d="M146 304 V319 M279 304 V319 M146 311.5 H279"/><path d="M279 340 V355 M351 340 V355 M279 347.5 H351"/><path d="M351 271 V286 M437 271 V286 M351 278.5 H437"/><path d="M279 376 V391 M565 376 V391 M279 383.5 H565"/></g>
    <g font-size="14" text-anchor="middle"><text x="212" y="337">PR間隔 0.12〜0.20秒</text><text x="315" y="373">QRS幅 &lt;0.12秒</text><text x="394" y="267" fill="#8e5c28" font-weight="700">ST部分</text><text x="422" y="409">QT間隔（心拍数で補正してQTc）</text></g>
    <rect x="656" y="86" width="171" height="69" rx="13" fill="#f4fafb"/><text x="741" y="113" text-anchor="middle" font-size="14" font-weight="700">25 mm/秒</text><text x="741" y="138" text-anchor="middle" font-size="14">小マス 0.04秒</text>
  </g>
</svg>
