<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" role="img" aria-labelledby="title desc">
  <title id="title">MCL1・MCL5・NASA誘導の電極位置</title>
  <desc id="desc">患者を正面から見た胸部に、骨の目印と各修正胸部誘導の陽極と陰極を縦に示す。</desc>
  <defs>
    <g id="body" fill="none" stroke="#76a3ad" stroke-width="3">
      <circle cx="69" cy="25" r="21"/>
      <path d="M57 46V62C27 68 13 88 10 121L1 206 25 210 33 145V280H105V145L113 210 137 206 128 121C125 88 111 68 81 62V46"/>
      <path d="M31 83Q50 73 66 86M72 86Q88 73 107 83"/>
      <path d="M69 87V205" stroke="#b5cbd0" stroke-width="7"/>
    </g>
  </defs>
  <rect width="390" height="900" rx="22" fill="#f7fbfc"/>
  <g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47">
    <text x="195" y="31" text-anchor="middle" font-size="18" font-weight="700">骨の目印から電極位置を確認</text>

    <g transform="translate(18 48)">
      <rect width="354" height="250" rx="16" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="800" fill="#17677a">MCL1</text>
      <use href="#body" transform="translate(107 37) scale(.68)"/>
      <circle cx="190" cy="102" r="10" fill="#d64045"/><text x="190" y="107" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">−</text>
      <path d="M200 102H281" stroke="#d64045" stroke-width="2"/><text x="287" y="99" font-size="12" fill="#7e3840">左鎖骨下</text><text x="287" y="115" font-size="11" fill="#7e3840">陰極</text>
      <circle cx="163" cy="143" r="10" fill="#246f82"/><text x="163" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">＋</text>
      <path d="M153 143H67" stroke="#246f82" stroke-width="2"/><text x="24" y="140" font-size="12" fill="#246f82">V1位置</text><text x="24" y="156" font-size="11" fill="#246f82">陽極</text>
      <text x="177" y="243" text-anchor="middle" font-size="13">第4肋間・胸骨右縁</text>
    </g>

    <g transform="translate(18 314)">
      <rect width="354" height="250" rx="16" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="800" fill="#17677a">MCL5</text>
      <use href="#body" transform="translate(107 37) scale(.68)"/>
      <circle cx="190" cy="102" r="10" fill="#d64045"/><text x="190" y="107" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">−</text>
      <path d="M200 102H281" stroke="#d64045" stroke-width="2"/><text x="287" y="99" font-size="12" fill="#7e3840">左鎖骨下</text><text x="287" y="115" font-size="11" fill="#7e3840">陰極</text>
      <path d="M154 166H212" stroke="#7faab4" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="212" cy="166" r="10" fill="#246f82"/><text x="212" y="171" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">＋</text>
      <path d="M222 166H286" stroke="#246f82" stroke-width="2"/><text x="250" y="184" font-size="11" fill="#246f82">V5・陽極</text>
      <text x="177" y="243" text-anchor="middle" font-size="13">V4と同じ高さ・左前腋窩線</text>
    </g>

    <g transform="translate(18 580)">
      <rect width="354" height="250" rx="16" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="800" fill="#17677a">NASA</text>
      <use href="#body" transform="translate(107 37) scale(.68)"/>
      <circle cx="154" cy="106" r="10" fill="#d64045"/><text x="154" y="111" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">−</text>
      <path d="M144 106H66" stroke="#d64045" stroke-width="2"/><text x="23" y="103" font-size="12" fill="#7e3840">胸骨上端</text><text x="23" y="119" font-size="11" fill="#7e3840">陰極</text>
      <path d="M154 117V170" stroke="#9dbbc2" stroke-width="2" stroke-dasharray="5 4"/>
      <circle cx="154" cy="181" r="10" fill="#246f82"/><text x="154" y="186" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">＋</text>
      <path d="M164 181H270" stroke="#246f82" stroke-width="2"/><text x="275" y="178" font-size="12" fill="#246f82">胸骨下端</text><text x="275" y="194" font-size="11" fill="#246f82">陽極</text>
      <text x="177" y="243" text-anchor="middle" font-size="13">胸骨内に上下2電極を配置</text>
    </g>

    <g transform="translate(79 865)"><circle r="7" fill="#246f82"/><text x="13" y="5" font-size="13">陽極（＋）</text><circle cx="122" r="7" fill="#d64045"/><text x="135" y="5" font-size="13">陰極（−）</text></g>
    <text x="195" y="890" text-anchor="middle" font-size="12" fill="#58717a">左右は患者本人から見た側</text>
  </g>
</svg>
