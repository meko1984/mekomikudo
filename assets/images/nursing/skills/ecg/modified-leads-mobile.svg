<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" role="img" aria-labelledby="title desc">
  <title id="title">MCL1・MCL5・NASA誘導の電極位置</title><desc id="desc">MCL1、MCL5、NASA誘導の陽極と陰極の位置を縦に示す。</desc><rect width="390" height="900" rx="22" fill="#f7fbfc"/>
  <g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><text x="195" y="31" text-anchor="middle" font-size="18" font-weight="700">陽極（＋）と陰極（−）を確認</text>
    <g transform="translate(18 48)"><rect width="354" height="250" rx="16" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="800" fill="#17677a">MCL1</text><g transform="translate(107 37) scale(.68)" fill="none" stroke="#76a3ad" stroke-width="3"><circle cx="69" cy="25" r="21"/><path d="M57 46 V62 C27 68 13 88 10 121 L1 206 L25 210 L33 145 V280 H105 V145 L113 210 L137 206 L128 121 C125 88 111 68 81 62 V46"/><path d="M69 63 V257"/></g><circle cx="190" cy="102" r="10" fill="#d64045"/><text x="190" y="107" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">−</text><path d="M200 102 H281" stroke="#d64045" stroke-width="2"/><text x="287" y="99" font-size="12" fill="#7e3840">左鎖骨下</text><text x="287" y="115" font-size="11" fill="#7e3840">陰極</text><circle cx="163" cy="143" r="10" fill="#246f82"/><text x="163" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">＋</text><path d="M153 143 H67" stroke="#246f82" stroke-width="2"/><text x="24" y="140" font-size="12" fill="#246f82">V1位置</text><text x="24" y="156" font-size="11" fill="#246f82">陽極</text><text x="177" y="231" text-anchor="middle" font-size="13">第4肋間・胸骨右縁</text></g>
    <g transform="translate(18 314)"><rect width="354" height="250" rx="16" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="800" fill="#17677a">MCL5</text><g transform="translate(107 37) scale(.68)" fill="none" stroke="#76a3ad" stroke-width="3"><circle cx="69" cy="25" r="21"/><path d="M57 46 V62 C27 68 13 88 10 121 L1 206 L25 210 L33 145 V280 H105 V145 L113 210 L137 206 L128 121 C125 88 111 68 81 62 V46"/><path d="M69 63 V257"/></g><circle cx="190" cy="102" r="10" fill="#d64045"/><text x="190" y="107" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">−</text><path d="M200 102 H281" stroke="#d64045" stroke-width="2"/><text x="287" y="99" font-size="12" fill="#7e3840">左鎖骨下</text><text x="287" y="115" font-size="11" fill="#7e3840">陰極</text><circle cx="202" cy="166" r="10" fill="#246f82"/><text x="202" y="171" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">＋</text><path d="M212 166 H286" stroke="#246f82" stroke-width="2"/><text x="253" y="184" font-size="11" fill="#246f82">V5・陽極</text><text x="177" y="231" text-anchor="middle" font-size="13">V4と同じ高さ・左前腋窩線</text></g>
    <g transform="translate(18 580)"><rect width="354" height="250" rx="16" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="800" fill="#17677a">NASA</text><g transform="translate(107 37) scale(.68)" fill="none" stroke="#76a3ad" stroke-width="3"><circle cx="69" cy="25" r="21"/><path d="M57 46 V62 C27 68 13 88 10 121 L1 206 L25 210 L33 145 V280 H105 V145 L113 210 L137 206 L128 121 C125 88 111 68 81 62 V46"/><path d="M69 63 V257"/></g><circle cx="154" cy="106" r="10" fill="#d64045"/><text x="154" y="111" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">−</text><path d="M144 106 H66" stroke="#d64045" stroke-width="2"/><text x="23" y="103" font-size="12" fill="#7e3840">胸骨上端</text><text x="23" y="119" font-size="11" fill="#7e3840">陰極</text><circle cx="154" cy="192" r="10" fill="#246f82"/><text x="154" y="197" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">＋</text><path d="M164 192 H270" stroke="#246f82" stroke-width="2"/><text x="275" y="189" font-size="12" fill="#246f82">胸骨下端</text><text x="275" y="205" font-size="11" fill="#246f82">陽極</text><text x="177" y="231" text-anchor="middle" font-size="13">基準電極は機器手順で確認</text></g>
    <g transform="translate(79 865)"><circle cx="0" cy="0" r="7" fill="#246f82"/><text x="13" y="5" font-size="13">陽極（＋）</text><circle cx="122" cy="0" r="7" fill="#d64045"/><text x="135" y="5" font-size="13">陰極（−）</text></g><text x="195" y="890" text-anchor="middle" font-size="12" fill="#58717a">左右は患者本人から見た側</text>
  </g>
</svg>
