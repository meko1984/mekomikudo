<svg xmlns="http://www.w3.org/2000/svg" width="390" height="690" viewBox="0 0 390 690" role="img" aria-labelledby="t d"><title id="t">心電図を読む順番</title><desc id="d">患者確認から比較と報告までを縦に示す。</desc><rect width="390" height="690" rx="22" fill="#f4fafb"/><g font-family="system-ui,'Noto Sans JP',sans-serif" fill="#173b47"><text x="195" y="36" text-anchor="middle" font-size="18" font-weight="700">毎回、同じ順番で確認</text><g text-anchor="middle"><rect x="45" y="58" width="300" height="66" rx="17" fill="#fff" stroke="#b56b79" stroke-width="3"/><text x="195" y="84" font-size="17" font-weight="700">1　患者・脈拍</text><text x="195" y="107" font-size="13">意識・呼吸・循環を最優先</text><rect x="45" y="140" width="300" height="58" rx="16" fill="#fff" stroke="#4f95a8" stroke-width="2"/><text x="195" y="174" font-size="16" font-weight="700">2　心拍数</text><rect x="45" y="214" width="300" height="58" rx="16" fill="#fff" stroke="#8873b5" stroke-width="2"/><text x="195" y="248" font-size="16" font-weight="700">3　規則性</text><rect x="45" y="288" width="300" height="58" rx="16" fill="#fff" stroke="#4f9b75" stroke-width="2"/><text x="195" y="322" font-size="16" font-weight="700">4　P波とQRSの関係</text><rect x="45" y="362" width="300" height="58" rx="16" fill="#fff" stroke="#ce8247" stroke-width="2"/><text x="195" y="396" font-size="16" font-weight="700">5　ST・T・QT</text><rect x="45" y="436" width="300" height="58" rx="16" fill="#fff" stroke="#758b93" stroke-width="2"/><text x="195" y="470" font-size="16" font-weight="700">6　比較・保存・報告</text></g><g stroke="#80a5ae" stroke-width="3"><path d="M195 124v16M195 198v16M195 272v16M195 346v16M195 420v16"/></g><rect x="25" y="526" width="340" height="76" rx="16" fill="#fff" stroke="#9ab4bc" stroke-width="2"/><text x="195" y="554" text-anchor="middle" font-size="15" font-weight="700">波形が変でも、まず患者へ</text><text x="195" y="580" text-anchor="middle" font-size="13">胸痛・冷汗・血圧も確認</text><rect x="25" y="620" width="340" height="48" rx="13" fill="#fff0f0"/><text x="195" y="640" text-anchor="middle" font-size="13" font-weight="700" fill="#a34848">脈なし → 心停止対応</text><text x="195" y="658" text-anchor="middle" font-size="13" font-weight="700" fill="#a34848">脈あり＋循環不安定 → 緊急報告</text></g></svg>
