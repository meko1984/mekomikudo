<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">吸引が必要なサイン</title><desc id="d">呼吸音、分泌物、咳、酸素化、人工呼吸器波形を組み合わせる</desc><rect width="320" height="200" rx="22" fill="#f1f8f8"/><text x="18" y="28" fill="#315c61" font-family="sans-serif" font-size="15" font-weight="700">吸引の前に必要性を評価</text><g fill="#fff" stroke="#4d8987" stroke-width="2"><circle cx="53" cy="82" r="27"/><circle cx="130" cy="82" r="27"/><circle cx="207" cy="82" r="27"/><circle cx="91" cy="151" r="27"/><circle cx="245" cy="151" r="27"/></g><g font-family="sans-serif" text-anchor="middle" fill="#315f5d" font-size="12" font-weight="700"><text x="53" y="78">呼吸音</text><text x="53" y="93">変化</text><text x="130" y="78">見える</text><text x="130" y="93">分泌物</text><text x="207" y="78">弱い咳</text><text x="207" y="93">湿性咳嗽</text><text x="91" y="147">SpO₂・</text><text x="91" y="162">努力呼吸</text><text x="245" y="147">波形・</text><text x="245" y="162">気道内圧</text></g></svg>
