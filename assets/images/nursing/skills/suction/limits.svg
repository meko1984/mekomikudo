<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t d"><title id="t">吸引圧・深さ・時間の考え方</title><desc id="d">圧と時間は上限を守り、深さは個別化する</desc><rect width="880" height="320" rx="28" fill="#f3f8f8"/><text x="42" y="52" fill="#264e55" font-family="sans-serif" font-size="24" font-weight="700">圧・深さ・時間を同じ暗記にしない</text><g font-family="sans-serif"><rect x="42" y="86" width="240" height="168" rx="22" fill="#fff" stroke="#4e8b88" stroke-width="3"/><text x="162" y="125" text-anchor="middle" fill="#2c6461" font-size="20" font-weight="700">圧</text><text x="162" y="167" text-anchor="middle" fill="#2c6461" font-size="26" font-weight="700">必要最小限</text><text x="162" y="203" text-anchor="middle" fill="#6d5651" font-size="16">必要最小限・上限を守る</text><rect x="320" y="86" width="240" height="168" rx="22" fill="#fff" stroke="#c2817a" stroke-width="3"/><text x="440" y="125" text-anchor="middle" fill="#7b4d48" font-size="20" font-weight="700">深さ</text><text x="440" y="167" text-anchor="middle" fill="#7b4d48" font-size="25" font-weight="700">個別の規定長</text><text x="440" y="203" text-anchor="middle" fill="#6d5651" font-size="16">固定cmで押し込まない</text><rect x="598" y="86" width="240" height="168" rx="22" fill="#fff" stroke="#4e8b88" stroke-width="3"/><text x="718" y="125" text-anchor="middle" fill="#2c6461" font-size="20" font-weight="700">時間</text><text x="718" y="167" text-anchor="middle" fill="#2c6461" font-size="26" font-weight="700">短時間で終了</text><text x="718" y="203" text-anchor="middle" fill="#6d5651" font-size="16">人工気道は最大15秒</text><text x="440" y="291" text-anchor="middle" fill="#b4514b" font-size="18" font-weight="700">気管分岐部へ当てない・深い吸引を日常的に行わない</text></g></svg>
