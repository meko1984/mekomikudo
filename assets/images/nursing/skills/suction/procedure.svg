<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t d"><title id="t">吸引の基本手順</title><desc id="d">評価、準備、挿入、吸引、回復と再評価の流れ</desc><rect width="880" height="320" rx="28" fill="#f2f8f8"/><text x="40" y="50" fill="#285158" font-family="sans-serif" font-size="24" font-weight="700">必要性から回復確認までが一つの手順</text><path d="M105 155H775" stroke="#9fc6c3" stroke-width="10" stroke-linecap="round"/><g fill="#fff" stroke="#4c8986" stroke-width="4"><circle cx="105" cy="155" r="54"/><circle cx="273" cy="155" r="54"/><circle cx="440" cy="155" r="54"/><circle cx="607" cy="155" r="54"/><circle cx="775" cy="155" r="54"/></g><g font-family="sans-serif" text-anchor="middle" fill="#315f5d" font-size="17" font-weight="700"><text x="105" y="151">評価</text><text x="105" y="174">説明</text><text x="273" y="151">物品</text><text x="273" y="174">圧確認</text><text x="440" y="151">陰圧なしで</text><text x="440" y="174">挿入</text><text x="607" y="151">抜きながら</text><text x="607" y="174">15秒以内</text><text x="775" y="151">回復</text><text x="775" y="174">再評価</text><text x="440" y="268" fill="#b14f49" font-size="18">悪化したら途中でも中止する</text></g></svg>
