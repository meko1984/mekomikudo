<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" role="img" aria-labelledby="title desc"><title id="title">清拭物品の配置</title><desc id="desc">清潔な物品、使用後リネン、廃棄物を縦に分けたスマートフォン用の図。</desc><rect width="320" height="460" rx="22" fill="#f6fbfc"/><g font-family="Arial,'Noto Sans JP',sans-serif"><rect x="22" y="22" width="276" height="230" rx="20" fill="#e5f5f6" stroke="#5e9ca3" stroke-width="3"/><text x="42" y="57" font-size="20" font-weight="700" fill="#285d63">清潔な物品</text><g transform="translate(48 85)" fill="#fff" stroke="#4f8890" stroke-width="3"><path d="M0 60h54l-6-42H6Z"/><path d="M17 18V7h23v11"/><path d="M72 20h62v40H72z"/><path d="M147 20h62v40h-62z"/></g><g text-anchor="middle" font-size="13" fill="#326c73"><text x="75" y="165">湯・容器</text><text x="151" y="165">タオル</text><text x="225" y="165">寝衣</text></g><rect x="48" y="190" width="224" height="38" rx="10" fill="#fff"/><text x="160" y="214" text-anchor="middle" font-size="14" fill="#326c73">保護剤・交換シーツは必要時</text><rect x="22" y="280" width="276" height="70" rx="18" fill="#fff3e5" stroke="#d89c58" stroke-width="3"/><text x="44" y="322" font-size="18" font-weight="700" fill="#745028">使用後リネン</text><path d="M235 300h37l-5 32h-27Z" fill="#fff" stroke="#d89c58" stroke-width="3"/><rect x="22" y="368" width="276" height="70" rx="18" fill="#fff0ed" stroke="#d78474" stroke-width="3"/><text x="44" y="410" font-size="18" font-weight="700" fill="#81483d">廃棄物</text><path d="M235 388h37l-5 32h-27Z" fill="#fff" stroke="#d78474" stroke-width="3"/></g></svg>
