<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="t d"><title id="t">膀胱スキャンと導尿の使い分け</title><desc id="d">排尿状況を確認し、膀胱スキャンを行い、必要時のみ導尿する流れ。</desc><rect width="880" height="330" rx="24" fill="#f7fafc"/><text x="440" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#294f63">まず測る。必要なときだけ挿入する</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(35 80)"><rect width="210" height="180" rx="18" fill="#edf5ff" stroke="#7da9ce" stroke-width="2"/><path d="M65 48q40-30 80 0v46q-40 34-80 0z" fill="#fff" stroke="#598cb5" stroke-width="4"/><path d="M86 44q20 15 38 0" fill="none" stroke="#8cb4d0" stroke-width="4"/><text x="105" y="128" font-size="20" font-weight="700" fill="#406c8e">排尿を確認</text><text x="105" y="157" font-size="14" fill="#526879">時刻・量・症状</text></g><path d="M255 170h45" stroke="#6d94ad" stroke-width="5"/><path d="M300 170l-14-9v18z" fill="#6d94ad"/><g transform="translate(310 80)"><rect width="250" height="180" rx="18" fill="#eaf7f2" stroke="#70b39b" stroke-width="2"/><rect x="35" y="32" width="70" height="78" rx="10" fill="#fff" stroke="#4e9b83" stroke-width="4"/><path d="M50 50h40M50 64h40M50 78h27" stroke="#4e9b83" stroke-width="4"/><path d="M116 49l58 55" stroke="#4e9b83" stroke-width="12" stroke-linecap="round"/><path d="M165 94q24-19 48 0v20h-48z" fill="#fff" stroke="#4e9b83" stroke-width="4"/><text x="125" y="138" font-size="20" font-weight="700" fill="#356f5d">膀胱スキャン</text><text x="125" y="165" font-size="14" fill="#526b63">非侵襲的に推定</text></g><path d="M570 170h45" stroke="#6d94ad" stroke-width="5"/><path d="M615 170l-14-9v18z" fill="#6d94ad"/><g transform="translate(625 80)"><rect width="220" height="180" rx="18" fill="#fff1ee" stroke="#df8b82" stroke-width="2"/><path d="M52 48h100" stroke="#c9655d" stroke-width="9" stroke-linecap="round"/><path d="M152 48q28 0 28 30v30" fill="none" stroke="#c9655d" stroke-width="6"/><path d="M58 35v26" stroke="#c9655d" stroke-width="4"/><path d="M65 101q38-28 76 0v25H65z" fill="#fff" stroke="#df8b82" stroke-width="4"/><text x="110" y="138" font-size="20" font-weight="700" fill="#8c3e39">必要時のみ導尿</text><text x="110" y="165" font-size="14" fill="#6d6260">排出・測定・採取</text></g></g><text x="440" y="302" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526879">測定値だけで決めず、症状・排尿量・経時変化・指示を合わせる</text></svg>
