<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" role="img" aria-labelledby="t d"><title id="t">膀胱スキャンと導尿の使い分け</title><desc id="d">排尿確認から膀胱スキャン、必要時の導尿へ進む縦の流れ。</desc><rect width="420" height="610" rx="22" fill="#f7fafc"/><text x="210" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#294f63">まず測り、必要時だけ挿入</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(50 58)"><rect width="320" height="135" rx="16" fill="#edf5ff" stroke="#7da9ce" stroke-width="2"/><path d="M38 35q34-25 68 0v39q-34 28-68 0z" fill="#fff" stroke="#598cb5" stroke-width="4"/><text x="190" y="55" font-size="20" font-weight="700" fill="#406c8e">排尿を確認</text><text x="190" y="85" font-size="14" fill="#526879">時刻・量・症状</text></g><path d="M210 197v34" stroke="#6d94ad" stroke-width="5"/><path d="M210 231l-9-14h18z" fill="#6d94ad"/><g transform="translate(50 240)"><rect width="320" height="135" rx="16" fill="#eaf7f2" stroke="#70b39b" stroke-width="2"/><rect x="35" y="29" width="55" height="70" rx="8" fill="#fff" stroke="#4e9b83" stroke-width="4"/><path d="M102 47l58 52" stroke="#4e9b83" stroke-width="10"/><text x="210" y="55" font-size="20" font-weight="700" fill="#356f5d">膀胱スキャン</text><text x="210" y="85" font-size="14" fill="#526b63">非侵襲的に推定</text></g><path d="M210 379v34" stroke="#6d94ad" stroke-width="5"/><path d="M210 413l-9-14h18z" fill="#6d94ad"/><g transform="translate(50 422)"><rect width="320" height="135" rx="16" fill="#fff1ee" stroke="#df8b82" stroke-width="2"/><path d="M34 45h92q24 0 24 25v31" fill="none" stroke="#c9655d" stroke-width="8" stroke-linecap="round"/><text x="220" y="55" font-size="20" font-weight="700" fill="#8c3e39">必要時のみ導尿</text><text x="220" y="85" font-size="14" fill="#6d6260">排出・測定・採取</text></g></g><text x="210" y="588" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#526879">症状・排尿量・経時変化も合わせる</text></svg>
