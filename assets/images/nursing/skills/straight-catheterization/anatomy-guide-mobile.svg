<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" role="img" aria-labelledby="t d"><title id="t">尿道走行の違い</title><desc id="d">女性と男性の尿道走行を縦に比較する。</desc><rect width="420" height="610" rx="22" fill="#f7fafc"/><text x="210" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#294f63">角度や長さを固定しない</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(35 60)"><rect width="350" height="225" rx="18" fill="#fff1ee"/><path d="M115 35q60-34 120 0v62q-60 40-120 0z" fill="#fff" stroke="#c9655d" stroke-width="4"/><path d="M175 109v46" stroke="#c9655d" stroke-width="10"/><text x="175" y="188" font-size="20" font-weight="700" fill="#8c3e39">女性</text><text x="175" y="213" font-size="14" fill="#6d6260">尿道口を視認する</text></g><g transform="translate(35 310)"><rect width="350" height="225" rx="18" fill="#edf5ff"/><path d="M115 35q60-34 120 0v62q-60 40-120 0z" fill="#fff" stroke="#598cb5" stroke-width="4"/><path d="M175 109v24q0 25 27 25h52q27 0 27 28" fill="none" stroke="#598cb5" stroke-width="10"/><text x="175" y="188" font-size="20" font-weight="700" fill="#406c8e">男性</text><text x="175" y="213" font-size="14" fill="#526879">長い走行・抵抗を押さない</text></g></g><text x="210" y="580" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#526879">患者・製品・手順に合わせる</text></svg>
