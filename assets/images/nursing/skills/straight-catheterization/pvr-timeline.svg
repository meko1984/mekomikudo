<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="t d"><title id="t">排尿後残尿量の時間軸</title><desc id="d">排尿前、排尿、排尿後すみやかな測定を時間軸で示す。</desc><rect width="880" height="300" rx="24" fill="#f7fafc"/><text x="440" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#294f63">残尿は「排尿直後の残り」</text><path d="M115 155h650" stroke="#609a88" stroke-width="7" stroke-linecap="round"/><g font-family="sans-serif" text-anchor="middle"><circle cx="145" cy="155" r="18" fill="#edf5ff" stroke="#598cb5" stroke-width="5"/><text x="145" y="103" font-size="19" font-weight="700" fill="#406c8e">排尿前</text><text x="145" y="203" font-size="14" fill="#526879">膀胱内尿量</text><circle cx="390" cy="155" r="23" fill="#eaf7f2" stroke="#4e9b83" stroke-width="5"/><path d="M390 122v-28M377 108l13-14 13 14" fill="none" stroke="#4e9b83" stroke-width="5"/><text x="390" y="78" font-size="19" font-weight="700" fill="#356f5d">排尿</text><text x="390" y="211" font-size="14" fill="#526b63">時刻と排尿量</text><circle cx="690" cy="155" r="23" fill="#fff8df" stroke="#d6a728" stroke-width="5"/><text x="690" y="103" font-size="19" font-weight="700" fill="#735f20">すみやかに測定</text><text x="690" y="203" font-size="14" fill="#746b50">排尿後残尿量</text></g><text x="440" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526879">時間が空けば、新しくつくられた尿も測定値に加わる</text></svg>
