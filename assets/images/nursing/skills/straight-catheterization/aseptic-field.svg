<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="t d"><title id="t">導尿の無菌野</title><desc id="d">滅菌野、患者側、使用後区域を分け、カテーテル先端を汚染しない配置。</desc><rect width="880" height="320" rx="24" fill="#f7fafc"/><text x="440" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#294f63">先端を守り、動線を交差させない</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(25 70)"><rect width="270" height="200" rx="18" fill="#eaf7f2" stroke="#70b39b" stroke-width="3"/><rect x="36" y="37" width="198" height="82" rx="10" fill="#fff" stroke="#4e9b83" stroke-width="4"/><path d="M58 80h130q28 0 28 28" fill="none" stroke="#4e9b83" stroke-width="7" stroke-linecap="round"/><circle cx="58" cy="80" r="8" fill="#4e9b83"/><text x="135" y="151" font-size="20" font-weight="700" fill="#356f5d">滅菌野</text><text x="135" y="178" font-size="14" fill="#526b63">先端・潤滑剤・清拭物品</text></g><g transform="translate(305 70)"><rect width="270" height="200" rx="18" fill="#edf5ff" stroke="#7da9ce" stroke-width="3"/><path d="M62 48q73-34 146 0v67q-73 34-146 0z" fill="#fff" stroke="#598cb5" stroke-width="4"/><circle cx="135" cy="87" r="9" fill="#598cb5"/><text x="135" y="151" font-size="20" font-weight="700" fill="#406c8e">患者側</text><text x="135" y="178" font-size="14" fill="#526879">尿道口を視認・清拭</text></g><g transform="translate(585 70)"><rect width="270" height="200" rx="18" fill="#fff1ee" stroke="#df8b82" stroke-width="3"/><path d="M70 56h130l-16 72H86z" fill="#fff" stroke="#c9655d" stroke-width="4"/><path d="M82 43h106M105 43v-12h60v12" fill="none" stroke="#c9655d" stroke-width="5"/><text x="135" y="151" font-size="20" font-weight="700" fill="#8c3e39">使用後区域</text><text x="135" y="178" font-size="14" fill="#6d6260">尿受け・廃棄物</text></g></g></svg>
