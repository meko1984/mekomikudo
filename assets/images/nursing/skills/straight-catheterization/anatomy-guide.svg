<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="t d"><title id="t">尿道走行の違い</title><desc id="d">女性の短い尿道と男性の長く屈曲する尿道を比較する。</desc><rect width="880" height="350" rx="24" fill="#f7fafc"/><text x="440" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#294f63">角度や長さを固定値にしない</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(55 75)"><rect width="340" height="220" rx="20" fill="#fff1ee"/><path d="M110 42q60-36 120 0v65q-60 43-120 0z" fill="#fff" stroke="#c9655d" stroke-width="4"/><path d="M170 120v48" stroke="#c9655d" stroke-width="10" stroke-linecap="round"/><circle cx="170" cy="178" r="8" fill="#c9655d"/><text x="170" y="202" font-size="20" font-weight="700" fill="#8c3e39">女性</text><text x="170" y="226" font-size="14" fill="#6d6260">尿道口を視認する</text></g><g transform="translate(485 75)"><rect width="340" height="220" rx="20" fill="#edf5ff"/><path d="M110 42q60-36 120 0v65q-60 43-120 0z" fill="#fff" stroke="#598cb5" stroke-width="4"/><path d="M170 118v28q0 28 30 28h45q30 0 30 30" fill="none" stroke="#598cb5" stroke-width="10" stroke-linecap="round"/><circle cx="275" cy="210" r="8" fill="#598cb5"/><text x="170" y="202" font-size="20" font-weight="700" fill="#406c8e">男性</text><text x="170" y="226" font-size="14" fill="#526879">長い走行・抵抗を押さない</text></g></g><path d="M420 100v170" stroke="#c9d6dc" stroke-width="3" stroke-dasharray="8 8"/><text x="440" y="325" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526879">患者の解剖・手術歴・狭窄・製品・院内手順に合わせる</text></svg>
