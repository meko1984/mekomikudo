<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
  <title id="t">尿道の走行と部位</title>
  <desc id="d">膀胱、尿道、尿道口を示す簡略図。女性と男性では尿道の長さや走行が異なる。図は実際の寸法、挿入角度、挿入長を示さない。</desc>
  <rect width="880" height="420" rx="22" fill="#f7fafc"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#294f63">
    <text x="440" y="34" font-size="24" font-weight="700">尿道の走行と部位（模式図）</text>
    <g transform="translate(55 65)"><rect width="340" height="285" rx="18" fill="#fff1ee"/>
    <text x="170" y="28" font-size="20" font-weight="700">女性</text>
    <ellipse cx="170" cy="90" rx="60" ry="40" fill="#fff" stroke="#c9655d" stroke-width="3"/>
    <text x="170" y="96" font-size="17">膀胱</text>
    <path d="M170 130v50" fill="none" stroke="#c9655d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="170" cy="180" r="6" fill="#c9655d"/>
    <path d="M99 156h64" fill="none" stroke="#738f98" stroke-width="1.5"/>
    <text x="61" y="161" font-size="16">尿道</text>
    <path d="M178 180h40" fill="none" stroke="#738f98" stroke-width="1.5"/>
    <text x="252" y="186" font-size="16">尿道口</text></g>
    <g transform="translate(485 65)"><rect width="340" height="285" rx="18" fill="#edf5ff"/>
    <text x="170" y="28" font-size="20" font-weight="700">男性</text>
    <ellipse cx="170" cy="90" rx="60" ry="40" fill="#fff" stroke="#598cb5" stroke-width="3"/>
    <text x="170" y="96" font-size="17">膀胱</text>
    <path d="M170 130v30q0 35 35 35h40q35 0 35 35" fill="none" stroke="#598cb5" stroke-width="9" stroke-linecap="round"/>
    <circle cx="280" cy="230" r="6" fill="#598cb5"/>
    <path d="M99 156h64" fill="none" stroke="#738f98" stroke-width="1.5"/>
    <text x="61" y="161" font-size="16">尿道</text>
    <path d="M280 237l-14 10" fill="none" stroke="#738f98" stroke-width="1.5"/>
    <text x="250" y="263" font-size="16">尿道口</text></g>
    <text x="440" y="376" font-size="16">角度や挿入長を固定して押し込まない</text>
    <text x="440" y="401" font-size="14">実際の寸法・挿入経路を指示する図ではない。</text>
  </g>
</svg>
