<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" role="img" aria-labelledby="t d"><title id="t">排尿後残尿量の時間軸</title><desc id="d">排尿前から排尿、測定までを縦に示す。</desc><rect width="420" height="600" rx="22" fill="#f7fafc"/><text x="210" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#294f63">残尿は「排尿直後の残り」</text><path d="M90 100v390" stroke="#609a88" stroke-width="7" stroke-linecap="round"/><g font-family="sans-serif"><circle cx="90" cy="125" r="19" fill="#edf5ff" stroke="#598cb5" stroke-width="5"/><text x="135" y="119" font-size="20" font-weight="700" fill="#406c8e">排尿前</text><text x="135" y="146" font-size="14" fill="#526879">膀胱内尿量</text><circle cx="90" cy="290" r="23" fill="#eaf7f2" stroke="#4e9b83" stroke-width="5"/><text x="135" y="284" font-size="20" font-weight="700" fill="#356f5d">排尿</text><text x="135" y="311" font-size="14" fill="#526b63">時刻と排尿量</text><circle cx="90" cy="460" r="23" fill="#fff8df" stroke="#d6a728" stroke-width="5"/><text x="135" y="454" font-size="20" font-weight="700" fill="#735f20">すみやかに測定</text><text x="135" y="481" font-size="14" fill="#746b50">排尿後残尿量</text></g><text x="210" y="555" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526879">遅れた場合は測定時刻も記録</text></svg>
