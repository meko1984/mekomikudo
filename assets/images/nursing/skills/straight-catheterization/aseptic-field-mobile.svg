<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" role="img" aria-labelledby="t d"><title id="t">導尿の無菌野</title><desc id="d">滅菌野、患者側、使用後区域を縦に分ける。</desc><rect width="420" height="610" rx="22" fill="#f7fafc"/><text x="210" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#294f63">先端を守り、動線を分ける</text><g font-family="sans-serif"><g transform="translate(30 60)"><rect width="360" height="150" rx="16" fill="#eaf7f2" stroke="#70b39b" stroke-width="3"/><path d="M35 55h95q25 0 25 25" fill="none" stroke="#4e9b83" stroke-width="8"/><circle cx="35" cy="55" r="8" fill="#4e9b83"/><text x="190" y="55" font-size="20" font-weight="700" fill="#356f5d">滅菌野</text><text x="190" y="84" font-size="14" fill="#526b63">先端・潤滑・清拭物品</text></g><g transform="translate(30 230)"><rect width="360" height="150" rx="16" fill="#edf5ff" stroke="#7da9ce" stroke-width="3"/><path d="M31 40q63-28 126 0v55q-63 28-126 0z" fill="#fff" stroke="#598cb5" stroke-width="4"/><text x="205" y="55" font-size="20" font-weight="700" fill="#406c8e">患者側</text><text x="205" y="84" font-size="14" fill="#526879">尿道口を視認・清拭</text></g><g transform="translate(30 400)"><rect width="360" height="150" rx="16" fill="#fff1ee" stroke="#df8b82" stroke-width="3"/><path d="M38 42h108l-14 65H52z" fill="#fff" stroke="#c9655d" stroke-width="4"/><text x="205" y="55" font-size="20" font-weight="700" fill="#8c3e39">使用後区域</text><text x="205" y="84" font-size="14" fill="#6d6260">尿受け・廃棄物</text></g></g></svg>
