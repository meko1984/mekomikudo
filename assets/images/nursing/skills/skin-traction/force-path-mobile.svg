<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 820" role="img" aria-labelledby="title desc">
  <title id="title">介達牽引の力の伝わり方と確認点</title><desc id="desc">重錘、ロープと滑車、皮膚と包帯、骨の順に力が伝わる。装置、皮膚、患肢の先を確認する縦長図。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#9b5f5f"/></marker></defs>
  <rect width="420" height="820" rx="22" fill="#fbf8f4"/><text x="24" y="38" font-family="sans-serif" font-size="19" font-weight="700" fill="#213b4a">力の道を上から順にたどる</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#243b48">
    <g transform="translate(60 64)"><rect width="300" height="88" rx="15" fill="#fff" stroke="#b99090" stroke-width="3"/><path d="M55 26h48v36H55z" fill="#e7c9c3" stroke="#805252" stroke-width="3"/><path d="M79 8v18" stroke="#805252" stroke-width="4"/><text x="194" y="39" font-size="18" font-weight="700">重錘</text><text x="194" y="64" font-size="14">床・ベッドに触れない</text></g>
    <path d="M210 158v37" stroke="#9b5f5f" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(60 205)"><rect width="300" height="88" rx="15" fill="#fff" stroke="#b99090" stroke-width="3"/><circle cx="79" cy="39" r="22" fill="#e9eef0" stroke="#476b7c" stroke-width="4"/><path d="M30 39h27m44 0h27" stroke="#476b7c" stroke-width="5"/><text x="205" y="35" font-size="18" font-weight="700">滑車・ロープ</text><text x="205" y="61" font-size="14">溝・接触・結び目を確認</text></g>
    <path d="M210 299v37" stroke="#9b5f5f" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(60 346)"><rect width="300" height="88" rx="15" fill="#fff" stroke="#b99090" stroke-width="3"/><rect x="34" y="22" width="88" height="43" rx="18" fill="#f1d8bb" stroke="#9b6a43" stroke-width="3"/><path d="M48 23v41m20-42v43m20-43v43m20-42v41" stroke="#c19069" stroke-width="4"/><text x="208" y="35" font-size="18" font-weight="700">皮膚・包帯</text><text x="208" y="61" font-size="14">ずれ・しわ・食い込み</text></g>
    <path d="M210 440v37" stroke="#9b5f5f" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(60 487)"><rect width="300" height="88" rx="15" fill="#fff" stroke="#b99090" stroke-width="3"/><path d="M79 18v50" stroke="#e2c194" stroke-width="16" stroke-linecap="round"/><text x="208" y="35" font-size="18" font-weight="700">骨</text><text x="208" y="61" font-size="14">皮膚・軟部組織を介して牽引</text></g>
  </g>
  <g font-family="sans-serif" fill="#243b48"><rect x="24" y="610" width="372" height="80" rx="14" fill="#f6ede9"/><text x="42" y="638" font-size="16" font-weight="700">皮膚・固定</text><text x="42" y="663" font-size="14">腓骨頭・踵・足関節の圧迫</text><text x="42" y="684" font-size="14">発赤・水疱・びらん・痛み</text><rect x="24" y="706" width="372" height="88" rx="14" fill="#eef5f6"/><text x="42" y="734" font-size="16" font-weight="700">患肢の先</text><text x="42" y="759" font-size="14">痛み・感覚・運動・色・温度</text><text x="42" y="780" font-size="14">毛細血管再充満・腫脹</text></g>
</svg>
