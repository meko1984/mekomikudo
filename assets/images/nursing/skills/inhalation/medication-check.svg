<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">吸入薬の確認</title><desc id="d">患者、薬剤、濃度、量、希釈、配合、時刻を確認する</desc><rect width="320" height="200" rx="22" fill="#f2f8f8"/><text x="18" y="28" fill="#315d5c" font-family="sans-serif" font-size="15" font-weight="700">処方と手元の薬剤を照合</text><g fill="#fff" stroke="#4d8987" stroke-width="2"><circle cx="56" cy="77" r="27"/><circle cx="132" cy="77" r="27"/><circle cx="208" cy="77" r="27"/><circle cx="94" cy="148" r="27"/><circle cx="246" cy="148" r="27"/></g><g font-family="sans-serif" text-anchor="middle" fill="#315f5d" font-size="12" font-weight="700"><text x="56" y="74">患者</text><text x="56" y="89">薬剤</text><text x="132" y="74">濃度</text><text x="132" y="89">規格</text><text x="208" y="74">1回量</text><text x="208" y="89">全量</text><text x="94" y="145">希釈</text><text x="94" y="160">配合</text><text x="246" y="145">時刻</text><text x="246" y="160">経路</text></g></svg>
