<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">吸入の中止サイン</title><desc id="d">呼吸悪化、酸素化低下、循環変化、意識変化、過敏症を示す</desc><rect width="320" height="200" rx="22" fill="#fbf3f2"/><text x="18" y="28" fill="#7c4945" font-family="sans-serif" font-size="15" font-weight="700">中止して気道・呼吸・循環を評価</text><g fill="#fff" stroke="#bd625b" stroke-width="2"><circle cx="52" cy="79" r="28"/><circle cx="130" cy="79" r="28"/><circle cx="208" cy="79" r="28"/><circle cx="91" cy="151" r="28"/><circle cx="247" cy="151" r="28"/></g><g font-family="sans-serif" text-anchor="middle" fill="#884d49" font-size="12" font-weight="700"><text x="52" y="76">呼吸</text><text x="52" y="91">悪化</text><text x="130" y="76">SpO₂</text><text x="130" y="91">低下</text><text x="208" y="76">頻脈</text><text x="208" y="91">胸痛</text><text x="91" y="148">意識</text><text x="91" y="163">変化</text><text x="247" y="148">腫れ</text><text x="247" y="163">蕁麻疹</text></g></svg>
