<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">ネブライザーの片づけ</title><desc id="d">残液廃棄、分解、洗浄消毒、乾燥、保管の順を示す</desc><rect width="320" height="200" rx="22" fill="#f4f8f5"/><text x="18" y="28" fill="#41634f" font-family="sans-serif" font-size="15" font-weight="700">洗ったあと、乾燥まで</text><path d="M42 101H280" stroke="#aac9b5" stroke-width="7" stroke-linecap="round"/><g fill="#fff" stroke="#5d8a6c" stroke-width="3"><circle cx="43" cy="101" r="28"/><circle cx="102" cy="101" r="28"/><circle cx="161" cy="101" r="28"/><circle cx="220" cy="101" r="28"/><circle cx="279" cy="101" r="28"/></g><g font-family="sans-serif" text-anchor="middle" fill="#41634f" font-size="11" font-weight="700"><text x="43" y="94">残液</text><text x="43" y="115">廃棄</text><text x="102" y="94">分解</text><text x="102" y="115">点検</text><text x="161" y="94">洗浄</text><text x="161" y="115">消毒</text><text x="220" y="94">十分に</text><text x="220" y="115">乾燥</text><text x="279" y="94">清潔</text><text x="279" y="115">保管</text></g><text x="160" y="165" text-anchor="middle" fill="#a14f49" font-family="sans-serif" font-size="13" font-weight="700">残液へ継ぎ足さない</text></svg>
