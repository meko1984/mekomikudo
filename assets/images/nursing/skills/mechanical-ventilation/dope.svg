<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">DOPE</title><desc id="d">換気不良の原因をチューブ位置、閉塞、気胸、機器に分ける</desc><rect width="320" height="200" rx="24" fill="#fff5ec"/><g font-family="sans-serif" text-anchor="middle"><g transform="translate(46 48)"><circle r="27" fill="#f4d1ce"/><text y="8" font-size="25" font-weight="700" fill="#914c47">D</text><text y="51" font-size="12" fill="#713d39">位置</text></g><g transform="translate(122 48)"><circle r="27" fill="#f7dfbd"/><text y="8" font-size="25" font-weight="700" fill="#8b5b1b">O</text><text y="51" font-size="12" fill="#704915">閉塞</text></g><g transform="translate(198 48)"><circle r="27" fill="#d9eef2"/><text y="8" font-size="25" font-weight="700" fill="#285b66">P</text><text y="51" font-size="12" fill="#285b66">気胸</text></g><g transform="translate(274 48)"><circle r="27" fill="#e8e0f1"/><text y="8" font-size="25" font-weight="700" fill="#59476f">E</text><text y="51" font-size="12" fill="#59476f">機器</text></g><rect x="38" y="126" width="244" height="42" rx="18" fill="#fff" stroke="#b56f6a" stroke-width="3"/><text x="160" y="152" font-size="15" font-weight="700" fill="#824944">換気確保と原因確認を同時に</text></g></svg>
