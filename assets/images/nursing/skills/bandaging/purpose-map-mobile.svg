<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650" role="img" aria-labelledby="title desc"><title id="title">包帯の4つの役割</title><desc id="desc">被覆材の固定、圧迫、支持、固定補助を縦に示す。</desc><rect width="420" height="650" rx="22" fill="#f7fafc"/><text x="210" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#294f63">目的で巻き方と観察が変わる</text><g font-family="sans-serif"><g transform="translate(20 62)"><rect width="380" height="130" rx="16" fill="#fff1ee" stroke="#df8b82" stroke-width="2"/><rect x="35" y="30" width="90" height="54" rx="8" fill="#fff" stroke="#c9655d" stroke-width="3"/><path d="M24 50h112M24 65h112" stroke="#e38c83" stroke-width="7"/><text x="155" y="54" font-size="20" font-weight="700" fill="#8c3e39">被覆材を保つ</text><text x="155" y="82" font-size="14" fill="#6d6260">ずれ・汚染を防ぐ</text></g><g transform="translate(20 205)"><rect width="380" height="130" rx="16" fill="#fff8df" stroke="#dfbe55" stroke-width="2"/><path d="M28 66h104M44 42v48M116 42v48" stroke="#d6a728" stroke-width="10" stroke-linecap="round"/><text x="155" y="54" font-size="20" font-weight="700" fill="#735f20">圧迫する</text><text x="155" y="82" font-size="14" fill="#6d654d">止血・腫脹管理</text></g><g transform="translate(20 348)"><rect width="380" height="130" rx="16" fill="#eaf7f2" stroke="#70b39b" stroke-width="2"/><path d="M48 28v72M112 28v72M48 64h64" fill="none" stroke="#4e9b83" stroke-width="11" stroke-linecap="round"/><text x="155" y="54" font-size="20" font-weight="700" fill="#356f5d">支持する</text><text x="155" y="82" font-size="14" fill="#526b63">関節・軟部組織</text></g><g transform="translate(20 491)"><rect width="380" height="130" rx="16" fill="#edf5ff" stroke="#7da9ce" stroke-width="2"/><rect x="64" y="22" width="35" height="82" rx="8" fill="#fff" stroke="#598cb5" stroke-width="4"/><path d="M28 45h108M28 78h108" stroke="#7ca8cc" stroke-width="12" stroke-linecap="round"/><text x="155" y="54" font-size="20" font-weight="700" fill="#406c8e">固定を助ける</text><text x="155" y="82" font-size="14" fill="#526879">副子を保つ</text></g></g></svg>
