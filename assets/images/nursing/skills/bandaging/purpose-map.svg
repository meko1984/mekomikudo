<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="title desc"><title id="title">包帯の4つの役割</title><desc id="desc">被覆材の固定、圧迫、支持、固定補助を4枚のカードで示す。</desc><rect width="880" height="300" rx="24" fill="#f7fafc"/><text x="440" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#294f63">目的が変われば、巻き方と観察も変わる</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(25 72)"><rect width="195" height="190" rx="18" fill="#fff1ee" stroke="#df8b82" stroke-width="2"/><rect x="55" y="35" width="85" height="58" rx="8" fill="#fff" stroke="#c9655d" stroke-width="3"/><path d="M43 58h109M43 72h109" stroke="#e38c83" stroke-width="7" stroke-linecap="round"/><text x="97.5" y="130" font-size="20" font-weight="700" fill="#8c3e39">被覆材を保つ</text><text x="97.5" y="158" font-size="14" fill="#6d6260">ずれ・汚染を防ぐ</text></g><g transform="translate(235 72)"><rect width="195" height="190" rx="18" fill="#fff8df" stroke="#dfbe55" stroke-width="2"/><path d="M48 68h99M63 46v44M132 46v44" stroke="#d6a728" stroke-width="10" stroke-linecap="round"/><path d="M72 31l25 18 25-18" fill="none" stroke="#d6a728" stroke-width="5"/><text x="97.5" y="130" font-size="20" font-weight="700" fill="#735f20">圧迫する</text><text x="97.5" y="158" font-size="14" fill="#6d654d">止血・腫脹管理</text></g><g transform="translate(445 72)"><rect width="195" height="190" rx="18" fill="#eaf7f2" stroke="#70b39b" stroke-width="2"/><path d="M65 39v70M130 39v70M65 76h65" fill="none" stroke="#4e9b83" stroke-width="11" stroke-linecap="round"/><path d="M48 101q49 30 99 0" fill="none" stroke="#77baa5" stroke-width="6"/><text x="97.5" y="130" font-size="20" font-weight="700" fill="#356f5d">支持する</text><text x="97.5" y="158" font-size="14" fill="#526b63">関節・軟部組織</text></g><g transform="translate(655 72)"><rect width="195" height="190" rx="18" fill="#edf5ff" stroke="#7da9ce" stroke-width="2"/><rect x="81" y="30" width="33" height="85" rx="8" fill="#fff" stroke="#598cb5" stroke-width="4"/><path d="M45 54h106M45 82h106" stroke="#7ca8cc" stroke-width="12" stroke-linecap="round"/><text x="97.5" y="130" font-size="20" font-weight="700" fill="#406c8e">固定を助ける</text><text x="97.5" y="158" font-size="14" fill="#526879">副子を保つ</text></g></g></svg>
