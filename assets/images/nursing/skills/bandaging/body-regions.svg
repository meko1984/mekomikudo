<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 590" role="img" aria-labelledby="title desc">
<title id="title">包帯法で説明する主な部位</title>
<desc id="desc">正面から見た身体の模式図。頭部、肘から手関節までの前腕、膝関節、膝から足関節までの下腿を色と引き出し線で示す。</desc>
<style>text{font-family:"Noto Sans JP","Yu Gothic",sans-serif;font-size:17px;fill:#304b5b}.small{font-size:13px}.body{fill:#f3e4da;stroke:#b89b87;stroke-width:2}.area{fill:none;stroke:#78a4b7;stroke-width:14;stroke-linecap:round}.leader{fill:none;stroke:#788e9a;stroke-width:1.5}.joint{fill:#dcecf3;stroke:#78a4b7;stroke-width:2}</style>
<rect width="390" height="590" rx="10" fill="#f8fbfc"/>
<text x="18" y="32">包帯法で説明する主な部位</text>
<circle class="body" cx="195" cy="90" r="31"/>
<path class="body" d="M181 121 L181 135 L157 146 L144 160 L125 231 L106 292 Q101 306 111 310 Q123 314 129 299 L149 240 L159 204 L160 303 L154 393 L152 504 L145 532 Q141 544 155 544 L174 544 L179 517 L183 407 L195 331 L207 407 L211 517 L216 544 L235 544 Q249 544 245 532 L238 504 L236 393 L230 303 L231 204 L241 240 L261 299 Q267 314 279 310 Q289 306 284 292 L265 231 L246 160 L233 146 L209 135 L209 121 Z"/>
<circle cx="195" cy="90" r="34" fill="none" stroke="#78a4b7" stroke-width="5"/>
<path class="area" d="M137 242 L120 296 M167 425 L166 498"/>
<circle class="joint" cx="169" cy="393" r="13"/>
<path class="leader" d="M229 91 H278"/><text x="285" y="96">頭部</text>
<path class="leader" d="M129 267 H86 V241"/><text x="18" y="219">前腕</text><text class="small" x="18" y="239">肘〜手関節</text>
<path class="leader" d="M182 393 H278"/><text x="285" y="399">膝関節</text>
<path class="leader" d="M160 463 H88 V443"/><text x="18" y="420">下腿</text><text class="small" x="18" y="440">膝〜足関節</text>
<text class="small" x="18" y="570">色は部位の説明用。巻く範囲・強さは指示と目的で異なる。</text>
</svg>
