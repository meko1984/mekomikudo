<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="title desc"><title id="title">包帯材料の選択</title><desc id="desc">巻軸帯、弾性包帯、自着性包帯、ネット包帯、三角巾の特徴を示す。</desc><rect width="880" height="320" rx="24" fill="#f7fafc"/><text x="440" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#294f63">素材の性質と部位で選ぶ</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(18 70)"><rect width="158" height="215" rx="16" fill="#fff" stroke="#cddde7"/><circle cx="79" cy="69" r="36" fill="#eef5fa" stroke="#6796b7" stroke-width="5"/><circle cx="79" cy="69" r="14" fill="#fff" stroke="#6796b7" stroke-width="4"/><path d="M111 69h33" stroke="#6796b7" stroke-width="12"/><text x="79" y="135" font-size="18" font-weight="700" fill="#365d75">巻軸帯</text><text x="79" y="164" font-size="13" fill="#667782">固定・被覆</text><text x="79" y="187" font-size="13" fill="#667782">幅を選ぶ</text></g><g transform="translate(190 70)"><rect width="158" height="215" rx="16" fill="#fff8df" stroke="#dfbe55"/><circle cx="79" cy="69" r="36" fill="#fff" stroke="#d6a728" stroke-width="5"/><path d="M111 69h33M122 55l18 14-18 14" fill="none" stroke="#d6a728" stroke-width="7"/><text x="79" y="135" font-size="18" font-weight="700" fill="#735f20">弾性包帯</text><text x="79" y="164" font-size="13" fill="#746b50">伸ばし方で</text><text x="79" y="187" font-size="13" fill="#746b50">圧が変わる</text></g><g transform="translate(362 70)"><rect width="158" height="215" rx="16" fill="#eaf7f2" stroke="#70b39b"/><circle cx="79" cy="69" r="36" fill="#fff" stroke="#4e9b83" stroke-width="5"/><path d="M107 45l31 24-31 24" fill="none" stroke="#4e9b83" stroke-width="7"/><text x="79" y="135" font-size="18" font-weight="700" fill="#356f5d">自着性</text><text x="79" y="164" font-size="13" fill="#526b63">包帯同士が</text><text x="79" y="187" font-size="13" fill="#526b63">付着する</text></g><g transform="translate(534 70)"><rect width="158" height="215" rx="16" fill="#edf5ff" stroke="#7da9ce"/><path d="M43 35h72l14 68H29z" fill="#fff" stroke="#598cb5" stroke-width="4"/><path d="M40 46l78 46M118 46L40 92M36 64h86" stroke="#9bbbd4" stroke-width="3"/><text x="79" y="135" font-size="18" font-weight="700" fill="#406c8e">ネット包帯</text><text x="79" y="164" font-size="13" fill="#526879">形に沿って</text><text x="79" y="187" font-size="13" fill="#526879">被覆材を保持</text></g><g transform="translate(706 70)"><rect width="158" height="215" rx="16" fill="#fff1ee" stroke="#df8b82"/><path d="M31 100L79 31l48 69z" fill="#fff" stroke="#c9655d" stroke-width="5"/><path d="M79 31v69" stroke="#e5a49e" stroke-width="3"/><text x="79" y="135" font-size="18" font-weight="700" fill="#8c3e39">三角巾</text><text x="79" y="164" font-size="13" fill="#6d6260">広い被覆</text><text x="79" y="187" font-size="13" fill="#6d6260">上肢の支持</text></g></g></svg>
