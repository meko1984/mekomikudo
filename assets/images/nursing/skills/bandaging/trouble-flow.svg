<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="title desc"><title id="title">包帯後の異常時対応</title><desc id="desc">異常発見から停止、末梢評価、圧迫解除、連絡、再評価へ進む流れ。</desc><rect width="880" height="300" rx="24" fill="#f7fafc"/><text x="440" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#294f63">異常を見つけたら、圧迫を残さず再評価</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(25 85)"><rect width="140" height="135" rx="18" fill="#fff1ee" stroke="#df8b82" stroke-width="2"/><circle cx="70" cy="45" r="22" fill="#fff" stroke="#c9655d" stroke-width="5"/><path d="M58 33l24 24M82 33L58 57" stroke="#c9655d" stroke-width="5"/><text x="70" y="92" font-size="18" font-weight="700" fill="#8c3e39">止める</text><text x="70" y="116" font-size="12" fill="#6d6260">動作・実施</text></g><path d="M174 152h32" stroke="#c9655d" stroke-width="5"/><path d="M206 152l-12-8v16z" fill="#c9655d"/><g transform="translate(215 85)"><rect width="140" height="135" rx="18" fill="#edf5ff" stroke="#7da9ce" stroke-width="2"/><circle cx="70" cy="45" r="22" fill="#fff" stroke="#598cb5" stroke-width="5"/><path d="M70 31v28M56 45h28" stroke="#598cb5" stroke-width="4"/><text x="70" y="92" font-size="18" font-weight="700" fill="#406c8e">末梢を見る</text><text x="70" y="116" font-size="12" fill="#526879">神経・血流</text></g><path d="M364 152h32" stroke="#598cb5" stroke-width="5"/><path d="M396 152l-12-8v16z" fill="#598cb5"/><g transform="translate(405 85)"><rect width="140" height="135" rx="18" fill="#fff8df" stroke="#dfbe55" stroke-width="2"/><path d="M40 34h60v36H40z" fill="#fff" stroke="#d6a728" stroke-width="4"/><path d="M42 44l56 17M42 59l56-17" stroke="#d6a728" stroke-width="6"/><text x="70" y="92" font-size="18" font-weight="700" fill="#735f20">圧迫を解除</text><text x="70" y="116" font-size="12" fill="#746b50">手順・指示に従う</text></g><path d="M554 152h32" stroke="#d6a728" stroke-width="5"/><path d="M586 152l-12-8v16z" fill="#d6a728"/><g transform="translate(595 85)"><rect width="120" height="135" rx="18" fill="#eaf7f2" stroke="#70b39b" stroke-width="2"/><path d="M42 30h36v42H42z" fill="#fff" stroke="#4e9b83" stroke-width="4"/><path d="M50 42h20M50 52h20M50 62h13" stroke="#4e9b83" stroke-width="3"/><text x="60" y="92" font-size="18" font-weight="700" fill="#356f5d">連絡</text><text x="60" y="116" font-size="12" fill="#526b63">緊急評価</text></g><path d="M724 152h32" stroke="#4e9b83" stroke-width="5"/><path d="M756 152l-12-8v16z" fill="#4e9b83"/><g transform="translate(765 85)"><rect width="90" height="135" rx="18" fill="#f2eef8" stroke="#9b83b4" stroke-width="2"/><path d="M24 48l14 14 29-32" fill="none" stroke="#7e649c" stroke-width="6"/><text x="45" y="92" font-size="17" font-weight="700" fill="#614c78">再評価</text><text x="45" y="116" font-size="12" fill="#6e6477">記録</text></g></g><text x="440" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526879">強い痛み・感覚変化・運動障害・色や温度の変化は、すぐ報告する</text></svg>
