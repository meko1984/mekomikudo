<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title desc"><title id="title">5つの巻き方</title><desc id="desc">環行帯、螺旋帯、折転帯、8の字帯、反復帯を図で比較する。</desc><rect width="880" height="500" rx="24" fill="#f7fafc"/><text x="440" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#294f63">部位の形と動きに合わせる</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(25 70)"><rect width="260" height="185" rx="18" fill="#edf5ff"/><path d="M105 35h50l15 88H90z" fill="#fff" stroke="#78a2bd" stroke-width="3"/><path d="M91 77h78M93 91h74" stroke="#4d89ae" stroke-width="10"/><text x="130" y="150" font-size="20" font-weight="700" fill="#365d75">環行帯</text><text x="130" y="174" font-size="13" fill="#667782">始め・終わりを固定</text></g><g transform="translate(310 70)"><rect width="260" height="185" rx="18" fill="#eaf7f2"/><path d="M105 35h50l15 88H90z" fill="#fff" stroke="#70aa96" stroke-width="3"/><path d="M92 103l75-31M90 84l73-30M94 120l76-31" stroke="#4e9b83" stroke-width="11"/><text x="130" y="150" font-size="20" font-weight="700" fill="#356f5d">螺旋帯</text><text x="130" y="174" font-size="13" fill="#526b63">太さが比較的一定</text></g><g transform="translate(595 70)"><rect width="260" height="185" rx="18" fill="#fff8df"/><path d="M105 35h50l15 88H90z" fill="#fff" stroke="#d5b34d" stroke-width="3"/><path d="M92 105l75-28M95 82l60 18M96 58l65 17" stroke="#d6a728" stroke-width="11"/><path d="M154 93l14-16-20-4" fill="none" stroke="#a9800e" stroke-width="4"/><text x="130" y="150" font-size="20" font-weight="700" fill="#735f20">折転帯</text><text x="130" y="174" font-size="13" fill="#746b50">太さの変化に合わせる</text></g><g transform="translate(165 280)"><rect width="260" height="185" rx="18" fill="#fff1ee"/><circle cx="130" cy="78" r="35" fill="#fff" stroke="#df8b82" stroke-width="3"/><path d="M66 45l128 66M194 45L66 111" stroke="#c9655d" stroke-width="12" stroke-linecap="round"/><text x="130" y="150" font-size="20" font-weight="700" fill="#8c3e39">8の字・亀甲帯</text><text x="130" y="174" font-size="13" fill="#6d6260">関節を交差して支える</text></g><g transform="translate(455 280)"><rect width="260" height="185" rx="18" fill="#f2eef8"/><path d="M95 111V45q35-26 70 0v66" fill="#fff" stroke="#8e78aa" stroke-width="3"/><path d="M107 36v82M124 28v90M142 29v89M158 38v80" stroke="#7e649c" stroke-width="10" stroke-linecap="round"/><path d="M89 104h82" stroke="#7e649c" stroke-width="10"/><text x="130" y="150" font-size="20" font-weight="700" fill="#614c78">反復帯</text><text x="130" y="174" font-size="13" fill="#6e6477">頭部・断端などを覆う</text></g></g></svg>
