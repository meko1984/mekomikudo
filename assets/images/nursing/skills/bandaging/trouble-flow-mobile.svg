<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" role="img" aria-labelledby="title desc"><title id="title">包帯後の異常時対応</title><desc id="desc">異常時対応を縦の流れで示す。</desc><rect width="420" height="700" rx="22" fill="#f7fafc"/><text x="210" y="35" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#294f63">圧迫を残さず再評価する</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(55 58)"><rect width="310" height="100" rx="16" fill="#fff1ee" stroke="#df8b82" stroke-width="2"/><circle cx="55" cy="50" r="23" fill="#fff" stroke="#c9655d" stroke-width="5"/><path d="M43 38l24 24M67 38L43 62" stroke="#c9655d" stroke-width="5"/><text x="135" y="45" font-size="20" font-weight="700" fill="#8c3e39">止める</text><text x="135" y="72" font-size="13" fill="#6d6260">動作・実施を止める</text></g><path d="M210 162v28" stroke="#8aa3b3" stroke-width="5"/><path d="M210 190l-8-12h16z" fill="#8aa3b3"/><g transform="translate(55 196)"><rect width="310" height="100" rx="16" fill="#edf5ff" stroke="#7da9ce" stroke-width="2"/><circle cx="55" cy="50" r="23" fill="#fff" stroke="#598cb5" stroke-width="5"/><path d="M55 36v28M41 50h28" stroke="#598cb5" stroke-width="4"/><text x="135" y="45" font-size="20" font-weight="700" fill="#406c8e">末梢を見る</text><text x="135" y="72" font-size="13" fill="#526879">痛み・感覚・運動・灌流</text></g><path d="M210 300v28" stroke="#8aa3b3" stroke-width="5"/><path d="M210 328l-8-12h16z" fill="#8aa3b3"/><g transform="translate(55 334)"><rect width="310" height="100" rx="16" fill="#fff8df" stroke="#dfbe55" stroke-width="2"/><path d="M28 31h54v38H28z" fill="#fff" stroke="#d6a728" stroke-width="4"/><path d="M30 40l50 20M30 60l50-20" stroke="#d6a728" stroke-width="6"/><text x="135" y="45" font-size="20" font-weight="700" fill="#735f20">圧迫を解除</text><text x="135" y="72" font-size="13" fill="#746b50">手順と指示に従う</text></g><path d="M210 438v28" stroke="#8aa3b3" stroke-width="5"/><path d="M210 466l-8-12h16z" fill="#8aa3b3"/><g transform="translate(55 472)"><rect width="310" height="100" rx="16" fill="#eaf7f2" stroke="#70b39b" stroke-width="2"/><path d="M37 28h36v45H37z" fill="#fff" stroke="#4e9b83" stroke-width="4"/><path d="M44 40h22M44 51h22M44 62h15" stroke="#4e9b83" stroke-width="3"/><text x="135" y="45" font-size="20" font-weight="700" fill="#356f5d">連絡する</text><text x="135" y="72" font-size="13" fill="#526b63">緊急評価につなげる</text></g><path d="M210 576v28" stroke="#8aa3b3" stroke-width="5"/><path d="M210 604l-8-12h16z" fill="#8aa3b3"/><g transform="translate(55 610)"><rect width="310" height="70" rx="16" fill="#f2eef8" stroke="#9b83b4" stroke-width="2"/><path d="M35 34l12 12 25-27" fill="none" stroke="#7e649c" stroke-width="6"/><text x="135" y="35" font-size="20" font-weight="700" fill="#614c78">再評価・記録</text></g></g></svg>
